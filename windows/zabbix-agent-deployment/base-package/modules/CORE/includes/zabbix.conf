# Zabbix Agent package state
UserParameter=zabbix.package.version,powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "if(Test-Path 'C:\ProgramData\BKPCloud\Zabbix\product.version'){Get-Content 'C:\ProgramData\BKPCloud\Zabbix\product.version' -TotalCount 1}else{'UNKNOWN'}"
UserParameter=zabbix.package.client,powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "if(Test-Path 'C:\ProgramData\BKPCloud\Zabbix\client.id'){Get-Content 'C:\ProgramData\BKPCloud\Zabbix\client.id' -TotalCount 1}else{'UNKNOWN'}"
UserParameter=zabbix.package.modules,powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "if(Test-Path 'C:\ProgramData\BKPCloud\Zabbix\modules.detected'){Get-Content 'C:\ProgramData\BKPCloud\Zabbix\modules.detected' -TotalCount 1}else{'UNKNOWN'}"
UserParameter=zabbix.package.lastapply,powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "if(Test-Path 'C:\ProgramData\BKPCloud\Zabbix\lastapply.status'){Get-Content 'C:\ProgramData\BKPCloud\Zabbix\lastapply.status' -TotalCount 1}else{'UNKNOWN'}"
