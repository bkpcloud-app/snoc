name: Diagnose DDM SNOC Windows 2.0.4 release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ddm-snoc-diagnose-release-2.0.4.yml'

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Collect workflow and release status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-status
          RUNS_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ddm-snoc-windows-release.yml/runs?per_page=5"
          RELEASE_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/ddm-snoc-windows-v2.0.4"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "$RUNS_URL" > release-status/workflow-runs-2.0.4.json
          curl -sSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -w '\nHTTP_STATUS=%{http_code}\n' \
            "$RELEASE_URL" > release-status/release-api-2.0.4.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-status/workflow-runs-2.0.4.json release-status/release-api-2.0.4.txt
          git commit -m 'chore(snoc-windows): registra diagnóstico da release 2.0.4'
          git push origin HEAD:main
