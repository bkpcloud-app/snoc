name: Validate DDM SNOC Windows 2.0.6 Runtime

on:
  push:
    paths:
      - '.github/workflows/ddm-snoc-validate-2.0.6-runtime.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: main

      - name: Run complete validation
        id: validate
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference='Stop'
          $Result=Join-Path $env:GITHUB_WORKSPACE 'runtime-validation-result.txt'
          try{
            $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
            . (Join-Path $Product 'config\DDM-Product.ps1')
            if($DDMProduct.ProductVersion -ne '2.0.6'){throw "Versao inesperada: $($DDMProduct.ProductVersion)"}

            foreach($File in @(Get-ChildItem $Product -Filter '*.ps1' -Recurse)){
              $Tokens=$null
              $Errors=$null
              [void][Management.Automation.Language.Parser]::ParseFile($File.FullName,[ref]$Tokens,[ref]$Errors)
              if(@($Errors).Count -gt 0){throw "$($File.FullName): $(@($Errors.Message)-join ' | ')"}
            }

            & (Join-Path $Product 'tools\Test-DDM-Repository.ps1') -ProductRoot $Product
            & (Join-Path $Product 'tools\Test-DDM-RuntimeLexing.ps1') -ProductRoot $Product

            $Dist=Join-Path $env:RUNNER_TEMP 'ddm-2.0.6-validation'
            $Motor=Join-Path $Dist 'DDM-SNOC-WINDOWS-MOTOR-2.0.6'
            $Expanded=Join-Path $env:RUNNER_TEMP 'ddm-2.0.6-validation-expanded'
            Remove-Item $Dist,$Expanded -Recurse -Force -ErrorAction SilentlyContinue
            New-Item $Motor,$Expanded -ItemType Directory -Force | Out-Null
            foreach($Name in @('Start-DDM-SNOC.ps1','CLIENTE.example.ps1','README.md','CHANGELOG.md')){Copy-Item (Join-Path $Product $Name) (Join-Path $Motor $Name) -Force}
            foreach($Name in @('config','lib','central','bootstrap','endpoint','engine','modules','templates','tools','docs','clients')){Copy-Item (Join-Path $Product $Name) (Join-Path $Motor $Name) -Recurse -Force}
            $Zip=Join-Path $Dist 'DDM-SNOC-WINDOWS-MOTOR-2.0.6.zip'
            Compress-Archive -Path $Motor -DestinationPath $Zip -CompressionLevel Optimal
            Expand-Archive -LiteralPath $Zip -DestinationPath $Expanded -Force
            $ExpandedProduct=Join-Path $Expanded 'DDM-SNOC-WINDOWS-MOTOR-2.0.6'
            & (Join-Path $ExpandedProduct 'tools\Test-DDM-Repository.ps1') -ProductRoot $ExpandedProduct
            & (Join-Path $ExpandedProduct 'tools\Test-DDM-RuntimeLexing.ps1') -ProductRoot $ExpandedProduct

            "State=READY Commit=$(git rev-parse HEAD) VerifiedAtUtc=$((Get-Date).ToUniversalTime().ToString('o')) Message=Parser, auditor, runtime mocks e ZIP expandido aprovados." | Set-Content -LiteralPath $Result -Encoding UTF8
          }
          catch{
            $Message=$_.Exception.ToString().Replace("`r",' ').Replace("`n",' ')
            "State=FAILED Commit=$(git rev-parse HEAD) VerifiedAtUtc=$((Get-Date).ToUniversalTime().ToString('o')) Message=$Message" | Set-Content -LiteralPath $Result -Encoding UTF8
            $_ | Format-List * -Force | Out-Host
            exit 1
          }

      - name: Publish validation status
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Source=Join-Path $env:GITHUB_WORKSPACE 'runtime-validation-result.txt'
          if(-not(Test-Path $Source)){"State=FAILED Message=Workflow terminou sem gerar resultado." | Set-Content $Source -Encoding UTF8}
          $Target=Join-Path $env:GITHUB_WORKSPACE 'release-status\ddm-snoc-windows-v2.0.6-validation.txt'
          New-Item (Split-Path -Parent $Target) -ItemType Directory -Force | Out-Null
          Copy-Item $Source $Target -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $Target
          if(-not(git diff --cached --quiet)){
            git commit -m 'chore(snoc-windows): registra validacao runtime 2.0.6'
            git pull --rebase origin main
            git push origin HEAD:main
          }
