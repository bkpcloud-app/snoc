name: Promote central recovery 2.0.19

on:
  push:
    branches:
      - fix/central-updater-recovery-2.0.19
    paths:
      - '.github/workflows/agent-promote-central-recovery-2.0.19.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/central-updater-recovery-2.0.19
          fetch-depth: 0

      - name: Materialize 2.0.19 product contracts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Root=$env:GITHUB_WORKSPACE
          $Product=Join-Path $Root 'windows\zabbix-agent-deployment'
          $Utf8=New-Object Text.UTF8Encoding($false)

          function ReadText([string]$Path){[IO.File]::ReadAllText($Path)}
          function WriteText([string]$Path,[string]$Text){[IO.File]::WriteAllText($Path,$Text,$Utf8)}
          function ReplaceOnce([string]$Text,[string]$Old,[string]$New,[string]$Label){
            $Count=[regex]::Matches($Text,[regex]::Escape($Old)).Count
            if($Count -ne 1){throw "$Label expected once; found=$Count"}
            return $Text.Replace($Old,$New)
          }

          $RepoTestPath=Join-Path $Product 'tools\Test-DDM-Repository.ps1'
          $RepoTest=ReadText $RepoTestPath
          $RepoTest=ReplaceOnce $RepoTest "ProductVersion -eq '2.0.18'" "ProductVersion -eq '2.0.19'" 'Repository version assertion'
          $RepoTest=ReplaceOnce $RepoTest 'ProductVersion deve ser 2.0.18.' 'ProductVersion deve ser 2.0.19.' 'Repository version message'
          WriteText $RepoTestPath $RepoTest

          $PublisherPath=Join-Path $Product 'central\lib\Invoke-DDM-Central-Publish.ps1'
          $Publisher=ReadText $PublisherPath
          $Publisher=ReplaceOnce $Publisher "@('tools\\Set-DDM-CentralRelease.ps1')" "@('tools\\Set-DDM-CentralRelease.ps1','tools\\Recover-DDM-CentralUpdater.ps1')" 'Central tools publication'
          WriteText $PublisherPath $Publisher

          $ValidationPath=Join-Path $Root '.github\workflows\ddm-snoc-windows-validation.yml'
          $Validation=ReadText $ValidationPath
          $Needle="          & (Join-Path `$Product 'tools\\Test-DDM-ForceRefresh.ps1') -ProductRoot `$Product"
          $Insert=$Needle+"`r`n          & (Join-Path `$Product 'tools\\Test-DDM-CentralRecovery.ps1') -ProductRoot `$Product"
          $Validation=ReplaceOnce $Validation $Needle $Insert 'Validation recovery test'
          $NeedleBuilt="          & (Join-Path `$ExpandedProduct 'tools\\Test-DDM-ForceRefresh.ps1') -ProductRoot `$ExpandedProduct"
          $InsertBuilt=$NeedleBuilt+"`r`n          & (Join-Path `$ExpandedProduct 'tools\\Test-DDM-CentralRecovery.ps1') -ProductRoot `$ExpandedProduct"
          $Validation=ReplaceOnce $Validation $NeedleBuilt $InsertBuilt 'Built asset recovery test'
          WriteText $ValidationPath $Validation

          $ReleasePath=Join-Path $Root '.github\workflows\ddm-snoc-windows-release.yml'
          $Release=ReadText $ReleasePath
          $Release=ReplaceOnce $Release "foreach(`$Name in @('ATUALIZAR-AD.cmd','VOLTAR-RELEASE.cmd'))" "foreach(`$Name in @('ATUALIZAR-AD.cmd','VOLTAR-RELEASE.cmd','RECUPERAR-AD.cmd'))" 'AD seed commands'
          $RollbackBlock="          Copy-Item (Join-Path `$Product 'tools\\Set-DDM-CentralRelease.ps1') `$RollbackDestination -Force"
          $RecoveryBlock=$RollbackBlock+"`r`n          `$RecoveryDestination=Join-Path `$CentralTools 'tools\\Recover-DDM-CentralUpdater.ps1'`r`n          Copy-Item (Join-Path `$Product 'tools\\Recover-DDM-CentralUpdater.ps1') `$RecoveryDestination -Force"
          $Release=ReplaceOnce $Release $RollbackBlock $RecoveryBlock 'AD seed recovery script'
          $RequiredOld="foreach(`$Required in @('ATUALIZAR-AD.cmd','VOLTAR-RELEASE.cmd','AUDITORIA-300-PONTOS.md','CENTRAL-UPDATER\\central\\Update-DDM-SNOC-Central.ps1','CENTRAL-TOOLS\\tools\\Set-DDM-CentralRelease.ps1'))"
          $RequiredNew="foreach(`$Required in @('ATUALIZAR-AD.cmd','VOLTAR-RELEASE.cmd','RECUPERAR-AD.cmd','AUDITORIA-300-PONTOS.md','CENTRAL-UPDATER\\central\\Update-DDM-SNOC-Central.ps1','CENTRAL-TOOLS\\tools\\Set-DDM-CentralRelease.ps1','CENTRAL-TOOLS\\tools\\Recover-DDM-CentralUpdater.ps1'))"
          $Release=ReplaceOnce $Release $RequiredOld $RequiredNew 'AD seed required files'
          $ReleaseForce="          & (Join-Path `$Product 'tools\\Test-DDM-ForceRefresh.ps1') -ProductRoot `$Product"
          $ReleaseForceNew=$ReleaseForce+"`r`n          & (Join-Path `$Product 'tools\\Test-DDM-CentralRecovery.ps1') -ProductRoot `$Product"
          $Release=ReplaceOnce $Release $ReleaseForce $ReleaseForceNew 'Release recovery test'
          $FinalForce="          & (Join-Path `$FinalProduct 'tools\\Test-DDM-ForceRefresh.ps1') -ProductRoot `$FinalProduct"
          $FinalForceNew=$FinalForce+"`r`n          & (Join-Path `$FinalProduct 'tools\\Test-DDM-CentralRecovery.ps1') -ProductRoot `$FinalProduct"
          $Release=ReplaceOnce $Release $FinalForce $FinalForceNew 'Final motor recovery test'
          WriteText $ReleasePath $Release

          $ChangePath=Join-Path $Product 'CHANGELOG.md'
          $Change=ReadText $ChangePath
          if($Change -notmatch '(?m)^## 2\.0\.19 '){
            $Header=@'
## 2.0.19 - 2026-08-06
- Adiciona `RECUPERAR-AD.cmd` para recuperar a central quando `CENTRAL-UPDATER` estiver ausente ou incompleto.
- Restaura primeiro por `CENTRAL-UPDATER.previous-*` ou `BACKUPS\CENTRAL-CONTROLS`.
- Usa o AD-SEED oficial com validacao SHA-256 somente quando nao houver backup local valido.
- Executa internamente as duas sincronizacoes necessarias e valida que a raiz ficou sem `previous/staging` solto.
- Inclui o recuperador no MOTOR, AD-SEED, controles centrais e validadores oficiais.

'@
            WriteText $ChangePath ($Header+$Change)
          }

          Remove-Item -LiteralPath (Join-Path $Root '.github\workflows\agent-promote-central-recovery-2.0.19.yml') -Force

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'feat(windows): integrate official central recovery in 2.0.19'
          git push origin HEAD:fix/central-updater-recovery-2.0.19
