name: Publish DDM SNOC Windows 2.0.21 Final

on:
  pull_request:
    paths:
      - '.github/workflows/publish-ddm-snoc-windows-2.0.21-final.yml'

permissions:
  contents: write

concurrency:
  group: publish-ddm-snoc-windows-2.0.21-final
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DDM_TAG: ddm-snoc-windows-v2.0.21
      DDM_VERSION: 2.0.21
      DDM_MAIN_SHA: 3376da44c0a7ab1706336944fcbaa59231bd7d91
    steps:
      - name: Checkout exact audited main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3376da44c0a7ab1706336944fcbaa59231bd7d91
          fetch-depth: 0

      - name: Verify exact production source and release absence
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $Head=(git rev-parse HEAD).Trim()
          if($Head -ne $env:DDM_MAIN_SHA){throw "Checkout divergente. Esperado=$env:DDM_MAIN_SHA Atual=$Head"}
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          . (Join-Path $Product 'config\DDM-Product.ps1')
          if([string]$DDMProduct.ProductVersion -ne $env:DDM_VERSION){throw "ProductVersion divergente: $($DDMProduct.ProductVersion)"}
          $RemoteTag=(git ls-remote --tags origin ('refs/tags/'+$env:DDM_TAG) | Out-String).Trim()
          if(-not [string]::IsNullOrWhiteSpace($RemoteTag)){throw "Tag ja existe: $env:DDM_TAG"}
          Write-Host "SOURCE_COMMIT=$Head"
          Write-Host "PRODUCT_VERSION=$($DDMProduct.ProductVersion)"

      - name: Parse all PowerShell sources
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          foreach($File in @(Get-ChildItem $Product -Filter '*.ps1' -Recurse -Force)){
            $Tokens=$null;$Errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile($File.FullName,[ref]$Tokens,[ref]$Errors)
            if(@($Errors).Count -gt 0){throw (@($Errors|ForEach-Object{"$($File.FullName) L$($_.Extent.StartLineNumber): $($_.Message)"}) -join "`r`n")}
          }

      - name: Execute complete source validation and 240 scenarios
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          foreach($Test in @(
            'Test-DDM-Repository.ps1',
            'Test-DDM-RuntimeLexing.ps1',
            'Test-DDM-CentralBootstrapLoad.ps1',
            'Test-DDM-AclValidation.ps1',
            'Test-DDM-UncCmd.ps1',
            'Test-DDM-ForceRefresh.ps1',
            'Test-DDM-CentralRecovery.ps1',
            'Test-DDM-CentralPathIdentity.ps1',
            'Test-DDM-BootstrapFirstInstall.ps1'
          )){
            Write-Host "RUN_SOURCE_TEST=$Test"
            & (Join-Path $Product ('tools\'+$Test)) -ProductRoot $Product
            if(-not $?){throw "Source test falhou: $Test"}
          }
          $global:ProductCode='$ProductCode'
          $Output=Join-Path $env:RUNNER_TEMP 'DDM-SNOC-MIGRATION-240-2.0.21-RELEASE-SOURCE'
          & (Join-Path $Product 'tools\Test-DDM-SNOC-Migration-240Scenarios.ps1') -RepositoryRoot $env:GITHUB_WORKSPACE -OutputDirectory $Output
          if(-not $?){throw '240 cenarios do fonte falharam.'}
          "SOURCE_SCENARIO_OUTPUT=$Output" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $EngineHash=(Get-FileHash (Join-Path $Product 'engine\Install-DDM-Zabbix-Windows.ps1') -Algorithm SHA256).Hash.ToUpperInvariant()
          "ENGINE_SHA256=$EngineHash" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "SOURCE_ENGINE_SHA256=$EngineHash"

      - name: Build MOTOR AD-SEED hashes and manifest
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          . (Join-Path $Product 'config\DDM-Product.ps1')
          $Dist=Join-Path $env:GITHUB_WORKSPACE 'dist-2.0.21-final'
          $Motor=Join-Path $Dist ('DDM-SNOC-WINDOWS-MOTOR-'+$env:DDM_VERSION)
          $Seed=Join-Path $Dist ('DDM-SNOC-WINDOWS-AD-SEED-'+$env:DDM_VERSION)
          Remove-Item $Dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $Motor,$Seed -ItemType Directory -Force|Out-Null

          foreach($Name in @('Start-DDM-SNOC.ps1','CLIENTE.example.ps1','README.md','CHANGELOG.md')){
            Copy-Item (Join-Path $Product $Name) (Join-Path $Motor $Name) -Force
          }
          foreach($Name in @('config','lib','central','bootstrap','endpoint','engine','modules','templates','tools','docs','clients')){
            Copy-Item (Join-Path $Product $Name) (Join-Path $Motor $Name) -Recurse -Force
          }

          foreach($Name in @('ATUALIZAR-AD.cmd','VOLTAR-RELEASE.cmd','RECUPERAR-AD.cmd','ATUALIZAR-AD-AUTOMATICO.cmd')){
            Copy-Item (Join-Path $Product ('templates\central\'+$Name)) (Join-Path $Seed $Name) -Force
          }
          Copy-Item (Join-Path $Product 'templates\central\SINCRONIZAR-CLIENTE-MAIN.ps1') (Join-Path $Seed 'SINCRONIZAR-CLIENTE.ps1') -Force
          Copy-Item (Join-Path $Product 'CLIENTE.example.ps1') (Join-Path $Seed 'CLIENTE.example.ps1') -Force
          Copy-Item (Join-Path $Product 'docs\UPDATE-AD.md') (Join-Path $Seed 'LEIA-ME-UPDATE-AD.md') -Force
          Copy-Item (Join-Path $Product 'docs\AUDITORIA-300-PONTOS.md') (Join-Path $Seed 'AUDITORIA-300-PONTOS.md') -Force
          Copy-Item (Join-Path $Product 'tools\Recover-DDM-CentralUpdater.ps1') (Join-Path $Seed 'Recover-DDM-CentralUpdater.ps1') -Force

          $Updater=Join-Path $Seed 'CENTRAL-UPDATER'
          foreach($Rel in @(
            'central\Update-DDM-SNOC-Central.ps1',
            'central\lib\DDM-Central-Client.ps1',
            'central\lib\DDM-Central-Supply.ps1',
            'central\lib\Invoke-DDM-Central-Publish.ps1',
            'config\DDM-Product.ps1',
            'lib\DDM-Common.ps1'
          )){
            $Source=Join-Path $Product $Rel
            $Destination=Join-Path $Updater $Rel
            New-Item (Split-Path -Parent $Destination) -ItemType Directory -Force|Out-Null
            Copy-Item $Source $Destination -Force
          }
          $CentralTools=Join-Path $Seed 'CENTRAL-TOOLS'
          New-Item (Join-Path $CentralTools 'tools') -ItemType Directory -Force|Out-Null
          Copy-Item (Join-Path $Product 'tools\Set-DDM-CentralRelease.ps1') (Join-Path $CentralTools 'tools\Set-DDM-CentralRelease.ps1') -Force
          Copy-Item (Join-Path $Product 'tools\Recover-DDM-CentralUpdater.ps1') (Join-Path $CentralTools 'tools\Recover-DDM-CentralUpdater.ps1') -Force

          foreach($Root in @($Motor,$Seed)){
            $Forbidden=@(Get-ChildItem $Root -Recurse -Force|Where-Object{$_.FullName -match '\\base-package\\|\\\.parts\\|New-BKPCloud-Zabbix-Client'})
            if($Forbidden.Count -gt 0){throw "Conteudo legado/desenvolvimento no asset: $Root"}
          }
          foreach($Required in @(
            'ATUALIZAR-AD.cmd','VOLTAR-RELEASE.cmd','RECUPERAR-AD.cmd','ATUALIZAR-AD-AUTOMATICO.cmd','SINCRONIZAR-CLIENTE.ps1',
            'Recover-DDM-CentralUpdater.ps1','AUDITORIA-300-PONTOS.md','CENTRAL-UPDATER\central\Update-DDM-SNOC-Central.ps1',
            'CENTRAL-UPDATER\central\lib\DDM-Central-Client.ps1','CENTRAL-UPDATER\central\lib\Invoke-DDM-Central-Publish.ps1',
            'CENTRAL-TOOLS\tools\Set-DDM-CentralRelease.ps1','CENTRAL-TOOLS\tools\Recover-DDM-CentralUpdater.ps1'
          )){
            if(-not(Test-Path (Join-Path $Seed $Required) -PathType Leaf)){throw "AD-SEED incompleto: $Required"}
          }
          $SeedClient=[IO.File]::ReadAllText((Join-Path $Seed 'CENTRAL-UPDATER\central\lib\DDM-Central-Client.ps1'))
          $SeedPublisher=[IO.File]::ReadAllText((Join-Path $Seed 'CENTRAL-UPDATER\central\lib\Invoke-DDM-Central-Publish.ps1'))
          if($SeedClient.IndexOf('function Test-DDMCentralRootEquivalent',[StringComparison]::Ordinal) -lt 0){throw 'AD-SEED sem helper CentralRoot 2.0.21.'}
          if($SeedPublisher.IndexOf('Test-DDMCentralRootEquivalent $Declared $Executed',[StringComparison]::Ordinal) -lt 0){throw 'AD-SEED sem uso do helper CentralRoot 2.0.21.'}

          $MotorZip=Join-Path $Dist ('DDM-SNOC-WINDOWS-MOTOR-'+$env:DDM_VERSION+'.zip')
          $SeedZip=Join-Path $Dist ('DDM-SNOC-WINDOWS-AD-SEED-'+$env:DDM_VERSION+'.zip')
          Compress-Archive -Path $Motor -DestinationPath $MotorZip -CompressionLevel Optimal
          Compress-Archive -Path (Join-Path $Seed '*') -DestinationPath $SeedZip -CompressionLevel Optimal

          $Assets=@()
          foreach($Zip in @($MotorZip,$SeedZip)){
            $Hash=(Get-FileHash $Zip -Algorithm SHA256).Hash.ToUpperInvariant()
            Set-Content -LiteralPath ($Zip+'.sha256') -Value ($Hash+' *'+(Split-Path -Leaf $Zip)) -Encoding ASCII
            $Assets+=New-Object PSObject -Property @{Name=(Split-Path -Leaf $Zip);Sha256=$Hash;Size=(Get-Item $Zip).Length}
            Write-Host "ASSET=$(Split-Path -Leaf $Zip) SHA256=$Hash"
          }
          $Manifest=New-Object PSObject -Property @{
            Product=$DDMProduct.ProductName
            ProductVersion=$env:DDM_VERSION
            GitCommit=$env:DDM_MAIN_SHA
            GitTag=$env:DDM_TAG
            GeneratedAtUtc=(Get-Date).ToUniversalTime().ToString('o')
            EngineSha256=$env:ENGINE_SHA256
            MigrationScenarios='240/240 source + 240/240 final MOTOR'
            CentralRootRegression='mizu.local NETLOGON <-> local DC NETLOGON plus negative cases'
            Assets=$Assets
            ExternalPilotsRequired=$true
          }
          $ManifestPath=Join-Path $Dist ('DDM-SNOC-WINDOWS-RELEASE-MANIFEST-'+$env:DDM_VERSION+'.json')
          $Manifest|ConvertTo-Json -Depth 6|Set-Content -LiteralPath $ManifestPath -Encoding UTF8
          $ManifestHash=(Get-FileHash $ManifestPath -Algorithm SHA256).Hash.ToUpperInvariant()
          Set-Content -LiteralPath ($ManifestPath+'.sha256') -Value ($ManifestHash+' *'+(Split-Path -Leaf $ManifestPath)) -Encoding ASCII
          "DIST_PATH=$Dist" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "MOTOR_ZIP=$MotorZip" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Inspect exact final MOTOR with complete suite and 240 scenarios
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Expanded=Join-Path $env:RUNNER_TEMP 'DDM-SNOC-2.0.21-RELEASE-EXPANDED'
          $FinalRepo=Join-Path $env:RUNNER_TEMP 'DDM-SNOC-2.0.21-RELEASE-REPO'
          Remove-Item $Expanded,$FinalRepo -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $env:MOTOR_ZIP -DestinationPath $Expanded -Force
          $ExpandedProduct=Join-Path $Expanded ('DDM-SNOC-WINDOWS-MOTOR-'+$env:DDM_VERSION)
          $FinalProduct=Join-Path $FinalRepo 'windows\zabbix-agent-deployment'
          New-Item (Split-Path -Parent $FinalProduct) -ItemType Directory -Force|Out-Null
          Copy-Item $ExpandedProduct $FinalProduct -Recurse -Force
          $WorkflowRoot=Join-Path $FinalRepo '.github\workflows'
          New-Item $WorkflowRoot -ItemType Directory -Force|Out-Null
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE '.github\workflows\ddm-snoc-windows-validation.yml') $WorkflowRoot -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE '.github\workflows\ddm-snoc-windows-release.yml') $WorkflowRoot -Force
          foreach($Test in @(
            'Test-DDM-Repository.ps1','Test-DDM-RuntimeLexing.ps1','Test-DDM-CentralBootstrapLoad.ps1','Test-DDM-AclValidation.ps1',
            'Test-DDM-UncCmd.ps1','Test-DDM-ForceRefresh.ps1','Test-DDM-CentralRecovery.ps1','Test-DDM-CentralPathIdentity.ps1','Test-DDM-BootstrapFirstInstall.ps1'
          )){
            Write-Host "RUN_FINAL_TEST=$Test"
            & (Join-Path $FinalProduct ('tools\'+$Test)) -ProductRoot $FinalProduct
            if(-not $?){throw "Final MOTOR test falhou: $Test"}
          }
          $global:ProductCode='$ProductCode'
          $Output=Join-Path $env:RUNNER_TEMP 'DDM-SNOC-MIGRATION-240-2.0.21-RELEASE-FINAL'
          & (Join-Path $FinalProduct 'tools\Test-DDM-SNOC-Migration-240Scenarios.ps1') -RepositoryRoot $FinalRepo -OutputDirectory $Output
          if(-not $?){throw '240 cenarios do MOTOR final falharam.'}
          "FINAL_SCENARIO_OUTPUT=$Output" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $FinalEngineHash=(Get-FileHash (Join-Path $FinalProduct 'engine\Install-DDM-Zabbix-Windows.ps1') -Algorithm SHA256).Hash.ToUpperInvariant()
          if($FinalEngineHash -ne $env:ENGINE_SHA256){throw "Engine mudou no MOTOR final. Source=$env:ENGINE_SHA256 Final=$FinalEngineHash"}
          Write-Host "FINAL_ENGINE_SHA256=$FinalEngineHash"

      - name: Upload final immutable evidence
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: DDM-SNOC-WINDOWS-2.0.21-FINAL-RELEASE-EVIDENCE
          path: |
            ${{ env.SOURCE_SCENARIO_OUTPUT }}
            ${{ env.FINAL_SCENARIO_OUTPUT }}
            ${{ env.DIST_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish and verify official 2.0.21 release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $Dist=$env:DIST_PATH
          $Files=@(
            (Join-Path $Dist ('DDM-SNOC-WINDOWS-MOTOR-'+$env:DDM_VERSION+'.zip')),
            (Join-Path $Dist ('DDM-SNOC-WINDOWS-MOTOR-'+$env:DDM_VERSION+'.zip.sha256')),
            (Join-Path $Dist ('DDM-SNOC-WINDOWS-AD-SEED-'+$env:DDM_VERSION+'.zip')),
            (Join-Path $Dist ('DDM-SNOC-WINDOWS-AD-SEED-'+$env:DDM_VERSION+'.zip.sha256')),
            (Join-Path $Dist ('DDM-SNOC-WINDOWS-RELEASE-MANIFEST-'+$env:DDM_VERSION+'.json')),
            (Join-Path $Dist ('DDM-SNOC-WINDOWS-RELEASE-MANIFEST-'+$env:DDM_VERSION+'.json.sha256'))
          )
          foreach($File in $Files){if(-not(Test-Path -LiteralPath $File -PathType Leaf)){throw "Asset ausente: $File"}}
          $Notes='Hotfix de producao para equivalencia segura entre o NETLOGON do dominio e o NETLOGON do proprio DC. Validado com suite completa, caso real mizu.local/SRV-AE, casos negativos e 240/240 cenarios no fonte e no MOTOR final.'
          & gh release create $env:DDM_TAG @Files --repo $env:GITHUB_REPOSITORY --target $env:DDM_MAIN_SHA --title ('DDM SNOC Windows '+$env:DDM_VERSION) --notes $Notes
          if($LASTEXITCODE -ne 0){throw "gh release create retornou $LASTEXITCODE"}
          git fetch origin ('refs/tags/'+$env:DDM_TAG+':refs/tags/'+$env:DDM_TAG) --force
          if($LASTEXITCODE -ne 0){throw 'Falha ao buscar tag publicada.'}
          $TagCommit=(git rev-list -n 1 $env:DDM_TAG).Trim()
          if($TagCommit -ne $env:DDM_MAIN_SHA){throw "Tag aponta para commit incorreto. Esperado=$env:DDM_MAIN_SHA Atual=$TagCommit"}
          $Release=(& gh release view $env:DDM_TAG --repo $env:GITHUB_REPOSITORY --json tagName,assets | ConvertFrom-Json)
          if([string]$Release.tagName -ne $env:DDM_TAG){throw 'Tag da release divergente.'}
          $Names=@($Release.assets|ForEach-Object{$_.name})
          foreach($Required in @(
            'DDM-SNOC-WINDOWS-MOTOR-2.0.21.zip','DDM-SNOC-WINDOWS-MOTOR-2.0.21.zip.sha256',
            'DDM-SNOC-WINDOWS-AD-SEED-2.0.21.zip','DDM-SNOC-WINDOWS-AD-SEED-2.0.21.zip.sha256',
            'DDM-SNOC-WINDOWS-RELEASE-MANIFEST-2.0.21.json','DDM-SNOC-WINDOWS-RELEASE-MANIFEST-2.0.21.json.sha256'
          )){if($Names -notcontains $Required){throw "Release asset ausente: $Required"}}
          Write-Host "RELEASE_PUBLISHED=$env:DDM_TAG"
          Write-Host "RELEASE_COMMIT=$TagCommit"
          Write-Host ('RELEASE_ASSETS='+($Names -join ','))
