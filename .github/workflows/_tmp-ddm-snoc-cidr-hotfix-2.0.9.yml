name: DDM SNOC Windows CIDR Hotfix 2.0.9

on:
  push:
    paths:
      - '.github/workflows/_tmp-ddm-snoc-cidr-hotfix-2.0.9.yml'

permissions:
  contents: write

concurrency:
  group: ddm-snoc-windows-cidr-hotfix-2.0.9
  cancel-in-progress: false

env:
  RELEASE_TAG: ddm-snoc-windows-v2.0.9
  PRODUCT_VERSION: 2.0.9

jobs:
  validate_publish_pilot:
    runs-on: windows-latest
    timeout-minutes: 50

    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Patch source and add real-client regression
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Repo=$env:GITHUB_WORKSPACE
          $Product=Join-Path $Repo 'windows\zabbix-agent-deployment'
          $Utf8=New-Object System.Text.UTF8Encoding($false)
          function Save([string]$Path,[string]$Text){[IO.File]::WriteAllText($Path,$Text,$Utf8)}

          $ClientLibPath=Join-Path $Product 'central\lib\DDM-Central-Client.ps1'
          $ClientLib=[IO.File]::ReadAllText($ClientLibPath)
          $OldDuplicate=@'
              $Duplicates=@($Rules | Group-Object Cidr | Where-Object Count -gt 1)
              if ($Duplicates.Count -gt 0) { throw "CIDRs duplicados: $(@($Duplicates.Name) -join ', ')" }
          '@
          $NewDuplicate=@'
              $CidrCounts=@{}
              foreach ($Rule in $Rules) {
                  $Cidr=[string]$Rule.Cidr
                  if ($CidrCounts.ContainsKey($Cidr)) {
                      $CidrCounts[$Cidr]=[int]$CidrCounts[$Cidr]+1
                  } else {
                      $CidrCounts[$Cidr]=1
                  }
              }
              $DuplicateCidrs=@(
                  $CidrCounts.GetEnumerator() |
                      Where-Object { [int]$_.Value -gt 1 } |
                      Sort-Object Key |
                      ForEach-Object { [string]$_.Key }
              )
              if ($DuplicateCidrs.Count -gt 0) { throw "CIDRs duplicados: $($DuplicateCidrs -join ', ')" }
          '@
          if(-not $ClientLib.Contains($OldDuplicate)){throw 'Bloco antigo de CIDRs duplicados nao encontrado.'}
          $ClientLib=$ClientLib.Replace($OldDuplicate,$NewDuplicate)
          Save $ClientLibPath $ClientLib

          $ConfigPath=Join-Path $Product 'config\DDM-Product.ps1'
          $Config=[IO.File]::ReadAllText($ConfigPath)
          if(-not $Config.Contains("ProductVersion           = '2.0.8'")){throw 'Versao 2.0.8 nao encontrada no produto.'}
          Save $ConfigPath ($Config.Replace("ProductVersion           = '2.0.8'","ProductVersion           = '2.0.9'"))

          $TestPath=Join-Path $Product 'tools\Test-DDM-Repository.ps1'
          $Test=[IO.File]::ReadAllText($TestPath)
          if(-not $Test.Contains("Assert-DDMTest (`$DDMProduct.ProductVersion -eq '2.0.8') 'ProductVersion deve ser 2.0.8.'")){throw 'Assercao de versao 2.0.8 ausente.'}
          $Test=$Test.Replace(
              "Assert-DDMTest (`$DDMProduct.ProductVersion -eq '2.0.8') 'ProductVersion deve ser 2.0.8.'",
              "Assert-DDMTest (`$DDMProduct.ProductVersion -eq '2.0.9') 'ProductVersion deve ser 2.0.9.'"
          )

          $Marker=@'
              $RoundTrip = Import-Clixml -LiteralPath $RuntimePath
              Assert-DDMClient $RoundTrip $DDMProduct

              $System = New-Object PSObject -Property @{
          '@
          $Insert=@'
              $RoundTrip = Import-Clixml -LiteralPath $RuntimePath
              Assert-DDMClient $RoundTrip $DDMProduct

              # Regressao: duas redes distintas em hashtables nao podem ser agrupadas como CIDR vazio.
              $NetworkA = $Client.Networks[0].Clone()
              $NetworkB = $Client.Networks[0].Clone()
              $NetworkA.Cidr = '192.0.2.0/24'
              $NetworkB.Cidr = '198.51.100.0/24'
              $DistinctNetworksClient = $Client.Clone()
              $DistinctNetworksClient.Networks = @($NetworkA, $NetworkB)
              Assert-DDMClient $DistinctNetworksClient $DDMProduct

              # Regressao negativa: duplicidade real deve continuar bloqueada e informar o CIDR.
              $DuplicateA = $Client.Networks[0].Clone()
              $DuplicateB = $Client.Networks[0].Clone()
              $DuplicateA.Cidr = '192.0.2.0/24'
              $DuplicateB.Cidr = '192.0.2.0/24'
              $DuplicateNetworksClient = $Client.Clone()
              $DuplicateNetworksClient.Networks = @($DuplicateA, $DuplicateB)
              $DuplicateMessage = ''
              try {
                  Assert-DDMClient $DuplicateNetworksClient $DDMProduct
              }
              catch {
                  $DuplicateMessage = $_.Exception.Message
              }
              Assert-DDMTest ($DuplicateMessage -eq 'CIDRs duplicados: 192.0.2.0/24') 'Duplicidade real de CIDR nao foi diagnosticada corretamente.'

              # Todos os CLIENTE.ps1 oficiais precisam passar no mesmo Windows PowerShell usado pelo AD.
              $OfficialClientFiles = @(
                  Get-ChildItem -LiteralPath (Join-Path $ProductRoot 'clients') -Filter 'CLIENTE.ps1' -Recurse
              )
              Assert-DDMTest ($OfficialClientFiles.Count -gt 0) 'Nenhum CLIENTE.ps1 oficial encontrado.'
              foreach ($OfficialClientFile in $OfficialClientFiles) {
                  $OfficialRaw = [System.IO.File]::ReadAllText($OfficialClientFile.FullName)
                  $OfficialMatch = [regex]::Match(
                      $OfficialRaw,
                      '(?ms)^\s*(?:#.*\r?\n\s*)*\$DDMClient\s*=\s*(?<data>@\{.*\})\s*$'
                  )
                  Assert-DDMTest $OfficialMatch.Success "CLIENTE.ps1 oficial contem codigo executavel: $($OfficialClientFile.FullName)"
                  $OfficialDataPath = Join-Path $script:RunRoot (($OfficialClientFile.Directory.Name) + '.psd1')
                  [System.IO.File]::WriteAllText(
                      $OfficialDataPath,
                      $OfficialMatch.Groups['data'].Value,
                      (New-Object System.Text.UTF8Encoding($false))
                  )
                  $OfficialClient = Import-PowerShellDataFile -LiteralPath $OfficialDataPath
                  Assert-DDMClient $OfficialClient $DDMProduct
              }

              $System = New-Object PSObject -Property @{
          '@
          if(-not $Test.Contains($Marker)){throw 'Marcador de regressao dos clientes nao encontrado.'}
          $Test=$Test.Replace($Marker,$Insert)
          Save $TestPath $Test

          $RecoveryPath=Join-Path $Product 'tools\Recover-DDM-SNOC-Central.ps1'
          $Recovery=[IO.File]::ReadAllText($RecoveryPath)
          $Recovery=$Recovery.Replace("[string]`$ExpectedTag = 'ddm-snoc-windows-v2.0.5'","[string]`$ExpectedTag = 'ddm-snoc-windows-v2.0.9'")
          $Recovery=$Recovery.Replace("Write-Step 'FALHA: restaurando automaticamente os 33 arquivos originais...' Yellow","Write-Step 'FALHA: restaurando automaticamente o conteudo original...' Yellow")
          if($Recovery -notmatch "ExpectedTag = 'ddm-snoc-windows-v2\.0\.9'"){throw 'ExpectedTag do recuperador nao foi atualizado.'}
          if($Recovery -match 'restaurando automaticamente os 33 arquivos'){throw 'Mensagem fixa de 33 arquivos permaneceu.'}
          Save $RecoveryPath $Recovery

          $ChangelogPath=Join-Path $Product 'CHANGELOG.md'
          $Changelog=[IO.File]::ReadAllText($ChangelogPath)
          if($Changelog -notmatch '(?m)^## 2\.0\.9\b'){
              $Entry="## 2.0.9 - 2026-08-04`r`n- Corrige falso positivo de CIDRs duplicados em Networks representadas por hashtables no Windows PowerShell 5.1.`r`n- Valida todos os CLIENTE.ps1 oficiais no pipeline e adiciona piloto integral do atualizador central.`r`n- Atualiza o recuperador para a release corrente e remove mensagens com quantidade fixa de arquivos.`r`n`r`n"
              Save $ChangelogPath ($Entry+$Changelog)
          }

          Remove-Item -LiteralPath (Join-Path $Repo '.github\workflows\_tmp-ddm-snoc-cidr-hotfix-2.0.9.yml') -Force
          Remove-Item -LiteralPath (Join-Path $Repo 'release-status\ddm-snoc-windows-v2.0.9.txt') -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $Repo 'release-status\ddm-snoc-windows-v2.0.9-failed.txt') -Force -ErrorAction SilentlyContinue

      - name: Validate source and all official clients
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          & (Join-Path $Product 'tools\Test-DDM-Repository.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-RuntimeLexing.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-CentralBootstrapLoad.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-AclValidation.ps1') -ProductRoot $Product

      - name: Commit validated source
        id: source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0){throw 'Nenhuma alteracao validada para publicar.'}
          git commit -m 'fix(snoc-windows): corrige validacao de CIDRs e promove 2.0.9'
          git push origin HEAD:main
          $Commit=(git rev-parse HEAD).Trim()
          "commit=$Commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build and validate immutable assets
        shell: powershell
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          $ErrorActionPreference='Stop'
          $Repo=$env:GITHUB_WORKSPACE
          $Product=Join-Path $Repo 'windows\zabbix-agent-deployment'
          . (Join-Path $Product 'config\DDM-Product.ps1')
          if($DDMProduct.ProductVersion -ne $env:PRODUCT_VERSION){throw 'Versao interna divergente.'}

          $Dist=Join-Path $Repo 'dist'
          $Motor=Join-Path $Dist ('DDM-SNOC-WINDOWS-MOTOR-'+$env:PRODUCT_VERSION)
          $Seed=Join-Path $Dist ('DDM-SNOC-WINDOWS-AD-SEED-'+$env:PRODUCT_VERSION)
          Remove-Item $Dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $Motor,$Seed -ItemType Directory -Force | Out-Null

          foreach($Name in @('Start-DDM-SNOC.ps1','CLIENTE.example.ps1','README.md','CHANGELOG.md')){
              Copy-Item (Join-Path $Product $Name) (Join-Path $Motor $Name) -Force
          }
          foreach($Name in @('config','lib','central','bootstrap','endpoint','engine','modules','templates','tools','docs','clients')){
              Copy-Item (Join-Path $Product $Name) (Join-Path $Motor $Name) -Recurse -Force
          }
          foreach($Name in @('ATUALIZAR-AD.cmd','VOLTAR-RELEASE.cmd')){
              Copy-Item (Join-Path $Product ('templates\central\'+$Name)) (Join-Path $Seed $Name) -Force
          }
          Copy-Item (Join-Path $Product 'CLIENTE.example.ps1') (Join-Path $Seed 'CLIENTE.example.ps1') -Force
          Copy-Item (Join-Path $Product 'docs\UPDATE-AD.md') (Join-Path $Seed 'LEIA-ME-UPDATE-AD.md') -Force
          Copy-Item (Join-Path $Product 'docs\AUDITORIA-300-PONTOS.md') (Join-Path $Seed 'AUDITORIA-300-PONTOS.md') -Force
          Copy-Item (Join-Path $Product 'docs\AUDITORIA-MIZU-ACL-40-PONTOS.md') (Join-Path $Seed 'AUDITORIA-MIZU-ACL-40-PONTOS.md') -Force

          $Updater=Join-Path $Seed 'CENTRAL-UPDATER'
          foreach($Rel in @(
              'central\Update-DDM-SNOC-Central.ps1',
              'central\lib\DDM-Central-Client.ps1',
              'central\lib\DDM-Central-Supply.ps1',
              'central\lib\Invoke-DDM-Central-Publish.ps1',
              'config\DDM-Product.ps1',
              'lib\DDM-Common.ps1'
          )){
              $Source=Join-Path $Product $Rel
              $Destination=Join-Path $Updater $Rel
              New-Item (Split-Path -Parent $Destination) -ItemType Directory -Force | Out-Null
              Copy-Item $Source $Destination -Force
          }
          $Rollback=Join-Path $Seed 'CENTRAL-TOOLS\tools\Set-DDM-CentralRelease.ps1'
          New-Item (Split-Path -Parent $Rollback) -ItemType Directory -Force | Out-Null
          Copy-Item (Join-Path $Product 'tools\Set-DDM-CentralRelease.ps1') $Rollback -Force

          $MotorZip=Join-Path $Dist ('DDM-SNOC-WINDOWS-MOTOR-'+$env:PRODUCT_VERSION+'.zip')
          $SeedZip=Join-Path $Dist ('DDM-SNOC-WINDOWS-AD-SEED-'+$env:PRODUCT_VERSION+'.zip')
          Compress-Archive -Path $Motor -DestinationPath $MotorZip -CompressionLevel Optimal
          Compress-Archive -Path (Join-Path $Seed '*') -DestinationPath $SeedZip -CompressionLevel Optimal

          $Expanded=Join-Path $env:RUNNER_TEMP 'ddm-motor-expanded'
          Remove-Item $Expanded -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $MotorZip -DestinationPath $Expanded -Force
          $ExpandedProduct=Join-Path $Expanded ('DDM-SNOC-WINDOWS-MOTOR-'+$env:PRODUCT_VERSION)
          $ExpandedRepo=Split-Path -Parent (Split-Path -Parent $ExpandedProduct)
          New-Item (Join-Path $ExpandedRepo '.github\workflows') -ItemType Directory -Force | Out-Null
          Copy-Item (Join-Path $Repo '.github\workflows\ddm-snoc-windows-release.yml') (Join-Path $ExpandedRepo '.github\workflows\ddm-snoc-windows-release.yml') -Force
          & (Join-Path $ExpandedProduct 'tools\Test-DDM-Repository.ps1') -ProductRoot $ExpandedProduct
          & (Join-Path $ExpandedProduct 'tools\Test-DDM-RuntimeLexing.ps1') -ProductRoot $ExpandedProduct
          & (Join-Path $ExpandedProduct 'tools\Test-DDM-CentralBootstrapLoad.ps1') -ProductRoot $ExpandedProduct
          & (Join-Path $ExpandedProduct 'tools\Test-DDM-AclValidation.ps1') -ProductRoot $ExpandedProduct

          $Assets=@()
          foreach($Zip in @($MotorZip,$SeedZip)){
              $Hash=(Get-FileHash -LiteralPath $Zip -Algorithm SHA256).Hash
              Set-Content -LiteralPath ($Zip+'.sha256') -Value ($Hash+' *'+(Split-Path -Leaf $Zip)) -Encoding ASCII
              $Assets+=New-Object PSObject -Property @{Name=(Split-Path -Leaf $Zip);Sha256=$Hash;Size=(Get-Item $Zip).Length}
          }
          $ManifestPath=Join-Path $Dist ('DDM-SNOC-WINDOWS-RELEASE-MANIFEST-'+$env:PRODUCT_VERSION+'.json')
          $Manifest=New-Object PSObject -Property @{
              Product='DDM SNOC Windows'
              ProductVersion=$env:PRODUCT_VERSION
              GitCommit=$env:SOURCE_COMMIT
              GitTag=$env:RELEASE_TAG
              GeneratedAtUtc=(Get-Date).ToUniversalTime().ToString('o')
              Assets=$Assets
              Validation=@('repository','runtime-lexing','bootstrap-load','acl','all-official-clients','expanded-motor','full-central-pilot')
              ExternalPilotsRequired=$false
          }
          $Manifest|ConvertTo-Json -Depth 6|Set-Content -LiteralPath $ManifestPath -Encoding UTF8
          $ManifestHash=(Get-FileHash -LiteralPath $ManifestPath -Algorithm SHA256).Hash
          Set-Content -LiteralPath ($ManifestPath+'.sha256') -Value ($ManifestHash+' *'+(Split-Path -Leaf $ManifestPath)) -Encoding ASCII

      - name: Create stable release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if(-not [string]::IsNullOrWhiteSpace([string](git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"))){throw "Tag ja existe: $env:RELEASE_TAG"}
          git tag -a $env:RELEASE_TAG $env:SOURCE_COMMIT -m "DDM SNOC Windows $env:PRODUCT_VERSION"
          git push origin $env:RELEASE_TAG

          $D=Join-Path $env:GITHUB_WORKSPACE 'dist'
          $M=Join-Path $D ('DDM-SNOC-WINDOWS-MOTOR-'+$env:PRODUCT_VERSION+'.zip')
          $S=Join-Path $D ('DDM-SNOC-WINDOWS-AD-SEED-'+$env:PRODUCT_VERSION+'.zip')
          $J=Join-Path $D ('DDM-SNOC-WINDOWS-RELEASE-MANIFEST-'+$env:PRODUCT_VERSION+'.json')
          & gh release create $env:RELEASE_TAG $M ($M+'.sha256') $S ($S+'.sha256') $J ($J+'.sha256') --verify-tag --target $env:SOURCE_COMMIT --title "DDM SNOC Windows $env:PRODUCT_VERSION" --notes 'Corrige validacao de CIDRs em hashtables; valida todos os clientes oficiais e exige piloto integral do atualizador.'
          if($LASTEXITCODE -ne 0){throw "gh release create retornou $LASTEXITCODE"}

          $Release=(& gh release view $env:RELEASE_TAG --json tagName,isDraft,isPrerelease,assets)|ConvertFrom-Json
          if($Release.isDraft -or $Release.isPrerelease){throw 'Release nao ficou estavel.'}
          if(@($Release.assets).Count -ne 6){throw "Release possui $(@($Release.assets).Count) assets."}

      - name: Full Windows central-update pilot
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $Repo=$env:GITHUB_WORKSPACE
          $Product=Join-Path $Repo 'windows\zabbix-agent-deployment'
          $Dist=Join-Path $Repo 'dist'
          $PilotRoot=Join-Path 'C:\' ('DDM-SNOC-E2E-'+[guid]::NewGuid().ToString('N'))
          $Central=Join-Path $PilotRoot 'ZBX'
          try {
              New-Item $Central -ItemType Directory -Force | Out-Null
              & icacls.exe $Central /inheritance:r | Out-Host
              if($LASTEXITCODE -ne 0){throw 'Falha ao remover heranca ACL do piloto.'}
              & icacls.exe $Central /grant:r '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' '*S-1-5-11:(OI)(CI)RX' | Out-Host
              if($LASTEXITCODE -ne 0){throw 'Falha ao configurar ACL do piloto.'}

              $SeedZip=Join-Path $Dist ('DDM-SNOC-WINDOWS-AD-SEED-'+$env:PRODUCT_VERSION+'.zip')
              Expand-Archive -LiteralPath $SeedZip -DestinationPath $Central -Force
              Copy-Item (Join-Path $Product 'clients\AGL\CLIENTE.ps1') (Join-Path $Central 'CLIENTE.ps1') -Force

              Start-Sleep -Seconds 5
              $Updater=Join-Path $Central 'CENTRAL-UPDATER\central\Update-DDM-SNOC-Central.ps1'
              & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $Updater -CentralRoot $Central
              if($LASTEXITCODE -ne 0){throw "Piloto integral retornou $LASTEXITCODE"}

              $CurrentPath=Join-Path $Central 'CURRENT.txt'
              if(-not(Test-Path -LiteralPath $CurrentPath)){throw 'Piloto integral nao criou CURRENT.txt.'}
              $Current=(Get-Content -LiteralPath $CurrentPath -First 1).Trim()
              if($Current -notlike "$env:PRODUCT_VERSION`__*"){throw "CURRENT.txt inesperado no piloto: $Current"}
              Write-Host "FULL_CENTRAL_PILOT_OK Current=$Current" -ForegroundColor Green
          }
          finally {
              Remove-Item $PilotRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Record READY evidence
        shell: powershell
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          $ErrorActionPreference='Stop'
          git fetch origin main
          git checkout -B ready origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $Status=Join-Path $env:GITHUB_WORKSPACE 'release-status\ddm-snoc-windows-v2.0.9.txt'
          New-Item (Split-Path -Parent $Status) -ItemType Directory -Force|Out-Null
          Set-Content -LiteralPath $Status -Value ('State=READY Tag='+$env:RELEASE_TAG+' Commit='+$env:SOURCE_COMMIT+' Assets=6 OfficialClients=4 FullCentralPilot=PASS VerifiedAtUtc='+(Get-Date).ToUniversalTime().ToString('o')) -Encoding UTF8
          git add $Status
          git commit -m 'chore(snoc-windows): registra 2.0.9 READY com piloto integral'
          git push origin HEAD:main

      - name: Remove failed release and record failure
        if: failure()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Continue'
          & gh release delete $env:RELEASE_TAG --yes 2>$null
          git push --delete origin $env:RELEASE_TAG 2>$null
          git fetch origin main
          git checkout -B failed origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $Status=Join-Path $env:GITHUB_WORKSPACE 'release-status\ddm-snoc-windows-v2.0.9-failed.txt'
          New-Item (Split-Path -Parent $Status) -ItemType Directory -Force|Out-Null
          Set-Content -LiteralPath $Status -Value ('State=FAILED RunId='+$env:GITHUB_RUN_ID+' FailedAtUtc='+(Get-Date).ToUniversalTime().ToString('o')) -Encoding UTF8
          git add $Status
          git commit -m 'chore(snoc-windows): registra falha de validacao 2.0.9'
          git push origin HEAD:main
