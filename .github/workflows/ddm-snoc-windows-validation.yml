name: Validate DDM SNOC Windows

on:
  pull_request:
    paths:
      - 'windows/zabbix-agent-deployment/**'
      - '.github/workflows/ddm-snoc-windows-validation.yml'
      - '.github/workflows/ddm-snoc-windows-release.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject legacy and development debris
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Root=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          foreach($Legacy in @('base-package','templates\Client.example.ps1','templates\client-definition.example.json','tools\New-BKPCloud-Zabbix-Client.ps1','tools\Bootstrap-New-BKPCloud-Zabbix-Client.ps1','tools\Restore-SplitFiles.ps1')){
            if(Test-Path (Join-Path $Root $Legacy)){throw "Legado presente: $Legacy"}
          }
          if(Get-ChildItem $Root -Recurse -Force | Where-Object {$_.FullName -match '\\\.parts\\'}){throw 'Diretorio .parts presente.'}
          if(-not(Test-Path (Join-Path $Root 'modules'))){throw 'Pasta modules ausente.'}

      - name: Parse active PowerShell files
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Root=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          Get-ChildItem $Root -Filter '*.ps1' -Recurse | ForEach-Object {
            $Tokens=$null;$Errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$Tokens,[ref]$Errors)
            if(@($Errors).Count -gt 0){throw "$($_.FullName): $(@($Errors|ForEach-Object Message)-join ' | ')"}
          }

      - name: Validate product and Schema 3
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Root=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          . (Join-Path $Root 'config\DDM-Product.ps1')
          if($DDMProduct.ProductName -ne 'DDM SNOC Windows'){throw 'ProductName invalido.'}
          if($DDMProduct.ProductVersion -ne '2.0.1'){throw 'ProductVersion invalido.'}
          if($DDMProduct.ClientSchemaVersion -ne 3){throw 'Schema invalido.'}
          if($DDMProduct.ZabbixUpdatePolicy -ne 'LATEST_STABLE_IN_MAJOR' -or $DDMProduct.ZabbixMajorLine -ne '7.0'){throw 'Politica Zabbix invalida.'}
          if($DDMProduct.RepositoryAssetPattern -notmatch 'MOTOR'){throw 'Asset do motor nao e especifico.'}
          $Path=Join-Path $Root 'CLIENTE.example.ps1';$Raw=[IO.File]::ReadAllText($Path)
          if($Raw -notmatch '(?ms)^\s*(?:#.*\r?\n\s*)*\$DDMClient\s*=\s*(?<data>@\{.*\})\s*$'){throw 'Modelo nao e somente dados.'}
          $Psd1=Join-Path $env:TEMP 'CLIENTE-ci.psd1';[IO.File]::WriteAllText($Psd1,$Matches.data,[Text.Encoding]::UTF8)
          $Client=Import-PowerShellDataFile $Psd1
          if($Client.SchemaVersion -ne 3 -or $Client.Update.EndpointMode -ne 'LOCAL_BOOTSTRAP_SCHEDULED_TASK'){throw 'Contrato do cliente invalido.'}

      - name: Unit-test common library
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Root=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          . (Join-Path $Root 'lib\DDM-Common.ps1')
          if((Get-DDMCidrInfo '10.1.0.0/16').Canonical -ne '10.1.0.0/16'){throw 'CIDR canonico falhou.'}
          if(-not(Test-DDMIPv4InCidr '10.1.2.3' '10.1.0.0/16')){throw 'Pertencimento falhou.'}
          if(-not(Test-DDMCidrOverlap '10.1.0.0/16' '10.1.2.0/24')){throw 'Sobreposicao falhou.'}
          try{Get-DDMCidrInfo '10.300.0.0/24';throw 'CIDR invalido aceito.'}catch{if($_.Exception.Message -eq 'CIDR invalido aceito.'){throw}}
          function Get-DDMLocalIPv4Info{return @(New-Object PSObject -Property @{Address='10.0.0.10';HasDefaultGateway=$true;Description='test'})}
          $Client=@{Scope=@{RequireNetworkMatch=$true};Exceptions=@{IgnoredIPv4=@()};Networks=@(@{Cidr='10.0.0.0/24';Site='DC';Proxy='proxy-dc';Class='SERVER';Priority=100},@{Cidr='10.2.0.0/24';Site='CPV';Proxy='proxy-cpv';Class='SERVER';Priority=100})}
          if((Select-DDMNetworkRule $Client 'NODE' 'CPV').Proxy -ne 'proxy-cpv'){throw 'Override de site falhou.'}
          $P=@{AllowAgent2OnServer2012=$true}
          if((Get-DDMTargetAgent (New-Object PSObject -Property @{Architecture='X86';IsServer=$true;Version=(New-Object Version '6.1');Caption='2008R2'}) $P).Family -ne 'AGENT1'){throw 'Agent1 x86 falhou.'}
          if((Get-DDMTargetAgent (New-Object PSObject -Property @{Architecture='AMD64';IsServer=$true;Version=(New-Object Version '6.2');Caption='2012'}) $P).Family -ne 'AGENT2'){throw 'Agent2 2012 falhou.'}
          try{Get-DDMTargetAgent (New-Object PSObject -Property @{Architecture='ARM64';IsServer=$true;Version=(New-Object Version '10.0');Caption='ARM'}) $P;throw 'ARM64 aceito.'}catch{if($_.Exception.Message -eq 'ARM64 aceito.'){throw}}

      - name: Enforce update AD and security invariants
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Root=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          $Update=Get-Content (Join-Path $Root 'templates\central\ATUALIZAR-AD.cmd') -Raw
          foreach($Required in @('CENTRAL-UPDATER','CLIENTE.ps1','Update-DDM-SNOC-Central.ps1','%~dp0')){if($Update -notmatch [regex]::Escape($Required)){throw "ATUALIZAR-AD sem $Required"}}
          $All=(Get-ChildItem $Root -Recurse -File | Get-Content -Raw) -join "`n"
          foreach($Forbidden in @('$DDMClientProfile','Get-DDMClientIdentity','DDM_GITHUB_TOKEN','clients.public.json','archive/refs/heads/main.zip')){if($All -match [regex]::Escape($Forbidden)){throw "Arquitetura antiga: $Forbidden"}}
          foreach($Private in @('mizu.local','britta.local','itsouthamerica.ad','adb01.local','10.210.5.7','10.160.1.25','10.160.2.254','SNOC-BRASANITAS')){if($All.IndexOf($Private,[StringComparison]::OrdinalIgnoreCase)-ge 0){throw "Dado real publicado: $Private"}}
          $Engine=Get-Content (Join-Path $Root 'engine\Install-DDM-Zabbix-Windows.ps1') -Raw
          foreach($Required in @("@('AGENT2','PLUGINS')",'zabbix_agent2.d\*.conf','Rollback validado e finalizado','UserParameter duplicado','PLUGINS_AMD64')){if($Engine -notmatch [regex]::Escape($Required)){throw "Invariante ausente: $Required"}}

      - name: Validate modules
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Root=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment\modules'
          foreach($Module in @('CORE','ADDS','HYPERV','TOTVS','VEEAM')){if(-not(Test-Path (Join-Path $Root $Module))){throw "Modulo ausente: $Module"}}
          foreach($Native in @('MSSQL','SQL','POSTGRESQL','MONGODB','IIS')){if(Test-Path (Join-Path $Root $Native)){throw "Modulo nativo nao deve ter scripts: $Native"}}
          $Fragments=Get-ChildItem (Join-Path $Root 'VEEAM\scripts\source') -Filter '*.ps1frag'
          if(@($Fragments).Count -ne 4){throw 'Fonte Veeam incompleta.'}

      - name: Build release layouts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          . (Join-Path $Product 'config\DDM-Product.ps1')
          foreach($Required in @('config\DDM-Product.ps1','lib\DDM-Common.ps1','central\Update-DDM-SNOC-Central.ps1','bootstrap\Invoke-DDM-SNOC-Bootstrap.ps1','templates\central\ATUALIZAR-AD.cmd','docs\UPDATE-AD.md')){if(-not(Test-Path (Join-Path $Product $Required))){throw "Asset incompleto: $Required"}}
