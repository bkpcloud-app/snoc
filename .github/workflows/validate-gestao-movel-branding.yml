name: Validate Gestao Movel Branding

on:
  push:
    paths:
      - 'assets/backup-cloud/gestao-movel/branding/web/**'
      - '.github/workflows/validate-gestao-movel-branding.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell syntax
        run: bash -n assets/backup-cloud/gestao-movel/branding/web/apply-branding.sh

      - name: Build isolated MDM and run twice
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/tomcat9"
          H="$RUNNER_TEMP/home"
          WEB="$GITHUB_WORKSPACE/assets/backup-cloud/gestao-movel/branding/web"
          mkdir -p "$T/conf/Catalina/localhost" "$T/webapps/ROOT/css" "$H"
          cat > "$T/conf/Catalina/localhost/ROOT.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <Context><Parameter name="sample.parameter" value="sample" override="false"/></Context>
          EOF
          echo 'body { margin: 0; }' > "$T/webapps/ROOT/css/main.css"

          for run in 1 2; do
            BC_TEST_MODE=1 BC_BASE="$H" BC_TOMCAT="$T" BC_RAW_BASE="file://$WEB" bash "$WEB/apply-branding.sh"
            sleep 1
          done

          HERO="$T/webapps/ROOT/images/backup-cloud/backupcloud-gestao-movel-login.jpg"
          test -s "$HERO"
          echo 'e1d00fa50a8c1519631ed4d89bac5683c5e73db8c2b8e565dd4fab0ab5ee2659  '"$HERO" | sha256sum -c -
          python3 - "$HERO" "$T/conf/Catalina/localhost/ROOT.xml" <<'PY'
          from pathlib import Path
          import sys, xml.etree.ElementTree as ET
          hero=Path(sys.argv[1]).read_bytes()
          assert hero.startswith(b'\xff\xd8\xff') and hero.endswith(b'\xff\xd9')
          p=Path(sys.argv[2]); ET.parse(p); s=p.read_text(encoding='utf-8')
          for item in ['name="rebranding.name" value="BackupCloud | Gestão Móvel"','name="rebranding.vendor.name" value="BackupCloud"','name="rebranding.mobile.name" value="Gestão Móvel"']:
              assert item in s
          print('Branding validation OK')
          PY
          test "$(grep -c 'BACKUPCLOUD GESTAO MOVEL - INICIO' "$T/webapps/ROOT/css/main.css")" -eq 1
