name: Audit DDM SNOC Windows 2.0.21

on:
  pull_request:
    paths:
      - 'windows/zabbix-agent-deployment/**'
      - '.github/workflows/audit-ddm-snoc-windows-2.0.21.yml'
      - '.github/workflows/ddm-snoc-windows-validation.yml'
      - '.github/workflows/ddm-snoc-windows-release.yml'

permissions:
  contents: write

concurrency:
  group: audit-ddm-snoc-windows-2.0.21-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  audit-2-0-21:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Materialize exact 2.0.21 source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Patch=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment\tools\Promote-DDM-SNOC-2.0.21.ps1'
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $Patch -RepositoryRoot $env:GITHUB_WORKSPACE
          if($LASTEXITCODE -ne 0){throw "Promotion patch returned $LASTEXITCODE"}

      - name: Parse all PowerShell sources
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          foreach($File in @(Get-ChildItem $Product -Filter '*.ps1' -Recurse -Force)){
            $Tokens=$null;$Errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile($File.FullName,[ref]$Tokens,[ref]$Errors)
            if(@($Errors).Count -gt 0){throw (@($Errors|ForEach-Object{"$($File.FullName) L$($_.Extent.StartLineNumber): $($_.Message)"}) -join "`r`n")}
          }

      - name: Execute complete source validation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          foreach($Test in @(
            'Test-DDM-Repository.ps1',
            'Test-DDM-RuntimeLexing.ps1',
            'Test-DDM-CentralBootstrapLoad.ps1',
            'Test-DDM-AclValidation.ps1',
            'Test-DDM-UncCmd.ps1',
            'Test-DDM-ForceRefresh.ps1',
            'Test-DDM-CentralRecovery.ps1',
            'Test-DDM-CentralPathIdentity.ps1',
            'Test-DDM-BootstrapFirstInstall.ps1'
          )){
            Write-Host "RUN_SOURCE_TEST=$Test"
            & (Join-Path $Product ('tools\'+$Test)) -ProductRoot $Product
            if(-not $?){throw "$Test falhou."}
          }

      - name: Execute 240 source migration scenarios
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $global:ProductCode='$ProductCode'
          $Output=Join-Path $env:RUNNER_TEMP 'DDM-SNOC-MIGRATION-240-2.0.21-SOURCE'
          & (Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment\tools\Test-DDM-SNOC-Migration-240Scenarios.ps1') -RepositoryRoot $env:GITHUB_WORKSPACE -OutputDirectory $Output
          if(-not $?){throw '240 cenarios do fonte falharam.'}
          "SOURCE_SCENARIO_OUTPUT=$Output" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build final MOTOR
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          . (Join-Path $Product 'config\DDM-Product.ps1')
          if([string]$DDMProduct.ProductVersion -ne '2.0.21'){throw "Versao inesperada: $($DDMProduct.ProductVersion)"}
          $Dist=Join-Path $env:RUNNER_TEMP 'DDM-SNOC-2.0.21-DIST'
          $Motor=Join-Path $Dist 'DDM-SNOC-WINDOWS-MOTOR-2.0.21'
          Remove-Item $Dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $Motor -ItemType Directory -Force|Out-Null
          foreach($Name in @('Start-DDM-SNOC.ps1','CLIENTE.example.ps1','README.md','CHANGELOG.md')){Copy-Item (Join-Path $Product $Name) (Join-Path $Motor $Name) -Force}
          foreach($Name in @('config','lib','central','bootstrap','endpoint','engine','modules','templates','tools','docs','clients')){Copy-Item (Join-Path $Product $Name) (Join-Path $Motor $Name) -Recurse -Force}
          $Zip=Join-Path $Dist 'DDM-SNOC-WINDOWS-MOTOR-2.0.21.zip'
          Compress-Archive -Path $Motor -DestinationPath $Zip -CompressionLevel Optimal
          "MOTOR_ZIP=$Zip" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "DIST_PATH=$Dist" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Execute complete final MOTOR validation and 240 scenarios
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Expanded=Join-Path $env:RUNNER_TEMP 'DDM-SNOC-2.0.21-EXPANDED'
          $FinalRepo=Join-Path $env:RUNNER_TEMP 'DDM-SNOC-2.0.21-FINAL-REPO'
          Remove-Item $Expanded,$FinalRepo -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $env:MOTOR_ZIP -DestinationPath $Expanded -Force
          $ExpandedProduct=Join-Path $Expanded 'DDM-SNOC-WINDOWS-MOTOR-2.0.21'
          $FinalProduct=Join-Path $FinalRepo 'windows\zabbix-agent-deployment'
          New-Item (Split-Path -Parent $FinalProduct) -ItemType Directory -Force|Out-Null
          Copy-Item -LiteralPath $ExpandedProduct -Destination $FinalProduct -Recurse -Force
          $WorkflowRoot=Join-Path $FinalRepo '.github\workflows';New-Item $WorkflowRoot -ItemType Directory -Force|Out-Null
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE '.github\workflows\ddm-snoc-windows-validation.yml') $WorkflowRoot -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE '.github\workflows\ddm-snoc-windows-release.yml') $WorkflowRoot -Force
          foreach($Test in @(
            'Test-DDM-Repository.ps1',
            'Test-DDM-RuntimeLexing.ps1',
            'Test-DDM-CentralBootstrapLoad.ps1',
            'Test-DDM-AclValidation.ps1',
            'Test-DDM-UncCmd.ps1',
            'Test-DDM-ForceRefresh.ps1',
            'Test-DDM-CentralRecovery.ps1',
            'Test-DDM-CentralPathIdentity.ps1',
            'Test-DDM-BootstrapFirstInstall.ps1'
          )){
            Write-Host "RUN_FINAL_TEST=$Test"
            & (Join-Path $FinalProduct ('tools\'+$Test)) -ProductRoot $FinalProduct
            if(-not $?){throw "Final $Test falhou."}
          }
          $global:ProductCode='$ProductCode'
          $Output=Join-Path $env:RUNNER_TEMP 'DDM-SNOC-MIGRATION-240-2.0.21-FINAL'
          & (Join-Path $FinalProduct 'tools\Test-DDM-SNOC-Migration-240Scenarios.ps1') -RepositoryRoot $FinalRepo -OutputDirectory $Output
          if(-not $?){throw '240 cenarios do MOTOR final falharam.'}
          "FINAL_SCENARIO_OUTPUT=$Output" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload immutable audit evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: DDM-SNOC-WINDOWS-2.0.21-AUDIT-EVIDENCE
          path: |
            ${{ env.SOURCE_SCENARIO_OUTPUT }}
            ${{ env.FINAL_SCENARIO_OUTPUT }}
            ${{ env.DIST_PATH }}
            windows/zabbix-agent-deployment/config/DDM-Product.ps1
            windows/zabbix-agent-deployment/central/lib/DDM-Central-Client.ps1
            windows/zabbix-agent-deployment/central/lib/Invoke-DDM-Central-Publish.ps1
            windows/zabbix-agent-deployment/tools/Test-DDM-CentralPathIdentity.ps1
            windows/zabbix-agent-deployment/docs/RELEASE-2.0.21.md
          if-no-files-found: warn
          retention-days: 30

      - name: Commit exact audited source
        if: success() && github.head_ref == 'fix/ddm-snoc-windows-2.0.21-centralroot'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- windows/zabbix-agent-deployment/config/DDM-Product.ps1 windows/zabbix-agent-deployment/tools/Test-DDM-Repository.ps1 windows/zabbix-agent-deployment/central/lib/DDM-Central-Client.ps1 windows/zabbix-agent-deployment/central/lib/Invoke-DDM-Central-Publish.ps1 windows/zabbix-agent-deployment/tools/Test-DDM-CentralPathIdentity.ps1 windows/zabbix-agent-deployment/CHANGELOG.md windows/zabbix-agent-deployment/docs/RELEASE-2.0.21.md .github/workflows/ddm-snoc-windows-validation.yml .github/workflows/ddm-snoc-windows-release.yml
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0){Write-Host 'AUDITED_SOURCE_ALREADY_COMMITTED=1';exit 0}
          git commit -m 'fix(windows): materialize audited CentralRoot identity 2.0.21'
          git push origin HEAD:${{ github.head_ref }}