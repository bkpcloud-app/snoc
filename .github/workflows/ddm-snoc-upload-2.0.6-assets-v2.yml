name: Upload and Verify DDM SNOC Windows 2.0.6 Assets

on:
  push:
    paths:
      - '.github/workflows/ddm-snoc-upload-2.0.6-assets-v2.yml'

permissions:
  contents: write

jobs:
  upload:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout validated tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ddm-snoc-windows-v2.0.6

      - name: Build and upload explicit assets
        shell: powershell
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $Result=Join-Path $env:GITHUB_WORKSPACE 'upload-2.0.6-result.txt'
          try{
            $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
            . (Join-Path $Product 'config\DDM-Product.ps1')
            if($DDMProduct.ProductVersion -ne '2.0.6'){throw "Versao inesperada: $($DDMProduct.ProductVersion)"}
            & (Join-Path $Product 'tools\Test-DDM-Repository.ps1') -ProductRoot $Product
            & (Join-Path $Product 'tools\Test-DDM-RuntimeLexing.ps1') -ProductRoot $Product

            $Dist=Join-Path $env:GITHUB_WORKSPACE 'dist-upload-v2'
            $Motor=Join-Path $Dist 'DDM-SNOC-WINDOWS-MOTOR-2.0.6'
            $Seed=Join-Path $Dist 'DDM-SNOC-WINDOWS-AD-SEED-2.0.6'
            Remove-Item $Dist -Recurse -Force -ErrorAction SilentlyContinue
            New-Item $Motor,$Seed -ItemType Directory -Force | Out-Null

            foreach($Name in @('Start-DDM-SNOC.ps1','CLIENTE.example.ps1','README.md','CHANGELOG.md')){Copy-Item (Join-Path $Product $Name) (Join-Path $Motor $Name) -Force}
            foreach($Name in @('config','lib','central','bootstrap','endpoint','engine','modules','templates','tools','docs','clients')){Copy-Item (Join-Path $Product $Name) (Join-Path $Motor $Name) -Recurse -Force}
            foreach($Name in @('ATUALIZAR-AD.cmd','VOLTAR-RELEASE.cmd')){Copy-Item (Join-Path $Product ('templates\central\'+$Name)) (Join-Path $Seed $Name) -Force}
            Copy-Item (Join-Path $Product 'CLIENTE.example.ps1') (Join-Path $Seed 'CLIENTE.example.ps1') -Force
            Copy-Item (Join-Path $Product 'docs\UPDATE-AD.md') (Join-Path $Seed 'LEIA-ME-UPDATE-AD.md') -Force
            Copy-Item (Join-Path $Product 'docs\AUDITORIA-300-PONTOS.md') (Join-Path $Seed 'AUDITORIA-300-PONTOS.md') -Force

            $Updater=Join-Path $Seed 'CENTRAL-UPDATER'
            foreach($Rel in @('central\Update-DDM-SNOC-Central.ps1','central\lib\DDM-Central-Client.ps1','central\lib\DDM-Central-Supply.ps1','central\lib\Invoke-DDM-Central-Publish.ps1','config\DDM-Product.ps1','lib\DDM-Common.ps1')){
              $Source=Join-Path $Product $Rel
              $Destination=Join-Path $Updater $Rel
              New-Item (Split-Path -Parent $Destination) -ItemType Directory -Force | Out-Null
              Copy-Item $Source $Destination -Force
            }
            $Rollback=Join-Path $Seed 'CENTRAL-TOOLS\tools\Set-DDM-CentralRelease.ps1'
            New-Item (Split-Path -Parent $Rollback) -ItemType Directory -Force | Out-Null
            Copy-Item (Join-Path $Product 'tools\Set-DDM-CentralRelease.ps1') $Rollback -Force

            $MotorZip=Join-Path $Dist 'DDM-SNOC-WINDOWS-MOTOR-2.0.6.zip'
            $MotorHash=$MotorZip+'.sha256'
            $SeedZip=Join-Path $Dist 'DDM-SNOC-WINDOWS-AD-SEED-2.0.6.zip'
            $SeedHash=$SeedZip+'.sha256'
            Compress-Archive -Path $Motor -DestinationPath $MotorZip -CompressionLevel Optimal
            Compress-Archive -Path (Join-Path $Seed '*') -DestinationPath $SeedZip -CompressionLevel Optimal
            $MotorSha=(Get-FileHash $MotorZip -Algorithm SHA256).Hash
            $SeedSha=(Get-FileHash $SeedZip -Algorithm SHA256).Hash
            Set-Content $MotorHash -Value ($MotorSha+' *'+(Split-Path -Leaf $MotorZip)) -Encoding ASCII
            Set-Content $SeedHash -Value ($SeedSha+' *'+(Split-Path -Leaf $SeedZip)) -Encoding ASCII

            $Tag='ddm-snoc-windows-v2.0.6'
            $Sha=(git rev-parse HEAD).Trim()
            $ManifestPath=Join-Path $Dist 'DDM-SNOC-WINDOWS-RELEASE-MANIFEST-2.0.6.json'
            $ManifestHash=$ManifestPath+'.sha256'
            $Manifest=New-Object PSObject -Property @{
              Product=$DDMProduct.ProductName
              ProductVersion='2.0.6'
              GitCommit=$Sha
              GitTag=$Tag
              GeneratedAtUtc=(Get-Date).ToUniversalTime().ToString('o')
              Assets=@(
                @{Name=(Split-Path -Leaf $MotorZip);Sha256=$MotorSha;Size=(Get-Item $MotorZip).Length},
                @{Name=(Split-Path -Leaf $SeedZip);Sha256=$SeedSha;Size=(Get-Item $SeedZip).Length}
              )
              Validation=@('PowerShell parser','300-control audit','runtime HTTP mocks','glued-command scan','expanded motor validation')
              ExternalPilotsRequired=$true
            }
            $Manifest | ConvertTo-Json -Depth 6 | Set-Content $ManifestPath -Encoding UTF8
            $ManifestSha=(Get-FileHash $ManifestPath -Algorithm SHA256).Hash
            Set-Content $ManifestHash -Value ($ManifestSha+' *'+(Split-Path -Leaf $ManifestPath)) -Encoding ASCII

            gh release upload $Tag `
              "$MotorZip" `
              "$MotorHash" `
              "$SeedZip" `
              "$SeedHash" `
              "$ManifestPath" `
              "$ManifestHash" `
              --clobber
            if($LASTEXITCODE -ne 0){throw "gh release upload retornou $LASTEXITCODE"}

            $Expected=@('DDM-SNOC-WINDOWS-MOTOR-2.0.6.zip','DDM-SNOC-WINDOWS-MOTOR-2.0.6.zip.sha256','DDM-SNOC-WINDOWS-AD-SEED-2.0.6.zip','DDM-SNOC-WINDOWS-AD-SEED-2.0.6.zip.sha256','DDM-SNOC-WINDOWS-RELEASE-MANIFEST-2.0.6.json','DDM-SNOC-WINDOWS-RELEASE-MANIFEST-2.0.6.json.sha256')
            $Actual=@()
            for($Attempt=1;$Attempt -le 6;$Attempt++){
              Start-Sleep -Seconds 5
              $Release=(gh release view $Tag --json tagName,isDraft,isPrerelease,assets | ConvertFrom-Json)
              $Actual=@($Release.assets | ForEach-Object {[string]$_.name})
              $Missing=@($Expected | Where-Object {$Actual -notcontains $_})
              if($Missing.Count -eq 0 -and $Actual.Count -eq 6){break}
              Write-Host "Tentativa $Attempt/6: faltando=$($Missing -join ','); encontrados=$($Actual -join ',')"
            }

            if($Release.isDraft -or $Release.isPrerelease){throw 'Release marcada como draft ou prerelease.'}
            $Missing=@($Expected | Where-Object {$Actual -notcontains $_})
            if($Missing.Count -gt 0){throw "Assets ausentes apos upload: $($Missing -join ', ')"}
            if($Actual.Count -ne 6){throw "Quantidade inesperada de assets: $($Actual.Count)"}

            "State=READY Tag=$Tag Commit=$Sha VerifiedAtUtc=$((Get-Date).ToUniversalTime().ToString('o')) Assets=$($Actual -join '|') Message=Seis assets enviados explicitamente e validados." | Set-Content $Result -Encoding UTF8
          }
          catch{
            $Message=$_.Exception.ToString().Replace("`r",' ').Replace("`n",' ')
            "State=FAILED Commit=$(git rev-parse HEAD) VerifiedAtUtc=$((Get-Date).ToUniversalTime().ToString('o')) Message=$Message" | Set-Content $Result -Encoding UTF8
            $_ | Format-List * -Force | Out-Host
            exit 1
          }

      - name: Publish upload status to main
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git checkout main
          git pull --rebase origin main
          $Source=Join-Path $env:GITHUB_WORKSPACE 'upload-2.0.6-result.txt'
          if(-not(Test-Path $Source)){"State=FAILED Message=Workflow sem resultado." | Set-Content $Source -Encoding UTF8}
          $Target=Join-Path $env:GITHUB_WORKSPACE 'release-status\ddm-snoc-windows-v2.0.6.txt'
          New-Item (Split-Path -Parent $Target) -ItemType Directory -Force | Out-Null
          Copy-Item $Source $Target -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $Target
          if(-not(git diff --cached --quiet)){
            git commit -m 'chore(snoc-windows): registra upload final 2.0.6'
            git push origin HEAD:main
          }
