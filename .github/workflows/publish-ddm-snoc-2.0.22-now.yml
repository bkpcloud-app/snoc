name: Publish DDM SNOC Windows 2.0.22

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-ddm-snoc-2.0.22-now.yml'
  pull_request:
    paths:
      - '.github/workflows/publish-ddm-snoc-2.0.22-now.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Create exact tag, trigger official release and verify six assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ddm-snoc-windows-v2.0.22
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          main_sha=$(gh api "/repos/$repo/git/ref/heads/main" --jq '.object.sha')
          version=$(gh api "/repos/$repo/contents/windows/zabbix-agent-deployment/config/DDM-Product.ps1?ref=$main_sha" --jq '.content' | base64 -d | sed -n "s/.*ProductVersion[[:space:]]*=[[:space:]]*'\([^']*\)'.*/\1/p" | head -n1)
          if [[ "$version" != "2.0.22" ]]; then
            echo "main is not 2.0.22: $version" >&2
            exit 1
          fi

          if tag_sha=$(gh api "/repos/$repo/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null); then
            if [[ "$tag_sha" != "$main_sha" ]]; then
              echo "Existing tag points to $tag_sha instead of current main $main_sha" >&2
              exit 1
            fi
          else
            gh api --method POST "/repos/$repo/git/refs" -f ref="refs/tags/$TAG" -f sha="$main_sha" >/dev/null
          fi

          if ! gh release view "$TAG" --repo "$repo" >/dev/null 2>&1; then
            gh workflow run ddm-snoc-windows-release.yml --repo "$repo" -f release_tag="$TAG"
          fi

          ok=0
          for i in $(seq 1 200); do
            if json=$(gh release view "$TAG" --repo "$repo" --json tagName,isDraft,isPrerelease,assets 2>/dev/null); then
              draft=$(jq -r '.isDraft' <<<"$json")
              pre=$(jq -r '.isPrerelease' <<<"$json")
              motor=$(jq '[.assets[] | select(.name=="DDM-SNOC-WINDOWS-MOTOR-2.0.22.zip")] | length' <<<"$json")
              motorhash=$(jq '[.assets[] | select(.name=="DDM-SNOC-WINDOWS-MOTOR-2.0.22.zip.sha256")] | length' <<<"$json")
              seed=$(jq '[.assets[] | select(.name=="DDM-SNOC-WINDOWS-AD-SEED-2.0.22.zip")] | length' <<<"$json")
              seedhash=$(jq '[.assets[] | select(.name=="DDM-SNOC-WINDOWS-AD-SEED-2.0.22.zip.sha256")] | length' <<<"$json")
              manifest=$(jq '[.assets[] | select(.name=="DDM-SNOC-WINDOWS-RELEASE-MANIFEST-2.0.22.json")] | length' <<<"$json")
              manifesthash=$(jq '[.assets[] | select(.name=="DDM-SNOC-WINDOWS-RELEASE-MANIFEST-2.0.22.json.sha256")] | length' <<<"$json")
              if [[ "$draft" == "false" && "$pre" == "false" && "$motor" == "1" && "$motorhash" == "1" && "$seed" == "1" && "$seedhash" == "1" && "$manifest" == "1" && "$manifesthash" == "1" ]]; then
                ok=1
                break
              fi
            fi
            echo "Waiting for official release 2.0.22... attempt=$i"
            sleep 15
          done

          if [[ "$ok" != "1" ]]; then
            echo "Official release 2.0.22 was not completed with all six required assets." >&2
            exit 1
          fi

          release_target=$(gh api "/repos/$repo/releases/tags/$TAG" --jq '.target_commitish')
          tag_sha=$(gh api "/repos/$repo/git/ref/tags/$TAG" --jq '.object.sha')
          if [[ "$tag_sha" != "$main_sha" ]]; then
            echo "Final tag mismatch: tag=$tag_sha main=$main_sha" >&2
            exit 1
          fi
          motor_digest=$(gh api "/repos/$repo/releases/tags/$TAG" --jq '.assets[] | select(.name=="DDM-SNOC-WINDOWS-MOTOR-2.0.22.zip") | .digest')
          if [[ ! "$motor_digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]]; then
            echo "MOTOR digest missing or invalid: $motor_digest" >&2
            exit 1
          fi

          content=$(printf 'TAG=%s\nSTATUS=STABLE\nSOURCE_COMMIT=%s\nASSETS=6/6\nMOTOR_DIGEST=%s\nRELEASE_TARGET=%s\n' "$TAG" "$main_sha" "$motor_digest" "$release_target" | base64 -w0)
          gh api --method PUT "/repos/$repo/contents/release-status/ddm-snoc-windows-v2.0.22-published.txt" \
            -f message='status(windows): confirmar release oficial 2.0.22' \
            -f content="$content" \
            -f branch='main' >/dev/null

          echo "RELEASE_2_0_22_READY source=$main_sha digest=$motor_digest"
