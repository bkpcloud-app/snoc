name: Promote DDM SNOC Windows 2.0.10

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_promote-ddm-snoc-2.0.10-v2.yml'

permissions:
  contents: write

concurrency:
  group: promote-ddm-snoc-windows-2.0.10-v2
  cancel-in-progress: false

jobs:
  promote:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Validate, publish and pilot 2.0.10
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & "$env:GITHUB_WORKSPACE\windows\zabbix-agent-deployment\tools\Promote-DDM-SNOC-2.0.10.ps1"
