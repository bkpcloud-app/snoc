name: Validate DDM SNOC Migration 240

on:
  pull_request:
    paths:
      - 'windows/zabbix-agent-deployment/**'
      - '.github/workflows/validate-ddm-snoc-migration-240.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migration-240:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Materialize exact 2.0.17 source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Patch = Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment\tools\Promote-DDM-SNOC-2.0.17.ps1'
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $Patch -RepositoryRoot $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) {
              throw "Promotion patch returned $LASTEXITCODE"
          }

      - name: Parse all PowerShell sources
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Product = Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          foreach ($File in @(Get-ChildItem $Product -Filter '*.ps1' -Recurse)) {
              $Tokens = $null
              $Errors = $null
              [void][Management.Automation.Language.Parser]::ParseFile($File.FullName,[ref]$Tokens,[ref]$Errors)
              if (@($Errors).Count -gt 0) {
                  throw (@($Errors | ForEach-Object { "$($File.FullName) L$($_.Extent.StartLineNumber): $($_.Message)" }) -join "`r`n")
              }
          }

      - name: Execute all 240 migration scenarios
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $global:ProductCode = '$ProductCode'
          $Script = Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment\tools\Test-DDM-SNOC-Migration-240Scenarios.ps1'
          $Output = Join-Path $env:RUNNER_TEMP 'DDM-SNOC-MIGRATION-240-2.0.17'
          . $Script -RepositoryRoot $env:GITHUB_WORKSPACE -OutputDirectory $Output

      - name: Execute complete product validation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Product = Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          & (Join-Path $Product 'tools\Test-DDM-Repository.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-RuntimeLexing.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-CentralBootstrapLoad.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-AclValidation.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-UncCmd.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-ForceRefresh.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-BootstrapFirstInstall.ps1') -ProductRoot $Product

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DDM-SNOC-WINDOWS-2.0.17-VALIDATION
          path: |
            ${{ runner.temp }}/DDM-SNOC-MIGRATION-240-2.0.17
            windows/zabbix-agent-deployment/central/Update-DDM-SNOC-Central.ps1
            windows/zabbix-agent-deployment/config/DDM-Product.ps1
            windows/zabbix-agent-deployment/tools/Test-DDM-Repository.ps1
            windows/zabbix-agent-deployment/tools/Test-DDM-ForceRefresh.ps1
            windows/zabbix-agent-deployment/tools/Test-DDM-SNOC-Migration-240Scenarios.ps1
          if-no-files-found: error
          retention-days: 30

      - name: Commit exact validated 2.0.17 source
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/release-2.0.17'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'windows/zabbix-agent-deployment/config/DDM-Product.ps1'
          git add -- 'windows/zabbix-agent-deployment/CHANGELOG.md'
          git add -- 'windows/zabbix-agent-deployment/tools/Test-DDM-Repository.ps1'
          git add -- 'windows/zabbix-agent-deployment/docs/RELEASE-2.0.17.md'
          if (-not (git diff --cached --quiet)) {
              git commit -m 'release(windows): materialize validated 2.0.17 source'
              git push origin HEAD:${{ github.head_ref }}
          }
