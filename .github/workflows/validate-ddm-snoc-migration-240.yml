name: Validate DDM SNOC Migration 240

on:
  pull_request:
    paths:
      - 'windows/zabbix-agent-deployment/**'
      - '.github/workflows/validate-ddm-snoc-migration-240.yml'
  push:
    branches:
      - main
    paths:
      - 'windows/zabbix-agent-deployment/**'
      - '.github/workflows/validate-ddm-snoc-migration-240.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migration-240:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify audited 2.0.15 source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Product = Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          $Engine = Join-Path $Product 'engine\Install-DDM-Zabbix-Windows.ps1'
          $Config = Join-Path $Product 'config\DDM-Product.ps1'
          $RepositoryTest = Join-Path $Product 'tools\Test-DDM-Repository.ps1'
          $ExpectedEngineHash = 'E034E3D6026414BA64ECDD8DAE16215D8E4AC0266D7583284900340FBE633EBD'

          $EngineHash = (Get-FileHash -LiteralPath $Engine -Algorithm SHA256).Hash
          if ($EngineHash -ne $ExpectedEngineHash) {
              throw "Engine hash mismatch. Expected=$ExpectedEngineHash Current=$EngineHash"
          }

          . $Config
          if ([string]$DDMProduct.ProductVersion -ne '2.0.15') {
              throw "ProductVersion must be 2.0.15. Current=$($DDMProduct.ProductVersion)"
          }

          $RepositoryTestText = [IO.File]::ReadAllText($RepositoryTest)
          $ExpectedOrderAssertion = 'Assert-DDMTest ($Engine.LastIndexOf(''Backup-State $Products'') -lt $Engine.LastIndexOf(''Stop-Agents'')) ''Backup deve ocorrer antes da parada do agente.'''
          if (-not $RepositoryTestText.Contains($ExpectedOrderAssertion)) {
              throw 'Repository test does not require rollback backup before agent stop.'
          }

          Write-Host "ENGINE_SHA256=$EngineHash"
          Write-Host 'PRODUCT_VERSION=2.0.15'

      - name: Parse all PowerShell sources
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Product = Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          foreach ($File in @(Get-ChildItem $Product -Filter '*.ps1' -Recurse)) {
              $Tokens = $null
              $Errors = $null
              [void][Management.Automation.Language.Parser]::ParseFile($File.FullName,[ref]$Tokens,[ref]$Errors)
              if (@($Errors).Count -gt 0) {
                  throw (@($Errors | ForEach-Object { "$($File.FullName) L$($_.Extent.StartLineNumber): $($_.Message)" }) -join "`r`n")
              }
          }

      - name: Execute all 240 migration scenarios
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $global:ProductCode = '$ProductCode'
          $Script = Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment\tools\Test-DDM-SNOC-Migration-240Scenarios.ps1'
          $Output = Join-Path $env:RUNNER_TEMP 'DDM-SNOC-MIGRATION-240'
          . $Script -RepositoryRoot $env:GITHUB_WORKSPACE -OutputDirectory $Output

      - name: Execute complete product validation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Product = Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          & (Join-Path $Product 'tools\Test-DDM-Repository.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-RuntimeLexing.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-CentralBootstrapLoad.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-AclValidation.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-UncCmd.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-BootstrapFirstInstall.ps1') -ProductRoot $Product

      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DDM-SNOC-MIGRATION-240-FINAL-EVIDENCE
          path: |
            ${{ runner.temp }}/DDM-SNOC-MIGRATION-240
            windows/zabbix-agent-deployment/engine/Install-DDM-Zabbix-Windows.ps1
            windows/zabbix-agent-deployment/config/DDM-Product.ps1
            windows/zabbix-agent-deployment/tools/Test-DDM-Repository.ps1
            windows/zabbix-agent-deployment/tools/Test-DDM-SNOC-Migration-240Scenarios.ps1
          if-no-files-found: error
          retention-days: 30

      - name: Publish production tag 2.0.15
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Tag = 'ddm-snoc-windows-v2.0.15'
          git fetch origin --tags --force
          $Existing = [string](git rev-list -n 1 $Tag 2>$null)
          $Existing = $Existing.Trim()

          if (-not [string]::IsNullOrWhiteSpace($Existing)) {
              if ($Existing -ne $env:GITHUB_SHA) {
                  throw "Tag $Tag already points to $Existing instead of $env:GITHUB_SHA"
              }
              Write-Host "TAG_ALREADY_CORRECT=$Tag"
              exit 0
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a $Tag $env:GITHUB_SHA -m 'DDM SNOC Windows 2.0.15 - audited Agent 2 migration'
          git push origin $Tag
          Write-Host "TAG_PUBLISHED=$Tag"
