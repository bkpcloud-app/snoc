name: Validate DDM SNOC Migration 240

on:
  pull_request:
    paths:
      - 'windows/zabbix-agent-deployment/**'
      - '.github/workflows/validate-ddm-snoc-migration-240.yml'
      - '.github/workflows/ddm-snoc-windows-validation.yml'
      - '.github/workflows/ddm-snoc-windows-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migration-240:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Materialize immutable 2.0.29 version
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          & (Join-Path $Product 'tools\Promote-DDM-SNOC-2.0.29.ps1') -RepositoryRoot $env:GITHUB_WORKSPACE
          if(-not $?){throw '2.0.29 materialization failed.'}

      - name: Resolve product version
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Product = Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          . (Join-Path $Product 'config\DDM-Product.ps1')
          $Version = [string]$DDMProduct.ProductVersion
          if ($Version -ne '2.0.29') { throw "Expected 2.0.29, got $Version" }
          "DDM_PRODUCT_VERSION=$Version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "PRODUCT_VERSION=$Version"

      - name: Parse all PowerShell sources
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Product = Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          foreach ($File in @(Get-ChildItem $Product -Filter '*.ps1' -Recurse)) {
              $Tokens = $null
              $Errors = $null
              [void][Management.Automation.Language.Parser]::ParseFile($File.FullName,[ref]$Tokens,[ref]$Errors)
              if (@($Errors).Count -gt 0) {
                  throw (@($Errors | ForEach-Object { "$($File.FullName) L$($_.Extent.StartLineNumber): $($_.Message)" }) -join "`r`n")
              }
          }

      - name: Execute all 240 migration scenarios
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $global:ProductCode = '$ProductCode'
          $Script = Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment\tools\Test-DDM-SNOC-Migration-240Scenarios.ps1'
          $Output = Join-Path $env:RUNNER_TEMP ('DDM-SNOC-MIGRATION-240-' + $env:DDM_PRODUCT_VERSION)
          & $Script -RepositoryRoot $env:GITHUB_WORKSPACE -OutputDirectory $Output
          if (-not $?) { throw 'Migration validation returned failure.' }

      - name: Execute SRV-AE parser and endpoint regressions
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          foreach($Test in @('Test-DDM-LegacyBom.ps1','Test-DDM-EndpointRuntimeGuard.ps1')){
              & (Join-Path $Product ('tools\'+$Test)) -ProductRoot $Product
              if(-not $?){throw "$Test returned failure."}
          }

      - name: Execute complete product validation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Product = Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          foreach ($Test in @(
              'Test-DDM-Repository.ps1',
              'Test-DDM-RuntimeLexing.ps1',
              'Test-DDM-CentralBootstrapLoad.ps1',
              'Test-DDM-AclValidation.ps1',
              'Test-DDM-UncCmd.ps1',
              'Test-DDM-ForceRefresh.ps1',
              'Test-DDM-CentralRecovery.ps1',
              'Test-DDM-CentralPathIdentity.ps1',
              'Test-DDM-BootstrapFirstInstall.ps1'
          )) {
              & (Join-Path $Product ('tools\' + $Test)) -ProductRoot $Product
              if (-not $?) { throw "$Test returned failure." }
          }

      - name: Commit exact validated 2.0.29 source
        if: success() && github.event_name == 'pull_request'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'bkpcloud-app'
          git config user.email 'actions@users.noreply.github.com'
          git add -- 'windows/zabbix-agent-deployment/config/DDM-Product.ps1' 'windows/zabbix-agent-deployment/tools/Test-DDM-Repository.ps1' 'windows/zabbix-agent-deployment/CHANGELOG.md'
          $Changes=git status --porcelain
          if([string]::IsNullOrWhiteSpace(($Changes -join ''))){Write-Host 'VALIDATED_2.0.29_ALREADY_COMMITTED';exit 0}
          git commit -m 'release(windows): promote validated 2.0.29 source'
          if($LASTEXITCODE -ne 0){throw 'git commit failed'}
          git push origin HEAD:${{ github.head_ref }}
          if($LASTEXITCODE -ne 0){throw 'git push failed'}

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: DDM-SNOC-WINDOWS-MIGRATION-VALIDATION-2.0.29
          path: |
            ${{ runner.temp }}/DDM-SNOC-MIGRATION-240-*
            windows/zabbix-agent-deployment/engine/Install-DDM-Zabbix-Windows.ps1
            windows/zabbix-agent-deployment/endpoint/Invoke-DDM-SNOC-Daily.ps1
            windows/zabbix-agent-deployment/config/DDM-Product.ps1
            windows/zabbix-agent-deployment/CHANGELOG.md
            windows/zabbix-agent-deployment/tools/Test-DDM-LegacyBom.ps1
            windows/zabbix-agent-deployment/tools/Test-DDM-EndpointRuntimeGuard.ps1
          if-no-files-found: error
          retention-days: 30
