name: Validate DDM SNOC Migration 240

on:
  pull_request:
    paths:
      - 'windows/zabbix-agent-deployment/engine/Install-DDM-Zabbix-Windows.ps1'
      - 'windows/zabbix-agent-deployment/config/DDM-Product.ps1'
      - 'windows/zabbix-agent-deployment/CHANGELOG.md'
      - 'windows/zabbix-agent-deployment/lib/DDM-Common.ps1'
      - 'windows/zabbix-agent-deployment/tools/Build-DDM-SNOC-MigrationCandidate.ps1'
      - 'windows/zabbix-agent-deployment/tools/Test-DDM-Repository.ps1'
      - 'windows/zabbix-agent-deployment/tools/Test-DDM-SNOC-Migration-240Scenarios.ps1'
      - '.github/workflows/validate-ddm-snoc-migration-240.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migration-240:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Materialize exact audited 2.0.15 candidate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Root = Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          $Engine = Join-Path $Root 'engine\Install-DDM-Zabbix-Windows.ps1'
          $Config = Join-Path $Root 'config\DDM-Product.ps1'
          $ChangeLog = Join-Path $Root 'CHANGELOG.md'
          $RepositoryTest = Join-Path $Root 'tools\Test-DDM-Repository.ps1'
          $Builder = Join-Path $Root 'tools\Build-DDM-SNOC-MigrationCandidate.ps1'
          $ExpectedEngineHash = 'E034E3D6026414BA64ECDD8DAE16215D8E4AC0266D7583284900340FBE633EBD'

          $CurrentEngineHash = (Get-FileHash -LiteralPath $Engine -Algorithm SHA256).Hash
          if ($CurrentEngineHash -ne $ExpectedEngineHash) {
              & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $Builder -RepositoryRoot $env:GITHUB_WORKSPACE
              if ($LASTEXITCODE -ne 0) {
                  throw "Candidate builder returned $LASTEXITCODE"
              }
          }

          $CurrentEngineHash = (Get-FileHash -LiteralPath $Engine -Algorithm SHA256).Hash
          if ($CurrentEngineHash -ne $ExpectedEngineHash) {
              throw "Engine hash mismatch. Expected=$ExpectedEngineHash Current=$CurrentEngineHash"
          }

          $ConfigText = [IO.File]::ReadAllText($Config)
          if ($ConfigText -match "ProductVersion\s*=\s*'2\.0\.14'") {
              $ConfigText = $ConfigText.Replace("ProductVersion           = '2.0.14'","ProductVersion           = '2.0.15'")
              [IO.File]::WriteAllText($Config,$ConfigText,(New-Object Text.UTF8Encoding($false)))
          }
          if ([IO.File]::ReadAllText($Config) -notmatch "ProductVersion\s*=\s*'2\.0\.15'") {
              throw 'ProductVersion 2.0.15 is not active.'
          }

          $RepositoryTestText = [IO.File]::ReadAllText($RepositoryTest)
          $RepositoryTestText = $RepositoryTestText.Replace(
              "Assert-DDMTest (`$DDMProduct.ProductVersion -eq '2.0.14') 'ProductVersion deve ser 2.0.14.'",
              "Assert-DDMTest (`$DDMProduct.ProductVersion -eq '2.0.15') 'ProductVersion deve ser 2.0.15.'"
          )

          $OldOrderAssertion = @'
Assert-DDMTest ($Engine.LastIndexOf('Stop-Agents') -lt $Engine.LastIndexOf('Backup-State $Products')) 'Backup ocorre antes da parada do agente.'
'@.Trim()
          $NewOrderAssertion = @'
Assert-DDMTest ($Engine.LastIndexOf('Backup-State $Products') -lt $Engine.LastIndexOf('Stop-Agents')) 'Backup deve ocorrer antes da parada do agente.'
'@.Trim()
          $RepositoryTestText = $RepositoryTestText.Replace($OldOrderAssertion,$NewOrderAssertion)

          if ($RepositoryTestText -notmatch "ProductVersion -eq '2\.0\.15'") {
              throw 'Repository test was not aligned to 2.0.15.'
          }
          if (-not $RepositoryTestText.Contains($NewOrderAssertion)) {
              throw 'Repository test still requires stopping agents before rollback backup.'
          }
          [IO.File]::WriteAllText($RepositoryTest,$RepositoryTestText,(New-Object Text.UTF8Encoding($false)))

          $ChangeText = [IO.File]::ReadAllText($ChangeLog)
          if ($ChangeText -notmatch '(?m)^## 2\.0\.15 ') {
              $Header = "## 2.0.15 - 2026-08-05`r`n- Corrige a ordem transacional: backup completo antes de parar os agentes.`r`n- Envia SERVER, SERVERACTIVE, HOSTNAME, HOSTMETADATA e LISTENPORT ao MSI do Agent 2.`r`n- Mantem o Agent 1 ate validar configuracao, servico, porta e plugins do Agent 2.`r`n- Valida 240 cenarios de migracao, falha e rollback sem reprovacoes.`r`n`r`n"
              [IO.File]::WriteAllText($ChangeLog,$Header+$ChangeText,(New-Object Text.UTF8Encoding($false)))
          }

      - name: Parse exact candidate sources
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Root = Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          foreach ($File in @(Get-ChildItem $Root -Filter '*.ps1' -Recurse)) {
              $Tokens = $null
              $Errors = $null
              [void][Management.Automation.Language.Parser]::ParseFile($File.FullName,[ref]$Tokens,[ref]$Errors)
              if (@($Errors).Count -gt 0) {
                  throw (@($Errors | ForEach-Object { "$($File.FullName) L$($_.Extent.StartLineNumber): $($_.Message)" }) -join "`r`n")
              }
          }

      - name: Execute all 240 different migration scenarios
        id: audit
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Output = Join-Path $env:RUNNER_TEMP 'DDM-SNOC-MIGRATION-240'
          $Script = Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment\tools\Test-DDM-SNOC-Migration-240Scenarios.ps1'
          $global:ProductCode = '$ProductCode'
          $Code = 0
          try {
              . $Script -RepositoryRoot $env:GITHUB_WORKSPACE -OutputDirectory $Output
          }
          catch {
              $Code = 1
              Write-Host $_.Exception.Message -ForegroundColor Yellow
          }
          "exit_code=$Code" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Enforce audit result
        shell: powershell
        run: |
          $Code = '${{ steps.audit.outputs.exit_code }}'
          if ([string]::IsNullOrWhiteSpace($Code)) {
              throw 'The audit did not produce an exit code.'
          }
          if ([int]$Code -ne 0) {
              throw "Migration audit failed. ExitCode=$Code"
          }
          Write-Host 'MIGRATION AUDIT PASSED: 240/240.' -ForegroundColor Green

      - name: Execute complete product validation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Product = Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          & (Join-Path $Product 'tools\Test-DDM-Repository.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-RuntimeLexing.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-CentralBootstrapLoad.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-AclValidation.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-UncCmd.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-BootstrapFirstInstall.ps1') -ProductRoot $Product

      - name: Upload evidence and exact candidate sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DDM-SNOC-MIGRATION-240-FINAL-EVIDENCE
          path: |
            ${{ runner.temp }}/DDM-SNOC-MIGRATION-240
            windows/zabbix-agent-deployment/engine/Install-DDM-Zabbix-Windows.ps1
            windows/zabbix-agent-deployment/config/DDM-Product.ps1
            windows/zabbix-agent-deployment/CHANGELOG.md
            windows/zabbix-agent-deployment/tools/Test-DDM-Repository.ps1
            windows/zabbix-agent-deployment/tools/Test-DDM-SNOC-Migration-240Scenarios.ps1
          if-no-files-found: error
          retention-days: 30

      - name: Commit exact audited 2.0.15 source
        if: github.event_name == 'pull_request' && github.head_ref == 'audit/srv-ae-migration-120'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'windows/zabbix-agent-deployment/engine/Install-DDM-Zabbix-Windows.ps1'
          git add -- 'windows/zabbix-agent-deployment/config/DDM-Product.ps1'
          git add -- 'windows/zabbix-agent-deployment/CHANGELOG.md'
          git add -- 'windows/zabbix-agent-deployment/tools/Test-DDM-Repository.ps1'
          git add -- 'windows/zabbix-agent-deployment/tools/Test-DDM-SNOC-Migration-240Scenarios.ps1'
          if (-not (git diff --cached --quiet)) {
              git commit -m 'fix(windows): promote audited migration engine 2.0.15'
              git push origin HEAD:${{ github.head_ref }}
          }
