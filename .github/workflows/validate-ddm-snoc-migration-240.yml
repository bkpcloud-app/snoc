name: Validate DDM SNOC Migration 240

on:
  pull_request:
    paths:
      - 'windows/zabbix-agent-deployment/engine/Install-DDM-Zabbix-Windows.ps1'
      - 'windows/zabbix-agent-deployment/config/DDM-Product.ps1'
      - 'windows/zabbix-agent-deployment/lib/DDM-Common.ps1'
      - 'windows/zabbix-agent-deployment/tools/Test-DDM-SNOC-Migration-240Scenarios.ps1'
      - '.github/workflows/validate-ddm-snoc-migration-240.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-240:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse the 240-scenario test
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Path = Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment\tools\Test-DDM-SNOC-Migration-240Scenarios.ps1'
          $Tokens = $null
          $Errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile($Path,[ref]$Tokens,[ref]$Errors)
          if (@($Errors).Count -gt 0) {
              throw (@($Errors | ForEach-Object { "L$($_.Extent.StartLineNumber): $($_.Message)" }) -join "`r`n")
          }

      - name: Execute 240 different migration scenarios
        id: audit
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Output = Join-Path $env:RUNNER_TEMP 'DDM-SNOC-MIGRATION-240'
          $Script = Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment\tools\Test-DDM-SNOC-Migration-240Scenarios.ps1'
          $global:ProductCode = '$ProductCode'
          $Code = 0
          try {
              . $Script -RepositoryRoot $env:GITHUB_WORKSPACE -OutputDirectory $Output
          }
          catch {
              $Code = 1
              Write-Host $_.Exception.Message -ForegroundColor Yellow
          }
          "exit_code=$Code" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload complete evidence and exact audited sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DDM-SNOC-MIGRATION-240-EVIDENCE
          path: |
            ${{ runner.temp }}/DDM-SNOC-MIGRATION-240
            windows/zabbix-agent-deployment/engine/Install-DDM-Zabbix-Windows.ps1
            windows/zabbix-agent-deployment/tools/Test-DDM-SNOC-Migration-240Scenarios.ps1
          if-no-files-found: error
          retention-days: 30

      - name: Enforce audit result
        if: always()
        shell: powershell
        run: |
          $Code = '${{ steps.audit.outputs.exit_code }}'
          if ([string]::IsNullOrWhiteSpace($Code)) {
              throw 'A auditoria não informou código de saída.'
          }
          if ([int]$Code -ne 0) {
              throw "Auditoria de migração reprovada. ExitCode=$Code"
          }
          Write-Host 'AUDITORIA APROVADA: 240/240.' -ForegroundColor Green
