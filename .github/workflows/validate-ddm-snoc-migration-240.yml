name: Validate DDM SNOC Migration 240

on:
  pull_request:
    paths:
      - 'windows/zabbix-agent-deployment/engine/Install-DDM-Zabbix-Windows.ps1'
      - 'windows/zabbix-agent-deployment/config/DDM-Product.ps1'
      - 'windows/zabbix-agent-deployment/lib/DDM-Common.ps1'
      - 'windows/zabbix-agent-deployment/tools/Test-DDM-SNOC-Migration-240Scenarios.ps1'
      - '.github/workflows/validate-ddm-snoc-migration-240.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-240:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build corrected candidate without changing repository
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $EnginePath = Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment\engine\Install-DDM-Zabbix-Windows.ps1'
          $TestPath = Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment\tools\Test-DDM-SNOC-Migration-240Scenarios.ps1'

          $Engine = [IO.File]::ReadAllText($EnginePath)
          $Test = [IO.File]::ReadAllText($TestPath)

          $OldOrder = 'Stop-Agents;$Backup=Backup-State $Products $A1 $A2 $NeedMsi'
          $NewOrder = '$Backup=Backup-State $Products $A1 $A2 $NeedMsi' + "`r`n    try{" + "`r`n        Stop-Agents"
          if (-not $Engine.Contains($OldOrder)) {
              throw 'Unsafe backup/stop sequence was not found exactly once.'
          }
          if ([regex]::Matches($Engine,[regex]::Escape($OldOrder)).Count -ne 1) {
              throw 'Unsafe backup/stop sequence count is not one.'
          }
          $Engine = $Engine.Replace($OldOrder,$NewOrder)

          $OldMsi = @'
Invoke-Msi 'INSTALL' (Get-Artifact $Role) @('ADDLOCAL=ALL','DONOTSTART=1','STARTUPTYPE=automatic','SKIP=fw',('INSTALLFOLDER="'+$InstallRoot+'"')) $Role
'@.Trim()
          $NewMsi = @'
$MsiListenPort=if($Client.Communication.ListenPort){[int]$Client.Communication.ListenPort}else{[int]$DDMProduct.ListenPort};Invoke-Msi 'INSTALL' (Get-Artifact $Role) @('ADDLOCAL=ALL','DONOTSTART=1','STARTUPTYPE=automatic','SKIP=fw',('SERVER="'+([string]$Identity.Proxy)+'"'),('SERVERACTIVE="'+([string]$Identity.ProxyActive)+'"'),('HOSTNAME="'+([string]$Identity.Hostname)+'"'),('HOSTMETADATA="'+([string]$Identity.Metadata)+'"'),('LISTENPORT="'+([string]$MsiListenPort)+'"'),('INSTALLFOLDER="'+$InstallRoot+'"')) $Role
'@.Trim()
          if (-not $Engine.Contains($OldMsi)) {
              throw 'Unsafe target MSI property block was not found exactly once.'
          }
          if ([regex]::Matches($Engine,[regex]::Escape($OldMsi)).Count -ne 1) {
              throw 'Unsafe target MSI property block count is not one.'
          }
          $Engine = $Engine.Replace($OldMsi,$NewMsi)

          $OldCommitModel = "if (`$Step -eq 'Commit') { `$State.Committed = `$true }"
          $NewCommitModel = "if (`$Step -eq 'Commit' -and `$Step -ne `$FaultStep) { `$State.Committed = `$true }"
          if (-not $Test.Contains($OldCommitModel)) {
              throw 'Commit fault model was not found exactly once.'
          }
          if ([regex]::Matches($Test,[regex]::Escape($OldCommitModel)).Count -ne 1) {
              throw 'Commit fault model count is not one.'
          }
          $Test = $Test.Replace($OldCommitModel,$NewCommitModel)

          $Utf8NoBom = New-Object Text.UTF8Encoding($false)
          [IO.File]::WriteAllText($EnginePath,$Engine,$Utf8NoBom)
          [IO.File]::WriteAllText($TestPath,$Test,$Utf8NoBom)

          foreach ($Path in @($EnginePath,$TestPath)) {
              $Tokens = $null
              $Errors = $null
              [void][Management.Automation.Language.Parser]::ParseFile($Path,[ref]$Tokens,[ref]$Errors)
              if (@($Errors).Count -gt 0) {
                  throw (@($Errors | ForEach-Object { "$Path L$($_.Extent.StartLineNumber): $($_.Message)" }) -join "`r`n")
              }
          }

          $EngineHash = (Get-FileHash -LiteralPath $EnginePath -Algorithm SHA256).Hash
          $TestHash = (Get-FileHash -LiteralPath $TestPath -Algorithm SHA256).Hash
          Write-Host "CANDIDATE_ENGINE_SHA256=$EngineHash"
          Write-Host "CANDIDATE_TEST_SHA256=$TestHash"

      - name: Execute all 240 different migration scenarios
        id: audit
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Output = Join-Path $env:RUNNER_TEMP 'DDM-SNOC-MIGRATION-240'
          $Script = Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment\tools\Test-DDM-SNOC-Migration-240Scenarios.ps1'
          $global:ProductCode = '$ProductCode'
          $Code = 0
          try {
              . $Script -RepositoryRoot $env:GITHUB_WORKSPACE -OutputDirectory $Output
          }
          catch {
              $Code = 1
              Write-Host $_.Exception.Message -ForegroundColor Yellow
          }
          "exit_code=$Code" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload complete evidence and exact candidate sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DDM-SNOC-MIGRATION-240-CANDIDATE-EVIDENCE
          path: |
            ${{ runner.temp }}/DDM-SNOC-MIGRATION-240
            windows/zabbix-agent-deployment/engine/Install-DDM-Zabbix-Windows.ps1
            windows/zabbix-agent-deployment/tools/Test-DDM-SNOC-Migration-240Scenarios.ps1
          if-no-files-found: error
          retention-days: 30

      - name: Enforce audit result
        if: always()
        shell: powershell
        run: |
          $Code = '${{ steps.audit.outputs.exit_code }}'
          if ([string]::IsNullOrWhiteSpace($Code)) {
              throw 'The audit did not produce an exit code.'
          }
          if ([int]$Code -ne 0) {
              throw "Migration audit failed. ExitCode=$Code"
          }
          Write-Host 'MIGRATION AUDIT PASSED: 240/240.' -ForegroundColor Green
