name: Publish DDM SNOC Windows 2.0.6 Hotfix

on:
  push:
    paths:
      - '.github/workflows/ddm-snoc-release-2.0.6-hotfix.yml'

permissions:
  contents: write

concurrency:
  group: ddm-snoc-windows-hotfix-2.0.6
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: main

      - name: Finalize 2.0.6 source and tests
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'

          $SupplyPath=Join-Path $Product 'central\lib\DDM-Central-Supply.ps1'
          $Supply=[IO.File]::ReadAllText($SupplyPath)
          $Old='TimeoutSec      = Get-DDMHttpTimeoutSeconds $Product'
          $New='TimeoutSec      = (Get-DDMHttpTimeoutSeconds $Product)'
          if($Supply.Contains($Old)){
            $Supply=$Supply.Replace($Old,$New)
            [IO.File]::WriteAllText($SupplyPath,$Supply,(New-Object Text.UTF8Encoding($false)))
          }
          if(-not([IO.File]::ReadAllText($SupplyPath).Contains($New))){throw 'TimeoutSec corrigido nao encontrado.'}

          $TestPath=Join-Path $Product 'tools\Test-DDM-Repository.ps1'
          $Test=[IO.File]::ReadAllText($TestPath)
          $ExpectedOld="Assert-DDMTest (`$DDMProduct.ProductVersion -eq '2.0.5') 'ProductVersion deve ser 2.0.5.'"
          $ExpectedNew="Assert-DDMTest (`$DDMProduct.ProductVersion -eq '2.0.6') 'ProductVersion deve ser 2.0.6.'"
          if($Test.Contains($ExpectedOld)){
            $Test=$Test.Replace($ExpectedOld,$ExpectedNew)
            [IO.File]::WriteAllText($TestPath,$Test,(New-Object Text.UTF8Encoding($false)))
          }
          if(-not([IO.File]::ReadAllText($TestPath).Contains($ExpectedNew))){throw 'Contrato 2.0.6 nao foi atualizado no auditor.'}

          $RuntimePath=Join-Path $Product 'tools\Test-DDM-RuntimeLexing.ps1'
          $Runtime=[IO.File]::ReadAllText($RuntimePath)
          $Runtime=$Runtime.Replace("    'Write-CentralLog',`r`n    'Log'","    'Write-CentralLog'")
          $Runtime=$Runtime.Replace("    'Write-CentralLog',`n    'Log'","    'Write-CentralLog'")
          [IO.File]::WriteAllText($RuntimePath,$Runtime,(New-Object Text.UTF8Encoding($false)))

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add windows/zabbix-agent-deployment
          if(-not (git diff --cached --quiet)){
            git commit -m 'fix(snoc-windows): fecha validacao runtime da 2.0.6'
            git push origin HEAD:main
          }

      - name: Parse every PowerShell file
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Root=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          $Failed=$false
          foreach($File in @(Get-ChildItem $Root -Filter '*.ps1' -Recurse)){
            $Tokens=$null
            $Errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile($File.FullName,[ref]$Tokens,[ref]$Errors)
            foreach($ParseError in @($Errors)){
              $Failed=$true
              Write-Host ("PARSER_ERROR file={0} line={1} column={2} text={3} message={4}" -f $File.FullName,$ParseError.Extent.StartLineNumber,$ParseError.Extent.StartColumnNumber,$ParseError.Extent.Text,$ParseError.Message)
            }
          }
          if($Failed){throw 'PowerShell parser errors were found.'}

      - name: Execute repository and runtime validations
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          & (Join-Path $Product 'tools\Test-DDM-Repository.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-RuntimeLexing.ps1') -ProductRoot $Product

      - name: Build official assets
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          . (Join-Path $Product 'config\DDM-Product.ps1')
          if($DDMProduct.ProductVersion -ne '2.0.6'){throw 'ProductVersion diferente de 2.0.6.'}

          $Dist=Join-Path $env:GITHUB_WORKSPACE 'dist'
          $Motor=Join-Path $Dist ('DDM-SNOC-WINDOWS-MOTOR-' + $DDMProduct.ProductVersion)
          $Seed=Join-Path $Dist ('DDM-SNOC-WINDOWS-AD-SEED-' + $DDMProduct.ProductVersion)
          Remove-Item $Dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $Motor,$Seed -ItemType Directory -Force | Out-Null

          foreach($Name in @('Start-DDM-SNOC.ps1','CLIENTE.example.ps1','README.md','CHANGELOG.md')){
            Copy-Item (Join-Path $Product $Name) (Join-Path $Motor $Name) -Force
          }
          foreach($Name in @('config','lib','central','bootstrap','endpoint','engine','modules','templates','tools','docs','clients')){
            Copy-Item (Join-Path $Product $Name) (Join-Path $Motor $Name) -Recurse -Force
          }

          foreach($Name in @('ATUALIZAR-AD.cmd','VOLTAR-RELEASE.cmd')){
            Copy-Item (Join-Path $Product ('templates\central\'+$Name)) (Join-Path $Seed $Name) -Force
          }
          Copy-Item (Join-Path $Product 'CLIENTE.example.ps1') (Join-Path $Seed 'CLIENTE.example.ps1') -Force
          Copy-Item (Join-Path $Product 'docs\UPDATE-AD.md') (Join-Path $Seed 'LEIA-ME-UPDATE-AD.md') -Force
          Copy-Item (Join-Path $Product 'docs\AUDITORIA-300-PONTOS.md') (Join-Path $Seed 'AUDITORIA-300-PONTOS.md') -Force

          $Updater=Join-Path $Seed 'CENTRAL-UPDATER'
          foreach($Rel in @(
            'central\Update-DDM-SNOC-Central.ps1',
            'central\lib\DDM-Central-Client.ps1',
            'central\lib\DDM-Central-Supply.ps1',
            'central\lib\Invoke-DDM-Central-Publish.ps1',
            'config\DDM-Product.ps1',
            'lib\DDM-Common.ps1'
          )){
            $Source=Join-Path $Product $Rel
            $Destination=Join-Path $Updater $Rel
            New-Item (Split-Path -Parent $Destination) -ItemType Directory -Force | Out-Null
            Copy-Item $Source $Destination -Force
          }

          $RollbackDestination=Join-Path $Seed 'CENTRAL-TOOLS\tools\Set-DDM-CentralRelease.ps1'
          New-Item (Split-Path -Parent $RollbackDestination) -ItemType Directory -Force | Out-Null
          Copy-Item (Join-Path $Product 'tools\Set-DDM-CentralRelease.ps1') $RollbackDestination -Force

          $MotorZip=Join-Path $Dist ('DDM-SNOC-WINDOWS-MOTOR-' + $DDMProduct.ProductVersion + '.zip')
          $SeedZip=Join-Path $Dist ('DDM-SNOC-WINDOWS-AD-SEED-' + $DDMProduct.ProductVersion + '.zip')
          Compress-Archive -Path $Motor -DestinationPath $MotorZip -CompressionLevel Optimal
          Compress-Archive -Path (Join-Path $Seed '*') -DestinationPath $SeedZip -CompressionLevel Optimal

          $Assets=@()
          foreach($Zip in @($MotorZip,$SeedZip)){
            $Hash=(Get-FileHash $Zip -Algorithm SHA256).Hash
            Set-Content -LiteralPath ($Zip+'.sha256') -Value ($Hash+' *'+(Split-Path -Leaf $Zip)) -Encoding ASCII
            $Assets+=New-Object PSObject -Property @{Name=(Split-Path -Leaf $Zip);Sha256=$Hash;Size=(Get-Item $Zip).Length}
          }

          $Tag='ddm-snoc-windows-v'+$DDMProduct.ProductVersion
          $Manifest=New-Object PSObject -Property @{
            Product=$DDMProduct.ProductName
            ProductVersion=$DDMProduct.ProductVersion
            GitCommit=(git rev-parse HEAD)
            GitTag=$Tag
            GeneratedAtUtc=(Get-Date).ToUniversalTime().ToString('o')
            Assets=$Assets
            Validation=@('PowerShell parser','300-control repository audit','runtime HTTP mocks','glued-command AST scan','expanded motor validation')
            ExternalPilotsRequired=$true
          }
          $ManifestPath=Join-Path $Dist ('DDM-SNOC-WINDOWS-RELEASE-MANIFEST-'+$DDMProduct.ProductVersion+'.json')
          $Manifest | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $ManifestPath -Encoding UTF8
          $ManifestHash=(Get-FileHash $ManifestPath -Algorithm SHA256).Hash
          Set-Content -LiteralPath ($ManifestPath+'.sha256') -Value ($ManifestHash+' *'+(Split-Path -Leaf $ManifestPath)) -Encoding ASCII

      - name: Validate expanded motor asset
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          . (Join-Path $Product 'config\DDM-Product.ps1')
          $Zip=Join-Path $env:GITHUB_WORKSPACE ('dist\DDM-SNOC-WINDOWS-MOTOR-'+$DDMProduct.ProductVersion+'.zip')
          $Expanded=Join-Path $env:RUNNER_TEMP 'ddm-snoc-2.0.6-expanded'
          Remove-Item $Expanded -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $Zip -DestinationPath $Expanded -Force
          $ExpandedProduct=Join-Path $Expanded ('DDM-SNOC-WINDOWS-MOTOR-'+$DDMProduct.ProductVersion)
          & (Join-Path $ExpandedProduct 'tools\Test-DDM-Repository.ps1') -ProductRoot $ExpandedProduct
          & (Join-Path $ExpandedProduct 'tools\Test-DDM-RuntimeLexing.ps1') -ProductRoot $ExpandedProduct

      - name: Create tag and publish stable release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          . (Join-Path $Product 'config\DDM-Product.ps1')
          $Tag='ddm-snoc-windows-v'+$DDMProduct.ProductVersion
          $Sha=(git rev-parse HEAD).Trim()
          git tag -f $Tag $Sha
          git push origin ('refs/tags/'+$Tag) --force

          $Dist=Join-Path $env:GITHUB_WORKSPACE 'dist'
          $Files=@(
            (Join-Path $Dist ('DDM-SNOC-WINDOWS-MOTOR-'+$DDMProduct.ProductVersion+'.zip')),
            (Join-Path $Dist ('DDM-SNOC-WINDOWS-MOTOR-'+$DDMProduct.ProductVersion+'.zip.sha256')),
            (Join-Path $Dist ('DDM-SNOC-WINDOWS-AD-SEED-'+$DDMProduct.ProductVersion+'.zip')),
            (Join-Path $Dist ('DDM-SNOC-WINDOWS-AD-SEED-'+$DDMProduct.ProductVersion+'.zip.sha256')),
            (Join-Path $Dist ('DDM-SNOC-WINDOWS-RELEASE-MANIFEST-'+$DDMProduct.ProductVersion+'.json')),
            (Join-Path $Dist ('DDM-SNOC-WINDOWS-RELEASE-MANIFEST-'+$DDMProduct.ProductVersion+'.json.sha256'))
          )

          gh release view $Tag 2>$null
          if($LASTEXITCODE -eq 0){gh release delete $Tag --yes --cleanup-tag; git tag -f $Tag $Sha; git push origin ('refs/tags/'+$Tag) --force}
          gh release create $Tag @Files --verify-tag --generate-notes --title "DDM SNOC Windows $($DDMProduct.ProductVersion)"
