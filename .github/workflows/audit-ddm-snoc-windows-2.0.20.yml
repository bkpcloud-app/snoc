name: Audit DDM SNOC Windows 2.0.20

on:
  pull_request:
    paths:
      - 'windows/zabbix-agent-deployment/**'
      - '.github/workflows/audit-ddm-snoc-windows-2.0.20.yml'
      - '.github/workflows/ddm-snoc-windows-validation.yml'
      - '.github/workflows/ddm-snoc-windows-release.yml'
      - '.github/workflows/validate-ddm-snoc-migration-240.yml'

permissions:
  contents: write

concurrency:
  group: audit-ddm-snoc-windows-2.0.20-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  audit-2-0-20:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Materialize exact 2.0.20 source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Patch=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment\tools\Promote-DDM-SNOC-2.0.20.ps1'
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $Patch -RepositoryRoot $env:GITHUB_WORKSPACE
          if($LASTEXITCODE -ne 0){throw "Promotion patch returned $LASTEXITCODE"}

      - name: Verify identity, AGL catalog and parser
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          . (Join-Path $Product 'config\DDM-Product.ps1')
          if([string]$DDMProduct.ProductVersion -ne '2.0.20'){throw "Versao incorreta: $($DDMProduct.ProductVersion)"}
          $ClientPath=Join-Path $Product 'clients\AGL\CLIENTE.ps1'
          $CatalogPath=Join-Path $Product 'clients\catalog.json'
          $Catalog=Get-Content -LiteralPath $CatalogPath -Raw | ConvertFrom-Json
          $Entry=@($Catalog.clients|Where-Object{$_.id -eq 'AGL'})
          if($Entry.Count -ne 1){throw 'Catalogo AGL ausente ou duplicado.'}
          $ClientHash=(Get-FileHash -LiteralPath $ClientPath -Algorithm SHA256).Hash.ToUpperInvariant()
          if($ClientHash -ne ([string]$Entry[0].sha256).ToUpperInvariant()){throw "Hash AGL divergente. Catalogo=$($Entry[0].sha256) Atual=$ClientHash"}
          $ClientText=[IO.File]::ReadAllText($ClientPath)
          foreach($Expected in @("ConfigVersion        = '3.1.3'","ClientId             = 'AGL'","Status               = 'PILOT_READY'","ProductionReady      = `$false",'zabbix_agentd.d\adds.conf','zabbix_agentd.d\hyperv.conf','zabbix_agentd.d\totvs.conf','zabbix_agentd.d\veeam.conf','zabbix_agentd.d\zabbix.conf')){
            if($ClientText.IndexOf($Expected,[StringComparison]::Ordinal) -lt 0){throw "Contrato AGL ausente: $Expected"}
          }
          foreach($File in @(Get-ChildItem -LiteralPath $Product -Filter '*.ps1' -Recurse -Force)){
            $Tokens=$null;$Errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile($File.FullName,[ref]$Tokens,[ref]$Errors)
            if(@($Errors).Count -gt 0){throw (@($Errors|ForEach-Object{"$($File.FullName) L$($_.Extent.StartLineNumber): $($_.Message)"}) -join "`r`n")}
          }
          $Engine=Join-Path $Product 'engine\Install-DDM-Zabbix-Windows.ps1'
          $EngineHash=(Get-FileHash -LiteralPath $Engine -Algorithm SHA256).Hash.ToUpperInvariant()
          Write-Host "PRODUCT_VERSION=$($DDMProduct.ProductVersion)"
          Write-Host "AGL_SHA256=$ClientHash"
          Write-Host "ENGINE_SHA256=$EngineHash"
          "ENGINE_SHA256=$EngineHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Execute complete product validation on source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          foreach($Test in @(
            'Test-DDM-Repository.ps1',
            'Test-DDM-RuntimeLexing.ps1',
            'Test-DDM-CentralBootstrapLoad.ps1',
            'Test-DDM-AclValidation.ps1',
            'Test-DDM-UncCmd.ps1',
            'Test-DDM-ForceRefresh.ps1',
            'Test-DDM-CentralRecovery.ps1',
            'Test-DDM-BootstrapFirstInstall.ps1'
          )){
            Write-Host "RUN_SOURCE_TEST=$Test"
            & (Join-Path $Product ('tools\'+$Test)) -ProductRoot $Product
            if($LASTEXITCODE -ne 0){throw "$Test returned $LASTEXITCODE"}
          }

      - name: Execute 240 migration scenarios on source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $global:ProductCode='$ProductCode'
          $Script=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment\tools\Test-DDM-SNOC-Migration-240Scenarios.ps1'
          $Output=Join-Path $env:RUNNER_TEMP 'DDM-SNOC-MIGRATION-240-2.0.20-SOURCE'
          & $Script -RepositoryRoot $env:GITHUB_WORKSPACE -OutputDirectory $Output
          if($LASTEXITCODE -ne 0){throw "Source migration validation returned $LASTEXITCODE"}
          "SOURCE_SCENARIO_OUTPUT=$Output" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build complete MOTOR and AD-SEED
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          . (Join-Path $Product 'config\DDM-Product.ps1')
          $Dist=Join-Path $env:RUNNER_TEMP 'DDM-SNOC-2.0.20-DIST'
          $Motor=Join-Path $Dist ('DDM-SNOC-WINDOWS-MOTOR-'+$DDMProduct.ProductVersion)
          $Seed=Join-Path $Dist ('DDM-SNOC-WINDOWS-AD-SEED-'+$DDMProduct.ProductVersion)
          Remove-Item $Dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $Motor,$Seed -ItemType Directory -Force|Out-Null
          foreach($Name in @('Start-DDM-SNOC.ps1','CLIENTE.example.ps1','README.md','CHANGELOG.md')){Copy-Item (Join-Path $Product $Name) (Join-Path $Motor $Name) -Force}
          foreach($Name in @('config','lib','central','bootstrap','endpoint','engine','modules','templates','tools','docs','clients')){Copy-Item (Join-Path $Product $Name) (Join-Path $Motor $Name) -Recurse -Force}
          foreach($Name in @('ATUALIZAR-AD.cmd','VOLTAR-RELEASE.cmd','RECUPERAR-AD.cmd','ATUALIZAR-AD-AUTOMATICO.cmd')){Copy-Item (Join-Path $Product ('templates\central\'+$Name)) (Join-Path $Seed $Name) -Force}
          Copy-Item (Join-Path $Product 'templates\central\SINCRONIZAR-CLIENTE-MAIN.ps1') (Join-Path $Seed 'SINCRONIZAR-CLIENTE.ps1') -Force
          Copy-Item (Join-Path $Product 'CLIENTE.example.ps1') (Join-Path $Seed 'CLIENTE.example.ps1') -Force
          Copy-Item (Join-Path $Product 'docs\UPDATE-AD.md') (Join-Path $Seed 'LEIA-ME-UPDATE-AD.md') -Force
          Copy-Item (Join-Path $Product 'docs\AUDITORIA-300-PONTOS.md') (Join-Path $Seed 'AUDITORIA-300-PONTOS.md') -Force
          Copy-Item (Join-Path $Product 'tools\Recover-DDM-CentralUpdater.ps1') (Join-Path $Seed 'Recover-DDM-CentralUpdater.ps1') -Force
          $Updater=Join-Path $Seed 'CENTRAL-UPDATER'
          foreach($Rel in @('central\Update-DDM-SNOC-Central.ps1','central\lib\DDM-Central-Client.ps1','central\lib\DDM-Central-Supply.ps1','central\lib\Invoke-DDM-Central-Publish.ps1','config\DDM-Product.ps1','lib\DDM-Common.ps1')){
            $Source=Join-Path $Product $Rel;$Destination=Join-Path $Updater $Rel
            New-Item (Split-Path -Parent $Destination) -ItemType Directory -Force|Out-Null
            Copy-Item $Source $Destination -Force
          }
          $CentralTools=Join-Path $Seed 'CENTRAL-TOOLS\tools'
          New-Item $CentralTools -ItemType Directory -Force|Out-Null
          Copy-Item (Join-Path $Product 'tools\Set-DDM-CentralRelease.ps1') $CentralTools -Force
          Copy-Item (Join-Path $Product 'tools\Recover-DDM-CentralUpdater.ps1') $CentralTools -Force
          $Required=@('ATUALIZAR-AD.cmd','VOLTAR-RELEASE.cmd','RECUPERAR-AD.cmd','ATUALIZAR-AD-AUTOMATICO.cmd','SINCRONIZAR-CLIENTE.ps1','Recover-DDM-CentralUpdater.ps1','CENTRAL-UPDATER\central\Update-DDM-SNOC-Central.ps1','CENTRAL-UPDATER\central\lib\DDM-Central-Client.ps1','CENTRAL-UPDATER\central\lib\DDM-Central-Supply.ps1','CENTRAL-UPDATER\central\lib\Invoke-DDM-Central-Publish.ps1','CENTRAL-UPDATER\config\DDM-Product.ps1','CENTRAL-UPDATER\lib\DDM-Common.ps1','CENTRAL-TOOLS\tools\Set-DDM-CentralRelease.ps1','CENTRAL-TOOLS\tools\Recover-DDM-CentralUpdater.ps1')
          foreach($Item in $Required){if(-not(Test-Path (Join-Path $Seed $Item) -PathType Leaf)){throw "AD-SEED incompleto: $Item"}}
          foreach($Root in @($Motor,$Seed)){if(Get-ChildItem $Root -Recurse -Force|Where-Object{$_.FullName -match '\\base-package\\|\\\.parts\\|New-BKPCloud-Zabbix-Client'}){throw "Conteudo legado no asset: $Root"}}
          $MotorZip=Join-Path $Dist ('DDM-SNOC-WINDOWS-MOTOR-'+$DDMProduct.ProductVersion+'.zip')
          $SeedZip=Join-Path $Dist ('DDM-SNOC-WINDOWS-AD-SEED-'+$DDMProduct.ProductVersion+'.zip')
          Compress-Archive -Path $Motor -DestinationPath $MotorZip -CompressionLevel Optimal
          Compress-Archive -Path (Join-Path $Seed '*') -DestinationPath $SeedZip -CompressionLevel Optimal
          foreach($Zip in @($MotorZip,$SeedZip)){
            $Hash=(Get-FileHash $Zip -Algorithm SHA256).Hash.ToUpperInvariant()
            Set-Content -LiteralPath ($Zip+'.sha256') -Value ($Hash+' *'+(Split-Path -Leaf $Zip)) -Encoding ASCII
            Write-Host "ASSET=$(Split-Path -Leaf $Zip) SHA256=$Hash SIZE=$((Get-Item $Zip).Length)"
          }
          "DIST_PATH=$Dist" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate final MOTOR with complete suite and 240 scenarios
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Dist=$env:DIST_PATH
          $Zip=Join-Path $Dist 'DDM-SNOC-WINDOWS-MOTOR-2.0.20.zip'
          $Expanded=Join-Path $env:RUNNER_TEMP 'DDM-SNOC-2.0.20-FINAL-EXPANDED'
          $FinalRepo=Join-Path $env:RUNNER_TEMP 'DDM-SNOC-2.0.20-FINAL-REPO'
          Remove-Item $Expanded,$FinalRepo -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $Zip -DestinationPath $Expanded -Force
          $ExpandedProduct=Join-Path $Expanded 'DDM-SNOC-WINDOWS-MOTOR-2.0.20'
          $FinalProduct=Join-Path $FinalRepo 'windows\zabbix-agent-deployment'
          New-Item (Split-Path -Parent $FinalProduct) -ItemType Directory -Force|Out-Null
          Copy-Item -LiteralPath $ExpandedProduct -Destination $FinalProduct -Recurse -Force
          $WorkflowRoot=Join-Path $FinalRepo '.github\workflows'
          New-Item $WorkflowRoot -ItemType Directory -Force|Out-Null
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE '.github\workflows\ddm-snoc-windows-validation.yml') $WorkflowRoot -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE '.github\workflows\ddm-snoc-windows-release.yml') $WorkflowRoot -Force
          foreach($Test in @('Test-DDM-Repository.ps1','Test-DDM-RuntimeLexing.ps1','Test-DDM-CentralBootstrapLoad.ps1','Test-DDM-AclValidation.ps1','Test-DDM-UncCmd.ps1','Test-DDM-ForceRefresh.ps1','Test-DDM-CentralRecovery.ps1','Test-DDM-BootstrapFirstInstall.ps1')){
            Write-Host "RUN_FINAL_TEST=$Test"
            & (Join-Path $FinalProduct ('tools\'+$Test)) -ProductRoot $FinalProduct
            if($LASTEXITCODE -ne 0){throw "Final $Test returned $LASTEXITCODE"}
          }
          $global:ProductCode='$ProductCode'
          $Output=Join-Path $env:RUNNER_TEMP 'DDM-SNOC-MIGRATION-240-2.0.20-FINAL'
          & (Join-Path $FinalProduct 'tools\Test-DDM-SNOC-Migration-240Scenarios.ps1') -RepositoryRoot $FinalRepo -OutputDirectory $Output
          if($LASTEXITCODE -ne 0){throw "Final MOTOR migration validation returned $LASTEXITCODE"}
          "FINAL_SCENARIO_OUTPUT=$Output" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $FinalEngine=(Get-FileHash (Join-Path $FinalProduct 'engine\Install-DDM-Zabbix-Windows.ps1') -Algorithm SHA256).Hash.ToUpperInvariant()
          if($FinalEngine -ne $env:ENGINE_SHA256){throw "Engine mudou no ZIP. Fonte=$env:ENGINE_SHA256 Final=$FinalEngine"}
          Write-Host "FINAL_ENGINE_SHA256=$FinalEngine"

      - name: Upload immutable audit evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: DDM-SNOC-WINDOWS-2.0.20-AUDIT-EVIDENCE
          path: |
            ${{ env.SOURCE_SCENARIO_OUTPUT }}
            ${{ env.FINAL_SCENARIO_OUTPUT }}
            ${{ env.DIST_PATH }}
            windows/zabbix-agent-deployment/engine/Install-DDM-Zabbix-Windows.ps1
            windows/zabbix-agent-deployment/config/DDM-Product.ps1
            windows/zabbix-agent-deployment/clients/AGL/CLIENTE.ps1
            windows/zabbix-agent-deployment/clients/catalog.json
            windows/zabbix-agent-deployment/tools/Test-DDM-Repository.ps1
            windows/zabbix-agent-deployment/tools/Test-DDM-CentralRecovery.ps1
            windows/zabbix-agent-deployment/tools/Test-DDM-SNOC-Migration-240Scenarios.ps1
            windows/zabbix-agent-deployment/docs/RELEASE-2.0.20.md
          if-no-files-found: error
          retention-days: 30

      - name: Commit exact audited source
        if: success() && github.head_ref == 'release/ddm-snoc-windows-2.0.20-audited'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'windows/zabbix-agent-deployment/config/DDM-Product.ps1'
          git add -- 'windows/zabbix-agent-deployment/tools/Test-DDM-Repository.ps1'
          git add -- 'windows/zabbix-agent-deployment/central/lib/Invoke-DDM-Central-Publish.ps1'
          git add -- 'windows/zabbix-agent-deployment/CHANGELOG.md'
          git add -- 'windows/zabbix-agent-deployment/docs/RELEASE-2.0.20.md'
          git add -- '.github/workflows/ddm-snoc-windows-validation.yml'
          git add -- '.github/workflows/ddm-snoc-windows-release.yml'
          if(-not(git diff --cached --quiet)){
            git commit -m 'release(windows): materialize audited 2.0.20 source'
            git push origin HEAD:${{ github.head_ref }}
          }
