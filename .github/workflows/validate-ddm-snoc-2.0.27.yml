name: Validate DDM SNOC Windows 2.0.27

on:
  pull_request:
    paths:
      - 'windows/zabbix-agent-deployment/**'
      - '.github/workflows/validate-ddm-snoc-2.0.27.yml'

permissions:
  contents: write

jobs:
  validate-2027:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Materialize exact 2.0.27 source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          $Patch=Join-Path $Product 'tools\Promote-DDM-SNOC-2.0.27.ps1'
          if(Test-Path -LiteralPath $Patch){
            & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $Patch -RepositoryRoot $env:GITHUB_WORKSPACE
            if($LASTEXITCODE -ne 0){throw "Promotion patch returned $LASTEXITCODE"}
          }
          . (Join-Path $Product 'config\DDM-Product.ps1')
          if([string]$DDMProduct.ProductVersion -ne '2.0.27'){throw "Expected ProductVersion 2.0.27; current=$($DDMProduct.ProductVersion)"}

      - name: Parse all PowerShell sources
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          foreach($File in @(Get-ChildItem $Product -Filter '*.ps1' -Recurse)){
            $Tokens=$null;$Errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile($File.FullName,[ref]$Tokens,[ref]$Errors)
            if(@($Errors).Count -gt 0){throw (@($Errors|ForEach-Object{"$($File.FullName) L$($_.Extent.StartLineNumber): $($_.Message)"})-join "`r`n")}
          }

      - name: Execute exact SRV-AE BOM regression
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $Product 'tools\Test-DDM-LegacyBom.ps1') -ProductRoot $Product
          if($LASTEXITCODE -ne 0){throw "Legacy BOM regression returned $LASTEXITCODE"}

      - name: Execute all 240 migration scenarios
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $global:ProductCode='$ProductCode'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          $Output=Join-Path $env:RUNNER_TEMP 'DDM-SNOC-MIGRATION-240-2.0.27'
          & (Join-Path $Product 'tools\Test-DDM-SNOC-Migration-240Scenarios.ps1') -RepositoryRoot $env:GITHUB_WORKSPACE -OutputDirectory $Output
          if(-not $?){throw '240 scenarios failed.'}

      - name: Execute complete product validation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          foreach($Test in @(
            'Test-DDM-Repository.ps1',
            'Test-DDM-RuntimeLexing.ps1',
            'Test-DDM-CentralBootstrapLoad.ps1',
            'Test-DDM-AclValidation.ps1',
            'Test-DDM-UncCmd.ps1',
            'Test-DDM-ForceRefresh.ps1',
            'Test-DDM-CentralRecovery.ps1',
            'Test-DDM-BootstrapFirstInstall.ps1'
          )){
            Write-Host "RUN=$Test"
            & (Join-Path $Product ('tools\'+$Test)) -ProductRoot $Product
            if(-not $?){throw "$Test failed."}
          }

      - name: Commit exact validated source to PR branch
        if: github.event_name == 'pull_request'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add windows/zabbix-agent-deployment/engine/Install-DDM-Zabbix-Windows.ps1
          git add windows/zabbix-agent-deployment/config/DDM-Product.ps1
          git add windows/zabbix-agent-deployment/tools/Test-DDM-Repository.ps1
          git add windows/zabbix-agent-deployment/tools/Test-DDM-LegacyBom.ps1
          git add windows/zabbix-agent-deployment/CHANGELOG.md
          if(-not (git diff --cached --quiet)){
            git commit -m 'fix(windows): release 2.0.27 legacy BOM parser'
            git push origin HEAD:${{ github.head_ref }}
          }
