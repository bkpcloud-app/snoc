name: Publish validated DDM SNOC Windows 2.0.8

on:
  push:
    paths:
      - '.github/workflows/_tmp-ddm-snoc-publish-2.0.8.yml'

permissions:
  contents: write

concurrency:
  group: ddm-snoc-windows-publish-2.0.8
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      SOURCE_COMMIT: 5d6ebad482b933a76bf2ccfcefffcdea43e1bb4a
      RELEASE_TAG: ddm-snoc-windows-v2.0.8

    steps:
      - name: Checkout validated source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5d6ebad482b933a76bf2ccfcefffcdea43e1bb4a
          fetch-depth: 0

      - name: Revalidate and build assets
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Repo=$env:GITHUB_WORKSPACE
          $Product=Join-Path $Repo 'windows\zabbix-agent-deployment'
          . (Join-Path $Product 'config\DDM-Product.ps1')
          if($DDMProduct.ProductVersion -ne '2.0.8'){throw "Versao interna inesperada: $($DDMProduct.ProductVersion)"}

          & (Join-Path $Product 'tools\Test-DDM-AclValidation.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-Repository.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-RuntimeLexing.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-CentralBootstrapLoad.ps1') -ProductRoot $Product

          $Dist=Join-Path $Repo 'dist'
          $Motor=Join-Path $Dist 'DDM-SNOC-WINDOWS-MOTOR-2.0.8'
          $Seed=Join-Path $Dist 'DDM-SNOC-WINDOWS-AD-SEED-2.0.8'
          Remove-Item $Dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $Motor,$Seed -ItemType Directory -Force|Out-Null

          foreach($Name in @('Start-DDM-SNOC.ps1','CLIENTE.example.ps1','README.md','CHANGELOG.md')){
              Copy-Item (Join-Path $Product $Name) (Join-Path $Motor $Name) -Force
          }
          foreach($Name in @('config','lib','central','bootstrap','endpoint','engine','modules','templates','tools','docs','clients')){
              Copy-Item (Join-Path $Product $Name) (Join-Path $Motor $Name) -Recurse -Force
          }
          foreach($Name in @('ATUALIZAR-AD.cmd','VOLTAR-RELEASE.cmd')){
              Copy-Item (Join-Path $Product ('templates\central\'+$Name)) (Join-Path $Seed $Name) -Force
          }
          Copy-Item (Join-Path $Product 'CLIENTE.example.ps1') (Join-Path $Seed 'CLIENTE.example.ps1') -Force
          Copy-Item (Join-Path $Product 'docs\UPDATE-AD.md') (Join-Path $Seed 'LEIA-ME-UPDATE-AD.md') -Force
          Copy-Item (Join-Path $Product 'docs\AUDITORIA-300-PONTOS.md') (Join-Path $Seed 'AUDITORIA-300-PONTOS.md') -Force
          Copy-Item (Join-Path $Product 'docs\AUDITORIA-MIZU-ACL-40-PONTOS.md') (Join-Path $Seed 'AUDITORIA-MIZU-ACL-40-PONTOS.md') -Force

          $Updater=Join-Path $Seed 'CENTRAL-UPDATER'
          foreach($Rel in @(
              'central\Update-DDM-SNOC-Central.ps1',
              'central\lib\DDM-Central-Client.ps1',
              'central\lib\DDM-Central-Supply.ps1',
              'central\lib\Invoke-DDM-Central-Publish.ps1',
              'config\DDM-Product.ps1',
              'lib\DDM-Common.ps1'
          )){
              $Source=Join-Path $Product $Rel
              $Destination=Join-Path $Updater $Rel
              New-Item (Split-Path -Parent $Destination) -ItemType Directory -Force|Out-Null
              Copy-Item $Source $Destination -Force
          }
          $Rollback=Join-Path $Seed 'CENTRAL-TOOLS\tools\Set-DDM-CentralRelease.ps1'
          New-Item (Split-Path -Parent $Rollback) -ItemType Directory -Force|Out-Null
          Copy-Item (Join-Path $Product 'tools\Set-DDM-CentralRelease.ps1') $Rollback -Force

          & (Join-Path $Product 'tools\Test-DDM-AclValidation.ps1') -ProductRoot $Updater

          $MotorZip=Join-Path $Dist 'DDM-SNOC-WINDOWS-MOTOR-2.0.8.zip'
          $SeedZip=Join-Path $Dist 'DDM-SNOC-WINDOWS-AD-SEED-2.0.8.zip'
          Compress-Archive -Path $Motor -DestinationPath $MotorZip -CompressionLevel Optimal
          Compress-Archive -Path (Join-Path $Seed '*') -DestinationPath $SeedZip -CompressionLevel Optimal

          $Assets=@()
          foreach($Zip in @($MotorZip,$SeedZip)){
              $Hash=(Get-FileHash -LiteralPath $Zip -Algorithm SHA256).Hash
              Set-Content -LiteralPath ($Zip+'.sha256') -Value ($Hash+' *'+(Split-Path -Leaf $Zip)) -Encoding ASCII
              $Assets+=New-Object PSObject -Property @{Name=(Split-Path -Leaf $Zip);Sha256=$Hash;Size=(Get-Item $Zip).Length}
          }
          $ManifestPath=Join-Path $Dist 'DDM-SNOC-WINDOWS-RELEASE-MANIFEST-2.0.8.json'
          $Manifest=New-Object PSObject -Property @{
              Product='DDM SNOC Windows'
              ProductVersion='2.0.8'
              GitCommit=$env:SOURCE_COMMIT
              GitTag=$env:RELEASE_TAG
              GeneratedAtUtc=(Get-Date).ToUniversalTime().ToString('o')
              Assets=$Assets
              AuditPoints=40
              Validation=@('repository','runtime','bootstrap','acl-source','acl-seed')
              ExternalPilotsRequired=$true
          }
          $Manifest|ConvertTo-Json -Depth 6|Set-Content -LiteralPath $ManifestPath -Encoding UTF8
          $ManifestHash=(Get-FileHash -LiteralPath $ManifestPath -Algorithm SHA256).Hash
          Set-Content -LiteralPath ($ManifestPath+'.sha256') -Value ($ManifestHash+' *'+(Split-Path -Leaf $ManifestPath)) -Encoding ASCII

      - name: Tag, publish and verify
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          if(-not [string]::IsNullOrWhiteSpace([string](git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"))){throw "Tag ja existe: $env:RELEASE_TAG"}
          git tag -a $env:RELEASE_TAG $env:SOURCE_COMMIT -m 'DDM SNOC Windows 2.0.8'
          git push origin $env:RELEASE_TAG

          $D=Join-Path $env:GITHUB_WORKSPACE 'dist'
          $M=Join-Path $D 'DDM-SNOC-WINDOWS-MOTOR-2.0.8.zip'
          $S=Join-Path $D 'DDM-SNOC-WINDOWS-AD-SEED-2.0.8.zip'
          $J=Join-Path $D 'DDM-SNOC-WINDOWS-RELEASE-MANIFEST-2.0.8.json'
          & gh release create $env:RELEASE_TAG $M ($M+'.sha256') $S ($S+'.sha256') $J ($J+'.sha256') --verify-tag --target $env:SOURCE_COMMIT --title 'DDM SNOC Windows 2.0.8' --notes 'Corrige falso positivo ACL Synchronize; auditoria Mizu em 40 pontos.'
          if($LASTEXITCODE -ne 0){throw "gh release create retornou $LASTEXITCODE"}

          $R=(& gh release view $env:RELEASE_TAG --json tagName,isDraft,isPrerelease,targetCommitish,assets)|ConvertFrom-Json
          if($R.tagName -ne $env:RELEASE_TAG){throw 'Tag da release divergente.'}
          if($R.isDraft -or $R.isPrerelease){throw 'Release nao ficou estavel.'}
          if(@($R.assets).Count -ne 6){throw "Quantidade de assets divergente: $(@($R.assets).Count)"}
          $Names=@($R.assets|ForEach-Object{[string]$_.name})
          foreach($Required in @(
              'DDM-SNOC-WINDOWS-MOTOR-2.0.8.zip',
              'DDM-SNOC-WINDOWS-MOTOR-2.0.8.zip.sha256',
              'DDM-SNOC-WINDOWS-AD-SEED-2.0.8.zip',
              'DDM-SNOC-WINDOWS-AD-SEED-2.0.8.zip.sha256',
              'DDM-SNOC-WINDOWS-RELEASE-MANIFEST-2.0.8.json',
              'DDM-SNOC-WINDOWS-RELEASE-MANIFEST-2.0.8.json.sha256'
          )){if($Names -notcontains $Required){throw "Asset ausente: $Required"}}

      - name: Record READY and remove temporary workflow
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git fetch origin main
          git checkout -B status origin/main
          Remove-Item '.github\workflows\_tmp-ddm-snoc-publish-2.0.8.yml' -Force -ErrorAction SilentlyContinue
          Remove-Item 'release-status\ddm-snoc-windows-v2.0.8-v6-attempt.txt' -Force -ErrorAction SilentlyContinue
          $Status='release-status\ddm-snoc-windows-v2.0.8.txt'
          Set-Content -LiteralPath $Status -Value ('State=READY Tag='+$env:RELEASE_TAG+' Commit='+$env:SOURCE_COMMIT+' Assets=6 AuditPoints=40 VerifiedAtUtc='+(Get-Date).ToUniversalTime().ToString('o')) -Encoding UTF8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(snoc-windows): registra release 2.0.8 READY'
          git push origin HEAD:main

      - name: Record FAILED
        if: failure()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Continue'
          & gh release delete $env:RELEASE_TAG --yes 2>$null
          git push --delete origin $env:RELEASE_TAG 2>$null
          git fetch origin main
          git checkout -B failure origin/main
          $Status='release-status\ddm-snoc-windows-v2.0.8-publish-attempt.txt'
          Set-Content -LiteralPath $Status -Value ('State=FAILED RunId=${{ github.run_id }} SourceCommit='+$env:SOURCE_COMMIT+' FailedAtUtc='+(Get-Date).ToUniversalTime().ToString('o')) -Encoding UTF8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $Status
          git commit -m 'chore(snoc-windows): registra falha de publicacao 2.0.8'
          git push origin HEAD:main
