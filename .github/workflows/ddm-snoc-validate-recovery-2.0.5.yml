name: Validate DDM SNOC Central Recovery 2.0.5

on:
  push:
    paths:
      - '.github/workflows/ddm-snoc-validate-recovery-2.0.5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Validate recovery and record result
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $State = 'FAILED'
          $Message = ''
          $Product = Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          $Recovery = Join-Path $Product 'tools\Recover-DDM-SNOC-Central.ps1'

          try {
              $Tokens = $null
              $Errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $Recovery,
                  [ref]$Tokens,
                  [ref]$Errors
              )
              if (@($Errors).Count -gt 0) {
                  throw ($Errors | ForEach-Object {
                      'line=' + $_.Extent.StartLineNumber +
                      ' column=' + $_.Extent.StartColumnNumber +
                      ' text=' + $_.Extent.Text +
                      ' message=' + $_.Message
                  } | Out-String)
              }

              & (Join-Path $Product 'tools\Test-DDM-Repository.ps1') -ProductRoot $Product

              $Raw = [System.IO.File]::ReadAllText($Recovery)
              foreach ($Required in @(
                  'Assert-OriginalBackup',
                  'MANIFESTO-SHA256.csv',
                  'DDM-SNOC-WINDOWS-AD-SEED',
                  'return120',
                  'RedirectStandardOutput',
                  'RedirectStandardError',
                  'Restore-OriginalCentral',
                  'Register-ScheduledTask',
                  'CURRENT.txt'
              )) {
                  if (-not $Raw.Contains($Required)) {
                      throw "Invariante ausente no recovery: $Required"
                  }
              }

              $State = 'READY'
              $Message = 'Parser, validacao de repositorio e invariantes da recuperacao aprovados.'
          }
          catch {
              $Message = $_.Exception.Message.Replace("`r", ' ').Replace("`n", ' ')
          }

          $StatusRoot = Join-Path $env:GITHUB_WORKSPACE 'release-status'
          New-Item -Path $StatusRoot -ItemType Directory -Force | Out-Null
          $StatusPath = Join-Path $StatusRoot 'recovery-script-2.0.5.txt'
          @(
              'State=' + $State,
              'Message=' + $Message,
              'Commit=' + $env:GITHUB_SHA,
              'VerifiedAtUtc=' + (Get-Date).ToUniversalTime().ToString('o')
          ) | Set-Content -LiteralPath $StatusPath -Encoding ASCII

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $StatusPath
          git commit -m ('chore(snoc-windows): recovery 2.0.5 ' + $State)
          git pull --rebase origin main
          git push origin HEAD:main
