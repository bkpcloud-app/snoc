name: Repair Publish DDM SNOC Windows 2.0.25 Assets

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/repair-publish-ddm-snoc-windows-2.0.25-assets.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact official tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ddm-snoc-windows-v2.0.25
          fetch-depth: 0

      - name: Validate exact tagged source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          . (Join-Path $Product 'config\DDM-Product.ps1')
          if([string]$DDMProduct.ProductVersion -ne '2.0.25'){throw "Expected 2.0.25, got $($DDMProduct.ProductVersion)"}
          $TagCommit=(git rev-parse HEAD).Trim()
          $global:ProductCode='$ProductCode'
          $SourceOut=Join-Path $env:RUNNER_TEMP 'DDM-SNOC-MIGRATION-240-2.0.25-REPAIR-SOURCE'
          & (Join-Path $Product 'tools\Test-DDM-SNOC-Migration-240Scenarios.ps1') -RepositoryRoot $env:GITHUB_WORKSPACE -OutputDirectory $SourceOut
          if(-not $?){throw '240 source scenarios failed.'}
          foreach($Test in @(
            'Test-DDM-Repository.ps1',
            'Test-DDM-RuntimeLexing.ps1',
            'Test-DDM-CentralBootstrapLoad.ps1',
            'Test-DDM-AclValidation.ps1',
            'Test-DDM-UncCmd.ps1',
            'Test-DDM-ForceRefresh.ps1',
            'Test-DDM-CentralRecovery.ps1',
            'Test-DDM-CentralPathIdentity.ps1',
            'Test-DDM-BootstrapFirstInstall.ps1'
          )){
            & (Join-Path $Product ('tools\'+$Test)) -ProductRoot $Product
            if(-not $?){throw "$Test failed on tagged source."}
          }
          $EngineHash=(Get-FileHash (Join-Path $Product 'engine\Install-DDM-Zabbix-Windows.ps1') -Algorithm SHA256).Hash.ToUpperInvariant()
          "TAG_COMMIT=$TagCommit" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ENGINE_SHA256=$EngineHash" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "TAG_COMMIT=$TagCommit"
          Write-Host "ENGINE_SHA256=$EngineHash"

      - name: Build official MOTOR and AD-SEED
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          . (Join-Path $Product 'config\DDM-Product.ps1')
          $Dist=Join-Path $env:GITHUB_WORKSPACE 'dist-repair-2.0.25'
          $Motor=Join-Path $Dist ('DDM-SNOC-WINDOWS-MOTOR-'+$DDMProduct.ProductVersion)
          $Seed=Join-Path $Dist ('DDM-SNOC-WINDOWS-AD-SEED-'+$DDMProduct.ProductVersion)
          Remove-Item $Dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $Motor,$Seed -ItemType Directory -Force | Out-Null

          foreach($Name in @('Start-DDM-SNOC.ps1','CLIENTE.example.ps1','README.md','CHANGELOG.md')){
            Copy-Item (Join-Path $Product $Name) (Join-Path $Motor $Name) -Force
          }
          foreach($Name in @('config','lib','central','bootstrap','endpoint','engine','modules','templates','tools','docs','clients')){
            Copy-Item (Join-Path $Product $Name) (Join-Path $Motor $Name) -Recurse -Force
          }

          foreach($Name in @('ATUALIZAR-AD.cmd','VOLTAR-RELEASE.cmd','RECUPERAR-AD.cmd','ATUALIZAR-AD-AUTOMATICO.cmd')){
            Copy-Item (Join-Path $Product ('templates\central\'+$Name)) (Join-Path $Seed $Name) -Force
          }
          Copy-Item (Join-Path $Product 'templates\central\SINCRONIZAR-CLIENTE-MAIN.ps1') (Join-Path $Seed 'SINCRONIZAR-CLIENTE.ps1') -Force
          Copy-Item (Join-Path $Product 'CLIENTE.example.ps1') (Join-Path $Seed 'CLIENTE.example.ps1') -Force
          Copy-Item (Join-Path $Product 'docs\UPDATE-AD.md') (Join-Path $Seed 'LEIA-ME-UPDATE-AD.md') -Force
          Copy-Item (Join-Path $Product 'docs\AUDITORIA-300-PONTOS.md') (Join-Path $Seed 'AUDITORIA-300-PONTOS.md') -Force
          Copy-Item (Join-Path $Product 'tools\Recover-DDM-CentralUpdater.ps1') (Join-Path $Seed 'Recover-DDM-CentralUpdater.ps1') -Force

          $Updater=Join-Path $Seed 'CENTRAL-UPDATER'
          foreach($Rel in @(
            'central\Update-DDM-SNOC-Central.ps1',
            'central\lib\DDM-Central-Client.ps1',
            'central\lib\DDM-Central-Supply.ps1',
            'central\lib\Invoke-DDM-Central-Publish.ps1',
            'config\DDM-Product.ps1',
            'lib\DDM-Common.ps1'
          )){
            $Source=Join-Path $Product $Rel
            $Destination=Join-Path $Updater $Rel
            New-Item (Split-Path -Parent $Destination) -ItemType Directory -Force | Out-Null
            Copy-Item $Source $Destination -Force
          }

          $CentralTools=Join-Path $Seed 'CENTRAL-TOOLS'
          foreach($Rel in @('tools\Set-DDM-CentralRelease.ps1','tools\Recover-DDM-CentralUpdater.ps1')){
            $Destination=Join-Path $CentralTools $Rel
            New-Item (Split-Path -Parent $Destination) -ItemType Directory -Force | Out-Null
            Copy-Item (Join-Path $Product $Rel) $Destination -Force
          }

          foreach($Required in @(
            'ATUALIZAR-AD.cmd','VOLTAR-RELEASE.cmd','RECUPERAR-AD.cmd','ATUALIZAR-AD-AUTOMATICO.cmd',
            'SINCRONIZAR-CLIENTE.ps1','Recover-DDM-CentralUpdater.ps1','AUDITORIA-300-PONTOS.md',
            'CENTRAL-UPDATER\central\Update-DDM-SNOC-Central.ps1',
            'CENTRAL-TOOLS\tools\Set-DDM-CentralRelease.ps1',
            'CENTRAL-TOOLS\tools\Recover-DDM-CentralUpdater.ps1'
          )){
            if(-not(Test-Path (Join-Path $Seed $Required) -PathType Leaf)){throw "AD-SEED incomplete: $Required"}
          }

          foreach($Root in @($Motor,$Seed)){
            if(Get-ChildItem $Root -Recurse -Force | Where-Object {$_.FullName -match '\\base-package\\|\\\.parts\\|New-BKPCloud-Zabbix-Client'}){throw "Legacy content in asset: $Root"}
          }

          $MotorZip=Join-Path $Dist ('DDM-SNOC-WINDOWS-MOTOR-'+$DDMProduct.ProductVersion+'.zip')
          $SeedZip=Join-Path $Dist ('DDM-SNOC-WINDOWS-AD-SEED-'+$DDMProduct.ProductVersion+'.zip')
          Compress-Archive -Path $Motor -DestinationPath $MotorZip -CompressionLevel Optimal
          Compress-Archive -Path (Join-Path $Seed '*') -DestinationPath $SeedZip -CompressionLevel Optimal

          $Assets=@()
          foreach($Zip in @($MotorZip,$SeedZip)){
            $Hash=(Get-FileHash $Zip -Algorithm SHA256).Hash.ToUpperInvariant()
            Set-Content -LiteralPath ($Zip+'.sha256') -Value ($Hash+' *'+(Split-Path -Leaf $Zip)) -Encoding ASCII
            $Assets+=New-Object PSObject -Property @{Name=(Split-Path -Leaf $Zip);Sha256=$Hash;Size=(Get-Item $Zip).Length}
            Write-Host "ASSET=$(Split-Path -Leaf $Zip) SHA256=$Hash"
          }

          $Manifest=New-Object PSObject -Property @{
            Product=$DDMProduct.ProductName
            ProductVersion=$DDMProduct.ProductVersion
            GitCommit=$env:TAG_COMMIT
            GitTag='ddm-snoc-windows-v2.0.25'
            GeneratedAtUtc=(Get-Date).ToUniversalTime().ToString('o')
            EngineSha256=$env:ENGINE_SHA256
            MigrationScenarios='240/240 source and final MOTOR'
            Assets=$Assets
            ExternalPilotsRequired=$true
          }
          $ManifestPath=Join-Path $Dist ('DDM-SNOC-WINDOWS-RELEASE-MANIFEST-'+$DDMProduct.ProductVersion+'.json')
          $Manifest | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $ManifestPath -Encoding UTF8
          $ManifestHash=(Get-FileHash $ManifestPath -Algorithm SHA256).Hash.ToUpperInvariant()
          Set-Content -LiteralPath ($ManifestPath+'.sha256') -Value ($ManifestHash+' *'+(Split-Path -Leaf $ManifestPath)) -Encoding ASCII
          "DIST_PATH=$Dist" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Expand and validate final MOTOR again
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          . (Join-Path $Product 'config\DDM-Product.ps1')
          $Zip=Join-Path $env:DIST_PATH ('DDM-SNOC-WINDOWS-MOTOR-'+$DDMProduct.ProductVersion+'.zip')
          $Expanded=Join-Path $env:RUNNER_TEMP 'ddm-2.0.25-repair-expanded'
          $FinalRepo=Join-Path $env:RUNNER_TEMP 'ddm-2.0.25-repair-final-repo'
          Remove-Item $Expanded,$FinalRepo -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $Zip -DestinationPath $Expanded -Force
          $ExpandedProduct=Join-Path $Expanded ('DDM-SNOC-WINDOWS-MOTOR-'+$DDMProduct.ProductVersion)
          $FinalProduct=Join-Path $FinalRepo 'windows\zabbix-agent-deployment'
          New-Item (Split-Path -Parent $FinalProduct) -ItemType Directory -Force | Out-Null
          Copy-Item -LiteralPath $ExpandedProduct -Destination $FinalProduct -Recurse -Force
          $WorkflowRoot=Join-Path $FinalRepo '.github\workflows'
          New-Item $WorkflowRoot -ItemType Directory -Force | Out-Null
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE '.github\workflows\ddm-snoc-windows-validation.yml') $WorkflowRoot -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE '.github\workflows\ddm-snoc-windows-release.yml') $WorkflowRoot -Force

          foreach($Test in @(
            'Test-DDM-Repository.ps1','Test-DDM-RuntimeLexing.ps1','Test-DDM-CentralBootstrapLoad.ps1',
            'Test-DDM-AclValidation.ps1','Test-DDM-UncCmd.ps1','Test-DDM-ForceRefresh.ps1',
            'Test-DDM-CentralRecovery.ps1','Test-DDM-CentralPathIdentity.ps1','Test-DDM-BootstrapFirstInstall.ps1'
          )){
            & (Join-Path $FinalProduct ('tools\'+$Test)) -ProductRoot $FinalProduct
            if(-not $?){throw "$Test failed on final MOTOR."}
          }
          $global:ProductCode='$ProductCode'
          $FinalOut=Join-Path $env:RUNNER_TEMP 'DDM-SNOC-MIGRATION-240-2.0.25-REPAIR-FINAL'
          & (Join-Path $FinalProduct 'tools\Test-DDM-SNOC-Migration-240Scenarios.ps1') -RepositoryRoot $FinalRepo -OutputDirectory $FinalOut
          if(-not $?){throw '240 final MOTOR scenarios failed.'}
          $FinalHash=(Get-FileHash (Join-Path $FinalProduct 'engine\Install-DDM-Zabbix-Windows.ps1') -Algorithm SHA256).Hash.ToUpperInvariant()
          if($FinalHash -ne $env:ENGINE_SHA256){throw "Engine hash changed in final MOTOR. Source=$env:ENGINE_SHA256 Final=$FinalHash"}
          Write-Host "FINAL_MOTOR_VALIDATION=PASS"
          Write-Host "FINAL_ENGINE_SHA256=$FinalHash"

      - name: Publish and verify official GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $Tag='ddm-snoc-windows-v2.0.25'
          $Dist=$env:DIST_PATH
          $Files=@(
            (Join-Path $Dist 'DDM-SNOC-WINDOWS-MOTOR-2.0.25.zip'),
            (Join-Path $Dist 'DDM-SNOC-WINDOWS-MOTOR-2.0.25.zip.sha256'),
            (Join-Path $Dist 'DDM-SNOC-WINDOWS-AD-SEED-2.0.25.zip'),
            (Join-Path $Dist 'DDM-SNOC-WINDOWS-AD-SEED-2.0.25.zip.sha256'),
            (Join-Path $Dist 'DDM-SNOC-WINDOWS-RELEASE-MANIFEST-2.0.25.json'),
            (Join-Path $Dist 'DDM-SNOC-WINDOWS-RELEASE-MANIFEST-2.0.25.json.sha256')
          )
          foreach($File in $Files){if(-not(Test-Path -LiteralPath $File -PathType Leaf)){throw "Missing release file: $File"}}

          $Headers=@{
            'User-Agent'='DDM-SNOC-Windows-2.0.25-Repair'
            'Accept'='application/vnd.github+json'
            'Authorization'='Bearer '+$env:GH_TOKEN
            'X-GitHub-Api-Version'='2022-11-28'
          }
          $Uri='https://api.github.com/repos/bkpcloud-app/snoc/releases/tags/'+$Tag
          $Exists=$false
          try{[void](Invoke-RestMethod -Uri $Uri -Headers $Headers -TimeoutSec 30);$Exists=$true}catch{
            $Code=0
            try{$Code=[int]$_.Exception.Response.StatusCode}catch{}
            if($Code -ne 404){throw}
          }

          if($Exists){
            gh release upload $Tag @Files --repo bkpcloud-app/snoc --clobber
            if($LASTEXITCODE -ne 0){throw "gh release upload returned $LASTEXITCODE"}
            gh release edit $Tag --repo bkpcloud-app/snoc --title 'DDM SNOC Windows 2.0.25' --draft=false --prerelease=false
            if($LASTEXITCODE -ne 0){throw "gh release edit returned $LASTEXITCODE"}
          }else{
            gh release create $Tag @Files --repo bkpcloud-app/snoc --verify-tag --title 'DDM SNOC Windows 2.0.25' --generate-notes
            if($LASTEXITCODE -ne 0){throw "gh release create returned $LASTEXITCODE"}
          }

          $Release=Invoke-RestMethod -Uri $Uri -Headers $Headers -TimeoutSec 30
          $Expected=@($Files | ForEach-Object {Split-Path -Leaf $_})
          $Names=@($Release.assets | ForEach-Object {[string]$_.name})
          $Missing=@($Expected | Where-Object {$Names -notcontains $_})
          if([bool]$Release.draft -or [bool]$Release.prerelease -or $Missing.Count -gt 0){throw "Release invalid. Missing=$($Missing -join ', ')"}

          git fetch origin --tags
          $Verified='verified-ddm-snoc-windows-2.0.25'
          $ExistingCommit=''
          git rev-parse -q --verify ('refs/tags/'+$Verified) *> $null
          if($LASTEXITCODE -eq 0){$ExistingCommit=(git rev-list -n 1 $Verified).Trim()}
          if([string]::IsNullOrWhiteSpace($ExistingCommit)){
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a $Verified $env:TAG_COMMIT -m 'DDM SNOC Windows 2.0.25 official assets verified'
            git push origin ('refs/tags/'+$Verified)
            if($LASTEXITCODE -ne 0){throw "Verified tag push returned $LASTEXITCODE"}
          }elseif($ExistingCommit -ne $env:TAG_COMMIT){
            throw "Verified tag points to $ExistingCommit instead of $env:TAG_COMMIT"
          }

          Write-Host "RELEASE_ID=$($Release.id)"
          Write-Host "RELEASE_TAG=$Tag"
          Write-Host "RELEASE_ASSETS=$($Names -join ',')"
          Write-Host "VERIFIED_TAG=$Verified"
          Write-Host 'PUBLISH_2_0_25=PASS'
