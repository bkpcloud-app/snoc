name: Publish DDM SNOC Windows 2.0.19 PR

on:
  pull_request:
    paths:
      - '.github/workflows/publish-ddm-snoc-windows-2.0.19-pr.yml'

permissions:
  contents: write

concurrency:
  group: publish-ddm-snoc-windows-2.0.19-pr
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TARGET_COMMIT: 98547edefe4307b30aad63086b6d76d75f5f3545
      RELEASE_TAG: ddm-snoc-windows-v2.0.19
      PRODUCT_VERSION: 2.0.19
    steps:
      - name: Checkout exact production source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_COMMIT }}
          fetch-depth: 0

      - name: Verify source and parse PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Head=(git rev-parse HEAD).Trim()
          if($Head -ne $env:TARGET_COMMIT){throw "Checkout divergente. Esperado=$env:TARGET_COMMIT Atual=$Head"}
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          . (Join-Path $Product 'config\DDM-Product.ps1')
          if([string]$DDMProduct.ProductVersion -ne $env:PRODUCT_VERSION){throw "Versao divergente: $($DDMProduct.ProductVersion)"}
          foreach($File in @(Get-ChildItem -LiteralPath $Product -Filter '*.ps1' -Recurse -Force)){
            $Tokens=$null
            $Errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile($File.FullName,[ref]$Tokens,[ref]$Errors)
            if(@($Errors).Count -gt 0){throw (@($Errors|ForEach-Object{"$($File.FullName) L$($_.Extent.StartLineNumber): $($_.Message)"}) -join "`r`n")}
          }
          Write-Host "SOURCE_COMMIT=$Head"
          Write-Host "PRODUCT_VERSION=$($DDMProduct.ProductVersion)"

      - name: Execute complete product validation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          foreach($Test in @(
            'Test-DDM-Repository.ps1',
            'Test-DDM-RuntimeLexing.ps1',
            'Test-DDM-CentralBootstrapLoad.ps1',
            'Test-DDM-AclValidation.ps1',
            'Test-DDM-UncCmd.ps1',
            'Test-DDM-ForceRefresh.ps1',
            'Test-DDM-CentralRecovery.ps1',
            'Test-DDM-BootstrapFirstInstall.ps1'
          )){
            & (Join-Path $Product ('tools\'+$Test)) -ProductRoot $Product
            if($LASTEXITCODE -ne 0){throw "$Test returned $LASTEXITCODE"}
          }

      - name: Execute 240 migration scenarios on source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $global:ProductCode='$ProductCode'
          $Script=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment\tools\Test-DDM-SNOC-Migration-240Scenarios.ps1'
          $Output=Join-Path $env:RUNNER_TEMP 'DDM-SNOC-MIGRATION-240-2.0.19-SOURCE'
          & $Script -RepositoryRoot $env:GITHUB_WORKSPACE -OutputDirectory $Output
          if($LASTEXITCODE -ne 0){throw "Source migration validation returned $LASTEXITCODE"}
          "SOURCE_SCENARIO_OUTPUT=$Output" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build complete production assets
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          . (Join-Path $Product 'config\DDM-Product.ps1')
          $Dist=Join-Path $env:GITHUB_WORKSPACE 'dist-2.0.19-final'
          $Motor=Join-Path $Dist ('DDM-SNOC-WINDOWS-MOTOR-'+$DDMProduct.ProductVersion)
          $Seed=Join-Path $Dist ('DDM-SNOC-WINDOWS-AD-SEED-'+$DDMProduct.ProductVersion)
          Remove-Item $Dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $Motor,$Seed -ItemType Directory -Force | Out-Null
          foreach($Name in @('Start-DDM-SNOC.ps1','CLIENTE.example.ps1','README.md','CHANGELOG.md')){Copy-Item (Join-Path $Product $Name) (Join-Path $Motor $Name) -Force}
          foreach($Name in @('config','lib','central','bootstrap','endpoint','engine','modules','templates','tools','docs','clients')){Copy-Item (Join-Path $Product $Name) (Join-Path $Motor $Name) -Recurse -Force}
          foreach($Name in @('ATUALIZAR-AD.cmd','VOLTAR-RELEASE.cmd','RECUPERAR-AD.cmd','ATUALIZAR-AD-AUTOMATICO.cmd')){Copy-Item (Join-Path $Product ('templates\central\'+$Name)) (Join-Path $Seed $Name) -Force}
          Copy-Item (Join-Path $Product 'templates\central\SINCRONIZAR-CLIENTE-MAIN.ps1') (Join-Path $Seed 'SINCRONIZAR-CLIENTE.ps1') -Force
          Copy-Item (Join-Path $Product 'CLIENTE.example.ps1') (Join-Path $Seed 'CLIENTE.example.ps1') -Force
          Copy-Item (Join-Path $Product 'docs\UPDATE-AD.md') (Join-Path $Seed 'LEIA-ME-UPDATE-AD.md') -Force
          Copy-Item (Join-Path $Product 'docs\AUDITORIA-300-PONTOS.md') (Join-Path $Seed 'AUDITORIA-300-PONTOS.md') -Force
          Copy-Item (Join-Path $Product 'tools\Recover-DDM-CentralUpdater.ps1') (Join-Path $Seed 'Recover-DDM-CentralUpdater.ps1') -Force
          $Updater=Join-Path $Seed 'CENTRAL-UPDATER'
          foreach($Rel in @('central\Update-DDM-SNOC-Central.ps1','central\lib\DDM-Central-Client.ps1','central\lib\DDM-Central-Supply.ps1','central\lib\Invoke-DDM-Central-Publish.ps1','config\DDM-Product.ps1','lib\DDM-Common.ps1')){
            $Source=Join-Path $Product $Rel
            $Destination=Join-Path $Updater $Rel
            New-Item (Split-Path -Parent $Destination) -ItemType Directory -Force|Out-Null
            Copy-Item $Source $Destination -Force
          }
          $CentralTools=Join-Path $Seed 'CENTRAL-TOOLS\tools'
          New-Item $CentralTools -ItemType Directory -Force|Out-Null
          Copy-Item (Join-Path $Product 'tools\Set-DDM-CentralRelease.ps1') $CentralTools -Force
          $RequiredSeed=@('ATUALIZAR-AD.cmd','VOLTAR-RELEASE.cmd','RECUPERAR-AD.cmd','ATUALIZAR-AD-AUTOMATICO.cmd','SINCRONIZAR-CLIENTE.ps1','Recover-DDM-CentralUpdater.ps1','CENTRAL-UPDATER\central\Update-DDM-SNOC-Central.ps1','CENTRAL-UPDATER\central\lib\DDM-Central-Client.ps1','CENTRAL-UPDATER\central\lib\DDM-Central-Supply.ps1','CENTRAL-UPDATER\central\lib\Invoke-DDM-Central-Publish.ps1','CENTRAL-UPDATER\config\DDM-Product.ps1','CENTRAL-UPDATER\lib\DDM-Common.ps1','CENTRAL-TOOLS\tools\Set-DDM-CentralRelease.ps1')
          foreach($Required in $RequiredSeed){if(-not(Test-Path (Join-Path $Seed $Required) -PathType Leaf)){throw "AD-SEED incompleto: $Required"}}
          foreach($Root in @($Motor,$Seed)){if(Get-ChildItem $Root -Recurse -Force|Where-Object{$_.FullName -match '\\base-package\\|\\\.parts\\|New-BKPCloud-Zabbix-Client'}){throw "Conteudo legado no asset: $Root"}}
          $MotorZip=Join-Path $Dist ('DDM-SNOC-WINDOWS-MOTOR-'+$DDMProduct.ProductVersion+'.zip')
          $SeedZip=Join-Path $Dist ('DDM-SNOC-WINDOWS-AD-SEED-'+$DDMProduct.ProductVersion+'.zip')
          Compress-Archive -Path $Motor -DestinationPath $MotorZip -CompressionLevel Optimal
          Compress-Archive -Path (Join-Path $Seed '*') -DestinationPath $SeedZip -CompressionLevel Optimal
          $Assets=@()
          foreach($Zip in @($MotorZip,$SeedZip)){
            $Hash=(Get-FileHash $Zip -Algorithm SHA256).Hash.ToUpperInvariant()
            Set-Content -LiteralPath ($Zip+'.sha256') -Value ($Hash+' *'+(Split-Path -Leaf $Zip)) -Encoding ASCII
            $Assets+=New-Object PSObject -Property @{Name=(Split-Path -Leaf $Zip);Sha256=$Hash;Size=(Get-Item $Zip).Length}
          }
          $EngineHash=(Get-FileHash (Join-Path $Product 'engine\Install-DDM-Zabbix-Windows.ps1') -Algorithm SHA256).Hash.ToUpperInvariant()
          $Manifest=New-Object PSObject -Property @{Product=$DDMProduct.ProductName;ProductVersion=$DDMProduct.ProductVersion;GitCommit=$env:TARGET_COMMIT;GitTag=$env:RELEASE_TAG;GeneratedAtUtc=(Get-Date).ToUniversalTime().ToString('o');EngineSha256=$EngineHash;MigrationScenarios='240/240 source and final MOTOR';CentralRecoveryValidation='PASS';Assets=$Assets;ExternalPilotsRequired=$true}
          $ManifestPath=Join-Path $Dist ('DDM-SNOC-WINDOWS-RELEASE-MANIFEST-'+$DDMProduct.ProductVersion+'.json')
          $Manifest|ConvertTo-Json -Depth 6|Set-Content -LiteralPath $ManifestPath -Encoding UTF8
          $ManifestHash=(Get-FileHash $ManifestPath -Algorithm SHA256).Hash.ToUpperInvariant()
          Set-Content -LiteralPath ($ManifestPath+'.sha256') -Value ($ManifestHash+' *'+(Split-Path -Leaf $ManifestPath)) -Encoding ASCII
          "DIST_PATH=$Dist" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ENGINE_SHA256=$EngineHash"
          foreach($Asset in $Assets){Write-Host "ASSET=$($Asset.Name) SHA256=$($Asset.Sha256) SIZE=$($Asset.Size)"}

      - name: Inspect final MOTOR and execute 240 scenarios again
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Dist=$env:DIST_PATH
          $MotorZip=Join-Path $Dist 'DDM-SNOC-WINDOWS-MOTOR-2.0.19.zip'
          $Expanded=Join-Path $env:RUNNER_TEMP 'DDM-SNOC-2.0.19-FINAL-EXPANDED'
          $FinalRepo=Join-Path $env:RUNNER_TEMP 'DDM-SNOC-2.0.19-FINAL-REPO'
          Remove-Item $Expanded,$FinalRepo -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $MotorZip -DestinationPath $Expanded -Force
          $ExpandedProduct=Join-Path $Expanded 'DDM-SNOC-WINDOWS-MOTOR-2.0.19'
          $FinalProduct=Join-Path $FinalRepo 'windows\zabbix-agent-deployment'
          New-Item (Split-Path -Parent $FinalProduct) -ItemType Directory -Force|Out-Null
          Copy-Item -LiteralPath $ExpandedProduct -Destination $FinalProduct -Recurse -Force
          $WorkflowRoot=Join-Path $FinalRepo '.github\workflows'
          New-Item $WorkflowRoot -ItemType Directory -Force|Out-Null
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE '.github\workflows\ddm-snoc-windows-validation.yml') $WorkflowRoot -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE '.github\workflows\ddm-snoc-windows-release.yml') $WorkflowRoot -Force
          & (Join-Path $FinalProduct 'tools\Test-DDM-Repository.ps1') -ProductRoot $FinalProduct
          if($LASTEXITCODE -ne 0){throw "Final repository validation returned $LASTEXITCODE"}
          & (Join-Path $FinalProduct 'tools\Test-DDM-ForceRefresh.ps1') -ProductRoot $FinalProduct
          if($LASTEXITCODE -ne 0){throw "Final force validation returned $LASTEXITCODE"}
          & (Join-Path $FinalProduct 'tools\Test-DDM-CentralRecovery.ps1') -ProductRoot $FinalProduct
          if($LASTEXITCODE -ne 0){throw "Final recovery validation returned $LASTEXITCODE"}
          $global:ProductCode='$ProductCode'
          $Output=Join-Path $env:RUNNER_TEMP 'DDM-SNOC-MIGRATION-240-2.0.19-FINAL'
          & (Join-Path $FinalProduct 'tools\Test-DDM-SNOC-Migration-240Scenarios.ps1') -RepositoryRoot $FinalRepo -OutputDirectory $Output
          if($LASTEXITCODE -ne 0){throw "Final MOTOR migration validation returned $LASTEXITCODE"}
          "FINAL_SCENARIO_OUTPUT=$Output" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create tag, publish and verify release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          git fetch origin --tags --force
          $Existing=(git rev-list -n 1 $env:RELEASE_TAG 2>$null)
          if($LASTEXITCODE -eq 0 -and -not [string]::IsNullOrWhiteSpace([string]$Existing)){
            $Existing=([string]$Existing).Trim()
            if($Existing -ne $env:TARGET_COMMIT){throw "Tag existente aponta para $Existing"}
          }else{
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a $env:RELEASE_TAG $env:TARGET_COMMIT -m 'DDM SNOC Windows 2.0.19'
            git push origin ('refs/tags/'+$env:RELEASE_TAG)
            if($LASTEXITCODE -ne 0){throw "Tag push returned $LASTEXITCODE"}
          }
          $Dist=$env:DIST_PATH
          $Files=@((Join-Path $Dist 'DDM-SNOC-WINDOWS-MOTOR-2.0.19.zip'),(Join-Path $Dist 'DDM-SNOC-WINDOWS-MOTOR-2.0.19.zip.sha256'),(Join-Path $Dist 'DDM-SNOC-WINDOWS-AD-SEED-2.0.19.zip'),(Join-Path $Dist 'DDM-SNOC-WINDOWS-AD-SEED-2.0.19.zip.sha256'),(Join-Path $Dist 'DDM-SNOC-WINDOWS-RELEASE-MANIFEST-2.0.19.json'),(Join-Path $Dist 'DDM-SNOC-WINDOWS-RELEASE-MANIFEST-2.0.19.json.sha256'))
          $Headers=@{'User-Agent'='DDM-SNOC-2.0.19-Publisher';'Accept'='application/vnd.github+json';'Authorization'='Bearer '+$env:GH_TOKEN;'X-GitHub-Api-Version'='2022-11-28'}
          $ReleaseUri='https://api.github.com/repos/bkpcloud-app/snoc/releases/tags/'+$env:RELEASE_TAG
          $Exists=$false
          try{[void](Invoke-RestMethod -Uri $ReleaseUri -Headers $Headers -TimeoutSec 30);$Exists=$true}catch{$Status=0;try{$Status=[int]$_.Exception.Response.StatusCode}catch{};if($Status -ne 404){throw}}
          if($Exists){
            gh release upload $env:RELEASE_TAG @Files --repo bkpcloud-app/snoc --clobber
            if($LASTEXITCODE -ne 0){throw "Release upload returned $LASTEXITCODE"}
            gh release edit $env:RELEASE_TAG --repo bkpcloud-app/snoc --title 'DDM SNOC Windows 2.0.19' --draft=false --prerelease=false
            if($LASTEXITCODE -ne 0){throw "Release edit returned $LASTEXITCODE"}
          }else{
            gh release create $env:RELEASE_TAG @Files --repo bkpcloud-app/snoc --verify-tag --generate-notes --title 'DDM SNOC Windows 2.0.19'
            if($LASTEXITCODE -ne 0){throw "Release create returned $LASTEXITCODE"}
          }
          $Release=Invoke-RestMethod -Uri $ReleaseUri -Headers $Headers -TimeoutSec 30
          $Expected=@($Files|ForEach-Object{Split-Path -Leaf $_})
          $Names=@($Release.assets|ForEach-Object{[string]$_.name})
          $Missing=@($Expected|Where-Object{$Names -notcontains $_})
          if([bool]$Release.draft -or [bool]$Release.prerelease -or $Missing.Count -gt 0){throw "Release incompleta. Missing=$($Missing -join ', ')"}
          Write-Host "RELEASE_ID=$($Release.id)"
          Write-Host "RELEASE_TAG=$($Release.tag_name)"
          foreach($Name in $Expected){Write-Host "ASSET_OK=$Name"}

      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: DDM-SNOC-WINDOWS-2.0.19-FINAL-EVIDENCE
          path: |
            ${{ env.DIST_PATH }}
            ${{ env.SOURCE_SCENARIO_OUTPUT }}
            ${{ env.FINAL_SCENARIO_OUTPUT }}
            windows/zabbix-agent-deployment/tools/Recover-DDM-CentralUpdater.ps1
            windows/zabbix-agent-deployment/tools/Test-DDM-CentralRecovery.ps1
            windows/zabbix-agent-deployment/config/DDM-Product.ps1
          if-no-files-found: error
          retention-days: 30
