name: Normalize DDM SNOC Windows 2.0.6 PowerShell

on:
  push:
    paths:
      - '.github/workflows/ddm-snoc-normalize-powershell-2.0.6.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: main

      - name: Normalize glued PowerShell keywords and functions
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Root=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          $Patterns=@(
            @{ Pattern='(?im)(?<![\w-])return(?=(?:\$|\[|@|\(|[''\"]|\d))'; Replacement='return ' },
            @{ Pattern='(?im)(?<![\w-])throw(?=(?:\$|\[|@|\(|[''\"]|\d))'; Replacement='throw ' },
            @{ Pattern='(?im)(?<![\w-])Write-CentralLog(?=(?:\$|\[|@|\(|[''\"]|\d))'; Replacement='Write-CentralLog ' }
          )

          foreach($File in @(Get-ChildItem $Root -Filter '*.ps1' -Recurse)){
            $Raw=[IO.File]::ReadAllText($File.FullName)
            $Fixed=$Raw
            foreach($Rule in $Patterns){$Fixed=[regex]::Replace($Fixed,$Rule.Pattern,$Rule.Replacement)}
            if($File.Name -eq 'Set-DDM-CentralRelease.ps1'){
              $Fixed=[regex]::Replace($Fixed,'(?im)(?<![\w-])Log(?=(?:\$|\[|@|\(|[''\"]|\d))','Log ')
            }
            if($Fixed -ne $Raw){[IO.File]::WriteAllText($File.FullName,$Fixed,(New-Object Text.UTF8Encoding($false)))}
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add windows/zabbix-agent-deployment
          if(-not(git diff --cached --quiet)){
            git commit -m 'fix(snoc-windows): normaliza todos os comandos colados da 2.0.6'
            git push origin HEAD:main
          }

      - name: Validate parser, repository and runtime
        id: validate
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference='Stop'
          $Result=Join-Path $env:GITHUB_WORKSPACE 'normalize-result.txt'
          try{
            $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
            foreach($File in @(Get-ChildItem $Product -Filter '*.ps1' -Recurse)){
              $Tokens=$null;$Errors=$null
              [void][Management.Automation.Language.Parser]::ParseFile($File.FullName,[ref]$Tokens,[ref]$Errors)
              if(@($Errors).Count -gt 0){throw "$($File.FullName): $(@($Errors.Message)-join ' | ')"}
            }
            & (Join-Path $Product 'tools\Test-DDM-Repository.ps1') -ProductRoot $Product
            & (Join-Path $Product 'tools\Test-DDM-RuntimeLexing.ps1') -ProductRoot $Product
            "State=READY Commit=$(git rev-parse HEAD) VerifiedAtUtc=$((Get-Date).ToUniversalTime().ToString('o')) Message=Todos os comandos colados foram normalizados; parser, auditor e runtime mocks aprovados." | Set-Content $Result -Encoding UTF8
          }
          catch{
            $Message=$_.Exception.ToString().Replace("`r",' ').Replace("`n",' ')
            "State=FAILED Commit=$(git rev-parse HEAD) VerifiedAtUtc=$((Get-Date).ToUniversalTime().ToString('o')) Message=$Message" | Set-Content $Result -Encoding UTF8
            $_ | Format-List * -Force | Out-Host
            exit 1
          }

      - name: Publish normalization status
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Source=Join-Path $env:GITHUB_WORKSPACE 'normalize-result.txt'
          if(-not(Test-Path $Source)){"State=FAILED Message=Workflow sem resultado." | Set-Content $Source -Encoding UTF8}
          $Target=Join-Path $env:GITHUB_WORKSPACE 'release-status\ddm-snoc-windows-v2.0.6-normalization.txt'
          New-Item (Split-Path -Parent $Target) -ItemType Directory -Force | Out-Null
          Copy-Item $Source $Target -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $Target
          if(-not(git diff --cached --quiet)){
            git commit -m 'chore(snoc-windows): registra normalizacao 2.0.6'
            git pull --rebase origin main
            git push origin HEAD:main
          }
