name: Publish DDM SNOC Windows 2.0.25
# Merge-triggered one-time publisher for the audited 2.0.25 package.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-ddm-snoc-windows-2.0.25.yml'

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Validate exact 2.0.25 source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          . (Join-Path $Product 'config\DDM-Product.ps1')
          if([string]$DDMProduct.ProductVersion -ne '2.0.25'){throw "Expected 2.0.25, got $($DDMProduct.ProductVersion)"}
          $Engine=[IO.File]::ReadAllText((Join-Path $Product 'engine\Install-DDM-Zabbix-Windows.ps1'))
          if($Engine.Contains("\[t\|1\]")){throw 'Old agent.ping validation is still present.'}
          if(-not $Engine.Contains("\[[A-Za-z]\|1\]")){throw 'Corrected agent.ping validation is missing.'}
          $global:ProductCode='$ProductCode'
          $Output=Join-Path $env:RUNNER_TEMP 'DDM-SNOC-MIGRATION-240-2.0.25-PUBLISH'
          & (Join-Path $Product 'tools\Test-DDM-SNOC-Migration-240Scenarios.ps1') -RepositoryRoot $env:GITHUB_WORKSPACE -OutputDirectory $Output
          if(-not $?){throw '240 scenarios failed.'}
          foreach($Test in @(
            'Test-DDM-Repository.ps1',
            'Test-DDM-RuntimeLexing.ps1',
            'Test-DDM-CentralBootstrapLoad.ps1',
            'Test-DDM-AclValidation.ps1',
            'Test-DDM-UncCmd.ps1',
            'Test-DDM-ForceRefresh.ps1',
            'Test-DDM-CentralRecovery.ps1',
            'Test-DDM-CentralPathIdentity.ps1',
            'Test-DDM-BootstrapFirstInstall.ps1'
          )){
            & (Join-Path $Product ('tools\'+$Test)) -ProductRoot $Product
            if(-not $?){throw "$Test failed."}
          }

      - name: Create official tag and start release workflow
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $Tag='ddm-snoc-windows-v2.0.25'
          $Head=(git rev-parse HEAD).Trim()
          $Existing=@(git ls-remote --tags origin ('refs/tags/'+$Tag))
          if($Existing.Count -eq 0){
            git config user.name 'bkpcloud-app'
            git config user.email 'actions@users.noreply.github.com'
            git tag $Tag $Head
            git push origin ('refs/tags/'+$Tag)
          }
          else{
            $RemoteSha=([string]$Existing[0]).Split("`t")[0]
            if($RemoteSha -ne $Head){throw "Tag already exists at $RemoteSha, expected $Head"}
          }
          gh workflow run ddm-snoc-windows-release.yml --repo $env:GITHUB_REPOSITORY --ref main -f release_tag=$Tag
          if($LASTEXITCODE -ne 0){throw "Release workflow dispatch failed: $LASTEXITCODE"}
          Write-Host "TAG_CREATED=$Tag"
          Write-Host "TAG_COMMIT=$Head"
