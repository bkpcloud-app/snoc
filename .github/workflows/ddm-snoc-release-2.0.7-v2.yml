name: Publish DDM SNOC Windows 2.0.7 v2

on:
  push:
    paths:
      - '.github/workflows/ddm-snoc-release-2.0.7-v2.yml'

permissions:
  contents: write

concurrency:
  group: ddm-snoc-windows-release-2.0.7
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Patch version contracts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'

          $TestPath=Join-Path $Product 'tools\Test-DDM-Repository.ps1'
          $Raw=[IO.File]::ReadAllText($TestPath)
          $Raw=$Raw.Replace(
            "Assert-DDMTest (`$DDMProduct.ProductVersion -eq '2.0.6') 'ProductVersion deve ser 2.0.6.'",
            "Assert-DDMTest (`$DDMProduct.ProductVersion -eq '2.0.7') 'ProductVersion deve ser 2.0.7.'"
          )
          if($Raw -notmatch "ProductVersion -eq '2\.0\.7'"){throw 'Contrato 2.0.7 nao aplicado no auditor.'}
          [IO.File]::WriteAllText($TestPath,$Raw,(New-Object Text.UTF8Encoding($false)))

          $RecoveryPath=Join-Path $Product 'tools\Recover-DDM-SNOC-Central.ps1'
          $Recovery=[IO.File]::ReadAllText($RecoveryPath)
          $Recovery=$Recovery.Replace(
            "Write-Step '6/9 - Substituindo a publicacao parcial pelo AD-SEED 2.0.5...'",
            'Write-Step "6/9 - Substituindo a publicacao atual pelo AD-SEED $Version..."'
          )
          [IO.File]::WriteAllText($RecoveryPath,$Recovery,(New-Object Text.UTF8Encoding($false)))

      - name: Parse and test source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'

          foreach($File in @(Get-ChildItem -LiteralPath $Product -Filter '*.ps1' -Recurse)){
            $Tokens=$null;$Errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile($File.FullName,[ref]$Tokens,[ref]$Errors)
            if(@($Errors).Count -gt 0){throw "$($File.FullName): $(@($Errors.Message) -join ' | ')"}
          }

          & (Join-Path $Product 'tools\Test-DDM-Repository.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-RuntimeLexing.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-CentralBootstrapLoad.ps1') -ProductRoot $Product

      - name: Commit validated source
        id: source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add windows/zabbix-agent-deployment
          if(-not (git diff --cached --quiet)){
            git commit -m 'fix(snoc-windows): fecha contratos da release 2.0.7'
            git push origin HEAD:main
          }
          $Commit=(git rev-parse HEAD).Trim()
          "commit=$Commit" >> $env:GITHUB_OUTPUT

      - name: Build and validate assets
        id: build
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          . (Join-Path $Product 'config\DDM-Product.ps1')
          if($DDMProduct.ProductVersion -ne '2.0.7'){throw 'ProductVersion interna divergente.'}

          $Dist=Join-Path $env:GITHUB_WORKSPACE 'dist-2.0.7'
          $MotorName='DDM-SNOC-WINDOWS-MOTOR-2.0.7'
          $SeedName='DDM-SNOC-WINDOWS-AD-SEED-2.0.7'
          $Motor=Join-Path $Dist $MotorName
          $Seed=Join-Path $Dist $SeedName
          Remove-Item $Dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $Motor,$Seed -ItemType Directory -Force|Out-Null

          foreach($Name in @('Start-DDM-SNOC.ps1','CLIENTE.example.ps1','README.md','CHANGELOG.md')){
            Copy-Item (Join-Path $Product $Name) (Join-Path $Motor $Name) -Force
          }
          foreach($Name in @('config','lib','central','bootstrap','endpoint','engine','modules','templates','tools','docs','clients')){
            Copy-Item (Join-Path $Product $Name) (Join-Path $Motor $Name) -Recurse -Force
          }

          foreach($Name in @('ATUALIZAR-AD.cmd','VOLTAR-RELEASE.cmd')){
            Copy-Item (Join-Path $Product ('templates\central\'+$Name)) (Join-Path $Seed $Name) -Force
          }
          Copy-Item (Join-Path $Product 'CLIENTE.example.ps1') (Join-Path $Seed 'CLIENTE.example.ps1') -Force
          Copy-Item (Join-Path $Product 'docs\UPDATE-AD.md') (Join-Path $Seed 'LEIA-ME-UPDATE-AD.md') -Force
          Copy-Item (Join-Path $Product 'docs\AUDITORIA-300-PONTOS.md') (Join-Path $Seed 'AUDITORIA-300-PONTOS.md') -Force

          $Updater=Join-Path $Seed 'CENTRAL-UPDATER'
          foreach($Rel in @(
            'central\Update-DDM-SNOC-Central.ps1',
            'central\lib\DDM-Central-Client.ps1',
            'central\lib\DDM-Central-Supply.ps1',
            'central\lib\Invoke-DDM-Central-Publish.ps1',
            'config\DDM-Product.ps1',
            'lib\DDM-Common.ps1'
          )){
            $Src=Join-Path $Product $Rel
            $Dst=Join-Path $Updater $Rel
            New-Item (Split-Path -Parent $Dst) -ItemType Directory -Force|Out-Null
            Copy-Item $Src $Dst -Force
          }

          $Tools=Join-Path $Seed 'CENTRAL-TOOLS\tools'
          New-Item $Tools -ItemType Directory -Force|Out-Null
          Copy-Item (Join-Path $Product 'tools\Set-DDM-CentralRelease.ps1') $Tools -Force

          $SeedUpdate=Join-Path $Seed 'CENTRAL-UPDATER\central\Update-DDM-SNOC-Central.ps1'
          $SeedCommon=Join-Path $Seed 'CENTRAL-UPDATER\lib\DDM-Common.ps1'
          $SeedSupply=Join-Path $Seed 'CENTRAL-UPDATER\central\lib\DDM-Central-Supply.ps1'
          foreach($Required in @($SeedUpdate,$SeedCommon,$SeedSupply)){
            if(-not(Test-Path -LiteralPath $Required)){throw "AD-SEED incompleto: $Required"}
          }

          $UpdateRaw=[IO.File]::ReadAllText($SeedUpdate)
          $CommonMarker=". (Join-Path `$CentralScriptRoot '..\lib\DDM-Common.ps1')"
          $SupplyMarker=". (Join-Path `$CentralScriptRoot 'lib\DDM-Central-Supply.ps1')"
          $CommonIndex=$UpdateRaw.IndexOf($CommonMarker,[StringComparison]::Ordinal)
          $SupplyIndex=$UpdateRaw.IndexOf($SupplyMarker,[StringComparison]::Ordinal)
          if($CommonIndex -lt 0 -or $SupplyIndex -lt 0 -or $CommonIndex -gt $SupplyIndex){
            throw 'AD-SEED nao carrega DDM-Common antes do fornecedor central.'
          }

          . $SeedCommon
          if(-not(Get-Command Get-DDMSha256 -ErrorAction SilentlyContinue)){throw 'Get-DDMSha256 ausente no AD-SEED.'}
          $Probe=Join-Path $Dist 'probe.txt'
          [IO.File]::WriteAllText($Probe,'probe',[Text.Encoding]::ASCII)
          if((Get-DDMSha256 $Probe).Length -ne 64){throw 'Get-DDMSha256 falhou no AD-SEED.'}

          $MotorZip=Join-Path $Dist ($MotorName+'.zip')
          $SeedZip=Join-Path $Dist ($SeedName+'.zip')
          Compress-Archive -Path $Motor -DestinationPath $MotorZip -CompressionLevel Optimal
          Compress-Archive -Path (Join-Path $Seed '*') -DestinationPath $SeedZip -CompressionLevel Optimal

          foreach($Zip in @($MotorZip,$SeedZip)){
            $Hash=(Get-FileHash -LiteralPath $Zip -Algorithm SHA256).Hash
            Set-Content -LiteralPath ($Zip+'.sha256') -Value ($Hash+' *'+(Split-Path -Leaf $Zip)) -Encoding ASCII
          }

          $Expanded=Join-Path $env:RUNNER_TEMP 'ddm-2.0.7-expanded'
          Remove-Item $Expanded -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $MotorZip -DestinationPath $Expanded -Force
          $ExpandedProduct=Join-Path $Expanded $MotorName
          $ExpandedRepoRoot=Split-Path -Parent (Split-Path -Parent $ExpandedProduct)
          $WorkflowRoot=Join-Path $ExpandedRepoRoot '.github\workflows'
          New-Item $WorkflowRoot -ItemType Directory -Force|Out-Null
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE '.github\workflows\ddm-snoc-windows-validation.yml') $WorkflowRoot -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE '.github\workflows\ddm-snoc-windows-release.yml') $WorkflowRoot -Force
          & (Join-Path $ExpandedProduct 'tools\Test-DDM-Repository.ps1') -ProductRoot $ExpandedProduct
          & (Join-Path $ExpandedProduct 'tools\Test-DDM-RuntimeLexing.ps1') -ProductRoot $ExpandedProduct
          & (Join-Path $ExpandedProduct 'tools\Test-DDM-CentralBootstrapLoad.ps1') -ProductRoot $ExpandedProduct

          $AssetRows=@()
          foreach($Zip in @($MotorZip,$SeedZip)){
            $AssetRows+=New-Object PSObject -Property @{
              Name=(Split-Path -Leaf $Zip)
              Sha256=(Get-FileHash -LiteralPath $Zip -Algorithm SHA256).Hash
              Size=(Get-Item -LiteralPath $Zip).Length
            }
          }
          $ManifestPath=Join-Path $Dist 'DDM-SNOC-WINDOWS-RELEASE-MANIFEST-2.0.7.json'
          $Manifest=New-Object PSObject -Property @{
            Product='DDM SNOC Windows'
            ProductVersion='2.0.7'
            GitCommit='${{ steps.source.outputs.commit }}'
            GitTag='ddm-snoc-windows-v2.0.7'
            GeneratedAtUtc=(Get-Date).ToUniversalTime().ToString('o')
            Assets=$AssetRows
            Validation=@('repository audit','runtime lexical','central bootstrap load','AD-SEED load order','expanded motor')
            ExternalPilotsRequired=$true
          }
          $Manifest|ConvertTo-Json -Depth 6|Set-Content -LiteralPath $ManifestPath -Encoding UTF8
          $ManifestHash=(Get-FileHash -LiteralPath $ManifestPath -Algorithm SHA256).Hash
          Set-Content -LiteralPath ($ManifestPath+'.sha256') -Value ($ManifestHash+' *'+(Split-Path -Leaf $ManifestPath)) -Encoding ASCII
          "dist=$Dist" >> $env:GITHUB_OUTPUT

      - name: Tag and publish six explicit assets
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $Tag='ddm-snoc-windows-v2.0.7'
          $Commit='${{ steps.source.outputs.commit }}'
          $Dist='${{ steps.build.outputs.dist }}'

          git tag -a $Tag $Commit -m 'DDM SNOC Windows 2.0.7'
          git push origin $Tag

          $Motor=Join-Path $Dist 'DDM-SNOC-WINDOWS-MOTOR-2.0.7.zip'
          $Seed=Join-Path $Dist 'DDM-SNOC-WINDOWS-AD-SEED-2.0.7.zip'
          $Manifest=Join-Path $Dist 'DDM-SNOC-WINDOWS-RELEASE-MANIFEST-2.0.7.json'

          & gh release create $Tag `
            $Motor `
            ($Motor+'.sha256') `
            $Seed `
            ($Seed+'.sha256') `
            $Manifest `
            ($Manifest+'.sha256') `
            --verify-tag `
            --title 'DDM SNOC Windows 2.0.7' `
            --notes 'Corrige o carregamento de DDM-Common.ps1 antes da validacao do motor no atualizador central.'
          if($LASTEXITCODE -ne 0){throw "gh release create retornou $LASTEXITCODE"}

          $Release=gh api "repos/bkpcloud-app/snoc/releases/tags/$Tag"|ConvertFrom-Json
          $Names=@($Release.assets|ForEach-Object{[string]$_.name}|Sort-Object)
          $Expected=@(
            'DDM-SNOC-WINDOWS-AD-SEED-2.0.7.zip',
            'DDM-SNOC-WINDOWS-AD-SEED-2.0.7.zip.sha256',
            'DDM-SNOC-WINDOWS-MOTOR-2.0.7.zip',
            'DDM-SNOC-WINDOWS-MOTOR-2.0.7.zip.sha256',
            'DDM-SNOC-WINDOWS-RELEASE-MANIFEST-2.0.7.json',
            'DDM-SNOC-WINDOWS-RELEASE-MANIFEST-2.0.7.json.sha256'
          )|Sort-Object
          if(($Names -join '|') -ne ($Expected -join '|')){throw "Assets divergentes: $($Names -join '|')"}

      - name: Record READY
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Status=Join-Path $env:GITHUB_WORKSPACE 'release-status\ddm-snoc-windows-v2.0.7.txt'
          New-Item (Split-Path -Parent $Status) -ItemType Directory -Force|Out-Null
          ('State=READY Tag=ddm-snoc-windows-v2.0.7 Commit=${{ steps.source.outputs.commit }} VerifiedAtUtc='+(Get-Date).ToUniversalTime().ToString('o')+' Assets=6 Validation=repository_audit,runtime_lexical,central_bootstrap_load,seed_load_order,expanded_motor')|Set-Content -LiteralPath $Status -Encoding UTF8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $Status
          git commit -m 'chore(snoc-windows): registra release 2.0.7 READY'
          git push origin HEAD:main
