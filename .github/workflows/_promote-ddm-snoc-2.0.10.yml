name: Promote DDM SNOC Windows 2.0.10 UNC Fix

on:
  push:
    paths:
      - '.github/workflows/_promote-ddm-snoc-2.0.10.yml'

permissions:
  contents: write

concurrency:
  group: promote-ddm-snoc-windows-2.0.10
  cancel-in-progress: false

env:
  PRODUCT_VERSION: '2.0.10'
  RELEASE_TAG: 'ddm-snoc-windows-v2.0.10'

jobs:
  promote:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Patch UNC handling and add regression controls
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Repo=$env:GITHUB_WORKSPACE
          $Product=Join-Path $Repo 'windows\zabbix-agent-deployment'
          $Utf8=New-Object System.Text.UTF8Encoding($false)
          function ReadText([string]$Path){[IO.File]::ReadAllText($Path)}
          function SaveText([string]$Path,[string]$Text){[IO.File]::WriteAllText($Path,$Text,$Utf8)}

          $InstallCmdPath=Join-Path $Product 'templates\central\INSTALAR-BOOTSTRAP.cmd'
          $InstallCmd=@'
          @echo off
          setlocal EnableExtensions DisableDelayedExpansion
          set "CENTRAL=%~dp0"
          if "%CENTRAL:~-1%"=="\" set "CENTRAL=%CENTRAL:~0,-1%"
          set "INSTALLER=%CENTRAL%\BOOTSTRAP-INSTALL\bootstrap\Install-DDM-SNOC-Bootstrap.ps1"
          if not exist "%INSTALLER%" exit /b 3
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "%INSTALLER%" -CentralRoot "%CENTRAL%"
          exit /b %ERRORLEVEL%
          '@
          SaveText $InstallCmdPath (($InstallCmd -replace '(?m)^          ','').Trim()+"`r`n")

          $GpoCmdPath=Join-Path $Product 'templates\central\GPO-DIARIA.cmd'
          $GpoCmd=@'
          @echo off
          setlocal EnableExtensions DisableDelayedExpansion
          set "CENTRAL=%~dp0"
          if "%CENTRAL:~-1%"=="\" set "CENTRAL=%CENTRAL:~0,-1%"
          set "BOOT=C:\ProgramData\BKPCloud\SNOC-Windows\Bootstrap\Invoke-DDM-SNOC-Bootstrap.ps1"
          if not exist "%BOOT%" call "%CENTRAL%\INSTALAR-BOOTSTRAP.cmd"
          if errorlevel 1 exit /b %ERRORLEVEL%
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "%BOOT%" -CentralRoot "%CENTRAL%" -Mode Auto
          exit /b %ERRORLEVEL%
          '@
          SaveText $GpoCmdPath (($GpoCmd -replace '(?m)^          ','').Trim()+"`r`n")

          $OldNormalize='$CentralRoot=[System.IO.Path]::GetFullPath($CentralRoot).TrimEnd(''\'')'
          $NewNormalize=@'
          function Normalize-DDMCentralRootArgument([string]$Value) {
              if (Test-DDMBlank $Value) { throw 'CentralRoot ausente ou vazio.' }
              $Normalized=([string]$Value).Trim()
              while ($Normalized.Length -ge 2 -and $Normalized.Substring(0,1) -eq '"' -and $Normalized.Substring($Normalized.Length-1,1) -eq '"') {
                  $Normalized=$Normalized.Substring(1,$Normalized.Length-2).Trim()
              }
              if ($Normalized.IndexOf('"') -ge 0) { throw 'CentralRoot contem aspas invalidas.' }
              try { $Full=[System.IO.Path]::GetFullPath($Normalized) }
              catch { throw ('CentralRoot invalido: ' + $_.Exception.Message) }
              return $Full.TrimEnd('\')
          }
          $CentralRoot=Normalize-DDMCentralRootArgument $CentralRoot
          '@
          $NewNormalize=($NewNormalize -replace '(?m)^          ','').Trim()
          foreach($Relative in @('bootstrap\Install-DDM-SNOC-Bootstrap.ps1','bootstrap\Invoke-DDM-SNOC-Bootstrap.ps1')){
              $Path=Join-Path $Product $Relative
              $Text=ReadText $Path
              if(-not $Text.Contains($OldNormalize)){throw "Normalizacao antiga nao encontrada em $Relative"}
              $Text=$Text.Replace($OldNormalize,$NewNormalize)
              SaveText $Path $Text
          }

          $ConfigPath=Join-Path $Product 'config\DDM-Product.ps1'
          $Config=ReadText $ConfigPath
          if(-not $Config.Contains("ProductVersion           = '2.0.9'")){throw 'Versao 2.0.9 nao encontrada.'}
          SaveText $ConfigPath ($Config.Replace("ProductVersion           = '2.0.9'","ProductVersion           = '2.0.10'"))

          $RecoveryPath=Join-Path $Product 'tools\Recover-DDM-SNOC-Central.ps1'
          $Recovery=ReadText $RecoveryPath
          if(-not $Recovery.Contains("[string]`$ExpectedTag = 'ddm-snoc-windows-v2.0.9'")){throw 'ExpectedTag 2.0.9 nao encontrado.'}
          SaveText $RecoveryPath ($Recovery.Replace("[string]`$ExpectedTag = 'ddm-snoc-windows-v2.0.9'","[string]`$ExpectedTag = 'ddm-snoc-windows-v2.0.10'"))

          $TestPath=Join-Path $Product 'tools\Test-DDM-Repository.ps1'
          $Test=ReadText $TestPath
          $OldVersion="Assert-DDMTest (`$DDMProduct.ProductVersion -eq '2.0.9') 'ProductVersion deve ser 2.0.9.'"
          $NewVersion="Assert-DDMTest (`$DDMProduct.ProductVersion -eq '2.0.10') 'ProductVersion deve ser 2.0.10.'"
          if(-not $Test.Contains($OldVersion)){throw 'Assercao 2.0.9 nao encontrada.'}
          $Test=$Test.Replace($OldVersion,$NewVersion)
          $Marker=@'
          $Bootstrap = Read-DDMRaw 'bootstrap\Invoke-DDM-SNOC-Bootstrap.ps1'
          $BootstrapInstaller = Read-DDMRaw 'bootstrap\Install-DDM-SNOC-Bootstrap.ps1'
          $Endpoint = Read-DDMRaw 'endpoint\Invoke-DDM-SNOC-Daily.ps1'
          '@
          $Insert=@'
          $Bootstrap = Read-DDMRaw 'bootstrap\Invoke-DDM-SNOC-Bootstrap.ps1'
          $BootstrapInstaller = Read-DDMRaw 'bootstrap\Install-DDM-SNOC-Bootstrap.ps1'
          $Endpoint = Read-DDMRaw 'endpoint\Invoke-DDM-SNOC-Daily.ps1'
          $InstallBootstrapCmd = Read-DDMRaw 'templates\central\INSTALAR-BOOTSTRAP.cmd'
          $GpoDailyCmd = Read-DDMRaw 'templates\central\GPO-DIARIA.cmd'
          foreach ($CmdText in @($InstallBootstrapCmd,$GpoDailyCmd)) {
              Assert-DDMTest ($CmdText.Contains('set "CENTRAL=%~dp0"')) 'CMD central nao captura o diretorio UNC.'
              Assert-DDMTest ($CmdText.Contains('if "%CENTRAL:~-1%"=="\" set "CENTRAL=%CENTRAL:~0,-1%"')) 'CMD central nao remove a barra final do UNC.'
              Assert-DDMTest ($CmdText.Contains('-CentralRoot "%CENTRAL%"')) 'CMD central nao usa o caminho UNC normalizado.'
              Assert-DDMTest (-not $CmdText.Contains('-CentralRoot "%~dp0"')) 'CMD central ainda passa %~dp0 diretamente ao PowerShell.'
          }
          Assert-DDMTest ($BootstrapInstaller.Contains('Normalize-DDMCentralRootArgument')) 'Instalador nao normaliza CentralRoot defensivamente.'
          Assert-DDMTest ($Bootstrap.Contains('Normalize-DDMCentralRootArgument')) 'Bootstrap nao normaliza CentralRoot defensivamente.'
          '@
          $Marker=($Marker -replace '(?m)^          ','').Trim()
          $Insert=($Insert -replace '(?m)^          ','').Trim()
          if(-not $Test.Contains($Marker)){throw 'Marcador da secao bootstrap nao encontrado.'}
          $Test=$Test.Replace($Marker,$Insert)
          SaveText $TestPath $Test

          $DocPath=Join-Path $Product 'docs\GPO-DIARIA.md'
          $Doc=ReadText $DocPath
          $DocNote=@'
          ## Execucao por caminho UNC

          `INSTALAR-BOOTSTRAP.cmd` e `GPO-DIARIA.cmd` normalizam `%~dp0` antes de chamar o PowerShell. O caminho enviado em `-CentralRoot` nao possui barra final nem aspas residuais. A regressao e validada executando os CMDs diretamente por um compartilhamento SMB em Windows.

          '@
          $DocNote=($DocNote -replace '(?m)^          ','')
          if($Doc -notmatch '(?m)^## Execucao por caminho UNC'){SaveText $DocPath ($DocNote+$Doc)}

          $ChangePath=Join-Path $Product 'CHANGELOG.md'
          $Change=ReadText $ChangePath
          if($Change -notmatch '(?m)^## 2\.0\.10\b'){
              $Entry="## 2.0.10 - 2026-08-04`r`n- Corrige a execucao de INSTALAR-BOOTSTRAP.cmd e GPO-DIARIA.cmd diretamente por caminho UNC.`r`n- Remove a barra final de %~dp0 antes de enviar CentralRoot ao PowerShell.`r`n- Adiciona normalizacao defensiva de aspas e teste real por compartilhamento SMB.`r`n`r`n"
              SaveText $ChangePath ($Entry+$Change)
          }

          Remove-Item -LiteralPath (Join-Path $Repo '.github\workflows\_promote-ddm-snoc-2.0.10.yml') -Force
          Remove-Item -LiteralPath (Join-Path $Repo 'release-status\ddm-snoc-windows-v2.0.10.txt') -Force -ErrorAction SilentlyContinue

      - name: Validate source and official clients
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          & (Join-Path $Product 'tools\Test-DDM-Repository.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-RuntimeLexing.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-CentralBootstrapLoad.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-AclValidation.ps1') -ProductRoot $Product

      - name: Execute actual CMD files through UNC share
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          $ShareRoot=Join-Path $env:RUNNER_TEMP 'ddm-unc-regression'
          $ShareName='DDMSNOCUNC'
          $Expected="\\localhost\$ShareName"
          $InstallerMarker=Join-Path $env:RUNNER_TEMP 'ddm-installer-root.txt'
          $BootstrapMarker=Join-Path $env:RUNNER_TEMP 'ddm-bootstrap-root.txt'
          $LocalBootstrap='C:\ProgramData\BKPCloud\SNOC-Windows\Bootstrap\Invoke-DDM-SNOC-Bootstrap.ps1'
          Remove-Item $ShareRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $InstallerMarker,$BootstrapMarker -Force -ErrorAction SilentlyContinue
          Remove-SmbShare -Name $ShareName -Force -Confirm:$false -ErrorAction SilentlyContinue
          New-Item (Join-Path $ShareRoot 'BOOTSTRAP-INSTALL\bootstrap') -ItemType Directory -Force|Out-Null
          Copy-Item (Join-Path $Product 'templates\central\INSTALAR-BOOTSTRAP.cmd') (Join-Path $ShareRoot 'INSTALAR-BOOTSTRAP.cmd') -Force
          Copy-Item (Join-Path $Product 'templates\central\GPO-DIARIA.cmd') (Join-Path $ShareRoot 'GPO-DIARIA.cmd') -Force
          $ProbeInstaller=@'
          param([string]$CentralRoot)
          $ErrorActionPreference='Stop'
          if($CentralRoot -ne $env:DDM_EXPECTED_UNC){throw "CentralRoot recebido incorretamente: <$CentralRoot>"}
          [IO.File]::WriteAllText($env:DDM_INSTALLER_MARKER,$CentralRoot)
          $Boot='C:\ProgramData\BKPCloud\SNOC-Windows\Bootstrap\Invoke-DDM-SNOC-Bootstrap.ps1'
          New-Item (Split-Path -Parent $Boot) -ItemType Directory -Force|Out-Null
          $ProbeBoot=@'
          param([string]$CentralRoot,[string]$Mode)
          if($CentralRoot -ne $env:DDM_EXPECTED_UNC){throw "Bootstrap CentralRoot incorreto: <$CentralRoot>"}
          if($Mode -ne 'Auto'){throw "Bootstrap Mode incorreto: <$Mode>"}
          [IO.File]::WriteAllText($env:DDM_BOOTSTRAP_MARKER,$CentralRoot)
          '@
          [IO.File]::WriteAllText($Boot,$ProbeBoot,(New-Object Text.UTF8Encoding($false)))
          '@
          $ProbeInstaller=($ProbeInstaller -replace '(?m)^          ','')
          [IO.File]::WriteAllText((Join-Path $ShareRoot 'BOOTSTRAP-INSTALL\bootstrap\Install-DDM-SNOC-Bootstrap.ps1'),$ProbeInstaller,(New-Object Text.UTF8Encoding($false)))
          New-SmbShare -Name $ShareName -Path $ShareRoot -FullAccess 'Everyone'|Out-Null
          $env:DDM_EXPECTED_UNC=$Expected
          $env:DDM_INSTALLER_MARKER=$InstallerMarker
          $env:DDM_BOOTSTRAP_MARKER=$BootstrapMarker
          try {
              & $env:ComSpec /d /c ('call "{0}\INSTALAR-BOOTSTRAP.cmd"' -f $Expected)
              if($LASTEXITCODE -ne 0){throw "INSTALAR-BOOTSTRAP.cmd UNC retornou $LASTEXITCODE"}
              if((Get-Content $InstallerMarker -Raw) -ne $Expected){throw 'INSTALAR-BOOTSTRAP.cmd alterou o UNC.'}
              Remove-Item $LocalBootstrap -Force -ErrorAction SilentlyContinue
              Remove-Item $InstallerMarker,$BootstrapMarker -Force -ErrorAction SilentlyContinue
              & $env:ComSpec /d /c ('call "{0}\GPO-DIARIA.cmd"' -f $Expected)
              if($LASTEXITCODE -ne 0){throw "GPO-DIARIA.cmd UNC retornou $LASTEXITCODE"}
              if((Get-Content $InstallerMarker -Raw) -ne $Expected){throw 'GPO-DIARIA.cmd enviou UNC incorreto ao instalador.'}
              if((Get-Content $BootstrapMarker -Raw) -ne $Expected){throw 'GPO-DIARIA.cmd enviou UNC incorreto ao bootstrap.'}
              Write-Host 'UNC_CMD_REGRESSION_OK' -ForegroundColor Green
          }
          finally {
              Remove-SmbShare -Name $ShareName -Force -Confirm:$false -ErrorAction SilentlyContinue
              Remove-Item $ShareRoot -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item 'C:\ProgramData\BKPCloud\SNOC-Windows' -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Commit validated source and tag release
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0){throw 'Nenhuma alteracao para publicar.'}
          git commit -m 'fix(snoc-windows): corrige bootstrap por UNC e promove 2.0.10'
          git push origin HEAD:main
          $Commit=(git rev-parse HEAD).Trim()
          if(-not [string]::IsNullOrWhiteSpace([string](git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"))){throw "Tag ja existe: $env:RELEASE_TAG"}
          git tag -a $env:RELEASE_TAG $Commit -m "DDM SNOC Windows $env:PRODUCT_VERSION"
          git push origin $env:RELEASE_TAG

      - name: Wait for official release and record evidence
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $Release=$null
          for($Attempt=1;$Attempt -le 60;$Attempt++){
              try {$Release=(& gh release view $env:RELEASE_TAG --json tagName,isDraft,isPrerelease,assets 2>$null)|ConvertFrom-Json}catch{$Release=$null}
              if($Release -and -not $Release.isDraft -and -not $Release.isPrerelease -and @($Release.assets).Count -eq 6){break}
              Start-Sleep -Seconds 10
          }
          if(-not $Release){throw 'Release oficial nao foi criada.'}
          if($Release.isDraft -or $Release.isPrerelease){throw 'Release nao ficou estavel.'}
          if(@($Release.assets).Count -ne 6){throw "Release possui $(@($Release.assets).Count) assets."}
          git fetch origin main
          git checkout -B evidence origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $Commit=(git rev-list -n 1 $env:RELEASE_TAG).Trim()
          $Status=Join-Path $env:GITHUB_WORKSPACE 'release-status\ddm-snoc-windows-v2.0.10.txt'
          New-Item (Split-Path -Parent $Status) -ItemType Directory -Force|Out-Null
          $Value='State=READY Tag='+$env:RELEASE_TAG+' Commit='+$Commit+' Assets=6 UncCmdRegression=PASS VerifiedAtUtc='+(Get-Date).ToUniversalTime().ToString('o')
          Set-Content -LiteralPath $Status -Value $Value -Encoding UTF8
          git add $Status
          git commit -m 'chore(snoc-windows): registra release 2.0.10 validada'
          git push origin HEAD:main
