name: Publish DDM SNOC Windows 2.0.18 Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-ddm-snoc-2.0.18-once.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-ddm-snoc-windows-2.0.18-once
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main with tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Create exact approved 2.0.18 tag
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Tag = 'ddm-snoc-windows-v2.0.18'
          $TagCommit = '9649153140031b4d7f1040329073cdbbf39dbdd8'
          git fetch origin main --tags
          git merge-base --is-ancestor $TagCommit origin/main
          if ($LASTEXITCODE -ne 0) {
              throw 'O commit aprovado da 2.0.18 nao pertence a main.'
          }
          $Config = git show ("${TagCommit}:windows/zabbix-agent-deployment/config/DDM-Product.ps1")
          if (($Config -join "`n") -notmatch "ProductVersion\s*=\s*'2\.0\.18'") {
              throw 'O commit aprovado nao declara ProductVersion 2.0.18.'
          }
          $Existing = git rev-parse -q --verify ("refs/tags/$Tag") 2>$null
          if ($LASTEXITCODE -eq 0) {
              $Existing = ([string]$Existing).Trim()
              if ($Existing -ne $TagCommit) {
                  throw "A tag $Tag aponta para $Existing em vez de $TagCommit."
              }
          }
          else {
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git tag -a $Tag $TagCommit -m 'DDM SNOC Windows 2.0.18 - central backup hygiene'
              git push origin ("refs/tags/$Tag")
          }
          Write-Host "OFFICIAL_TAG=$Tag"
          Write-Host "OFFICIAL_COMMIT=$TagCommit"

      - name: Dispatch official release workflow
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh workflow run ddm-snoc-windows-release.yml `
              --repo bkpcloud-app/snoc `
              --ref main `
              -f release_tag=ddm-snoc-windows-v2.0.18
          if ($LASTEXITCODE -ne 0) {
              throw "Release workflow dispatch returned $LASTEXITCODE"
          }

      - name: Wait for independently verified release assets
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $VerifiedTag = 'verified-ddm-snoc-windows-2.0.18'
          $ReleaseTag = 'ddm-snoc-windows-v2.0.18'
          $Expected = @(
              'DDM-SNOC-WINDOWS-MOTOR-2.0.18.zip',
              'DDM-SNOC-WINDOWS-MOTOR-2.0.18.zip.sha256',
              'DDM-SNOC-WINDOWS-AD-SEED-2.0.18.zip',
              'DDM-SNOC-WINDOWS-AD-SEED-2.0.18.zip.sha256',
              'DDM-SNOC-WINDOWS-RELEASE-MANIFEST-2.0.18.json',
              'DDM-SNOC-WINDOWS-RELEASE-MANIFEST-2.0.18.json.sha256'
          )
          $Headers = @{
              'User-Agent' = 'DDM-SNOC-Windows-2.0.18-Publisher'
              'Accept' = 'application/vnd.github+json'
              'Authorization' = 'Bearer ' + $env:GH_TOKEN
              'X-GitHub-Api-Version' = '2022-11-28'
          }
          $Verified = $false
          for ($Attempt = 1; $Attempt -le 120; $Attempt++) {
              git fetch origin --tags --force *> $null
              git rev-parse -q --verify ("refs/tags/$VerifiedTag") *> $null
              if ($LASTEXITCODE -eq 0) {
                  try {
                      $Release = Invoke-RestMethod `
                          -Uri ("https://api.github.com/repos/bkpcloud-app/snoc/releases/tags/$ReleaseTag") `
                          -Headers $Headers `
                          -TimeoutSec 30 `
                          -ErrorAction Stop
                      $Names = @($Release.assets | ForEach-Object { [string]$_.name })
                      $Missing = @($Expected | Where-Object { $Names -notcontains $_ })
                      if (-not [bool]$Release.draft -and -not [bool]$Release.prerelease -and $Missing.Count -eq 0) {
                          $Verified = $true
                          break
                      }
                  }
                  catch {}
              }
              Write-Host "Aguardando release verificada: tentativa $Attempt/120"
              Start-Sleep -Seconds 10
          }
          if (-not $Verified) {
              throw 'A release 2.0.18 nao ficou completa e verificada dentro da janela.'
          }
          Write-Host "RELEASE_VERIFIED_ID=$($Release.id)"
          foreach ($Name in $Expected) {
              Write-Host "ASSET_OK=$Name"
          }
