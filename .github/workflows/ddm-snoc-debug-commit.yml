name: Persist DDM SNOC Audit Diagnostic

on:
  pull_request:
    paths:
      - 'windows/zabbix-agent-deployment/**'
      - '.github/workflows/ddm-snoc-debug-commit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ddm-snoc-debug-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Repair PowerShell 2 registry compatibility
        shell: powershell
        run: |
          $Path=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment\engine\Install-DDM-Zabbix-Windows.ps1'
          $Text=[IO.File]::ReadAllText($Path)
          $Old="if([int]`$Snap.DelayedAutoStart -eq 1){Set-ItemProperty -LiteralPath ('HKLM:\SYSTEM\CurrentControlSet\Services\'+`$Snap.Name) -Name DelayedAutoStart -Value 1 -Type DWord -Force}else{Remove-ItemProperty -LiteralPath ('HKLM:\SYSTEM\CurrentControlSet\Services\'+`$Snap.Name) -Name DelayedAutoStart -ErrorAction SilentlyContinue}"
          $New="if([int]`$Snap.DelayedAutoStart -eq 1){`$ServiceKey=[Microsoft.Win32.Registry]::LocalMachine.OpenSubKey(('SYSTEM\CurrentControlSet\Services\'+`$Snap.Name),`$true);if(`$null -eq `$ServiceKey){throw ('Chave do servico nao encontrada: '+`$Snap.Name)};try{`$ServiceKey.SetValue('DelayedAutoStart',1,[Microsoft.Win32.RegistryValueKind]::DWord)}finally{`$ServiceKey.Close()}}else{Remove-ItemProperty -LiteralPath ('HKLM:\SYSTEM\CurrentControlSet\Services\'+`$Snap.Name) -Name DelayedAutoStart -ErrorAction SilentlyContinue}"
          if($Text.Contains($Old)){
            [IO.File]::WriteAllText($Path,$Text.Replace($Old,$New),(New-Object Text.UTF8Encoding($false)))
          }

      - name: Capture complete validation exception
        shell: powershell
        run: |
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          $Report=Join-Path $env:GITHUB_WORKSPACE '.github\ddm-snoc-debug-report.txt'
          $Lines=New-Object System.Collections.Generic.List[string]
          try {
            & (Join-Path $Product 'tools\Test-DDM-Repository.ps1') -ProductRoot $Product *>&1 | ForEach-Object {$Lines.Add([string]$_);Write-Host $_}
            $Lines.Add('RESULT=SUCCESS')
          } catch {
            $Lines.Add('RESULT=FAILURE')
            $Lines.Add('MESSAGE='+$_.Exception.Message)
            $Lines.Add('POSITION='+[string]$_.InvocationInfo.PositionMessage)
            $Lines.Add('STACK='+[string]$_.ScriptStackTrace)
            $Lines.Add(($_ | Format-List * -Force | Out-String))
          }
          [IO.File]::WriteAllLines($Report,$Lines,[Text.Encoding]::UTF8)

      - name: Commit compatibility repair and diagnostic report
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add windows/zabbix-agent-deployment/engine/Install-DDM-Zabbix-Windows.ps1 .github/ddm-snoc-debug-report.txt
          if((git status --porcelain).Length -gt 0){
            git commit -m 'fix(snoc-windows): restore PowerShell 2 registry compatibility'
            git push origin HEAD:${{ github.head_ref }}
          }
