name: Clean DDM SNOC Temporary Diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/ddm-snoc-debug-commit.yml'
      - '.github/workflows/ddm-snoc-debug-message.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Remove temporary diagnostic workflow
        shell: powershell
        run: |
          $Path=Join-Path $env:GITHUB_WORKSPACE '.github\workflows\ddm-snoc-debug-message.yml'
          if(Test-Path -LiteralPath $Path){Remove-Item -LiteralPath $Path -Force}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if((git status --porcelain).Length -gt 0){
            git commit -m 'chore(snoc-windows): remove temporary diagnostic workflow'
            git pull --rebase origin ${{ github.head_ref }}
            git push origin HEAD:${{ github.head_ref }}
          }
