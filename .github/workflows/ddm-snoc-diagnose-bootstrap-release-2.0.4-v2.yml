name: Diagnose bootstrap release 2.0.4 v2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ddm-snoc-diagnose-bootstrap-release-2.0.4-v2.yml'

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Collect status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-status
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ddm-snoc-bootstrap-release-2.0.4-v2.yml/runs?per_page=10" \
            > release-status/bootstrap-release-runs-2.0.4-v2.json
          curl -sSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -w '\nHTTP_STATUS=%{http_code}\n' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/ddm-snoc-windows-v2.0.4" \
            > release-status/bootstrap-release-api-2.0.4-v2.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-status/bootstrap-release-runs-2.0.4-v2.json release-status/bootstrap-release-api-2.0.4-v2.txt
          git commit -m 'chore(snoc-windows): diagnostica bootstrap v2 da release 2.0.4'
          git push origin HEAD:main
