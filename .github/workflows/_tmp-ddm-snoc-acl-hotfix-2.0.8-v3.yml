name: DDM SNOC Windows ACL Hotfix 2.0.8 v3

on:
  push:
    paths:
      - '.github/workflows/_tmp-ddm-snoc-acl-hotfix-2.0.8-v3.yml'

permissions:
  contents: write

concurrency:
  group: ddm-snoc-windows-acl-hotfix-2.0.8-v3
  cancel-in-progress: false

jobs:
  hotfix:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Patch source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Repo=$env:GITHUB_WORKSPACE
          $Product=Join-Path $Repo 'windows\zabbix-agent-deployment'
          $Utf8=New-Object System.Text.UTF8Encoding($false)
          function Save([string]$Path,[string]$Text){[IO.File]::WriteAllText($Path,$Text,$Utf8)}

          $ClientPath=Join-Path $Product 'central\lib\DDM-Central-Client.ps1'
          $Raw=[IO.File]::ReadAllText($ClientPath)
          $Pattern='(?ms)function Assert-DDMCentralAcl\(\[string\]\$Path\) \{.*?\r?\n\}\r?\n\r?\n(?=function Assert-DDMShareAcl)'
          $Match=[regex]::Match($Raw,$Pattern)
          if(-not $Match.Success){throw 'Bloco Assert-DDMCentralAcl nao encontrado.'}
          $Replacement=@'
          function Convert-DDMFileSystemRightsToUInt32 {
              param([System.Security.AccessControl.FileSystemRights]$Rights)
              $Bytes=[System.BitConverter]::GetBytes([int]$Rights)
              return [System.BitConverter]::ToUInt32($Bytes,0)
          }

          function Test-DDMFileSystemRightsWriteCapable {
              param([System.Security.AccessControl.FileSystemRights]$Rights)
              [uint32]$Value=Convert-DDMFileSystemRightsToUInt32 $Rights
              [uint32]$WriteMask=0
              foreach($Right in @(
                  [System.Security.AccessControl.FileSystemRights]::WriteData,
                  [System.Security.AccessControl.FileSystemRights]::AppendData,
                  [System.Security.AccessControl.FileSystemRights]::WriteExtendedAttributes,
                  [System.Security.AccessControl.FileSystemRights]::WriteAttributes,
                  [System.Security.AccessControl.FileSystemRights]::DeleteSubdirectoriesAndFiles,
                  [System.Security.AccessControl.FileSystemRights]::Delete,
                  [System.Security.AccessControl.FileSystemRights]::ChangePermissions,
                  [System.Security.AccessControl.FileSystemRights]::TakeOwnership
              )){
                  $WriteMask=$WriteMask -bor (Convert-DDMFileSystemRightsToUInt32 $Right)
              }
              $WriteMask=$WriteMask -bor [uint32]0x40000000
              $WriteMask=$WriteMask -bor [uint32]0x10000000
              return (($Value -band $WriteMask) -ne 0)
          }

          function Assert-DDMCentralAcl([string]$Path) {
              $Acl=Get-Acl -LiteralPath $Path
              $Broad=@('S-1-1-0','S-1-5-11','S-1-5-32-545')
              foreach($Rule in @($Acl.Access)){
                  if([string]$Rule.AccessControlType -ne 'Allow'){continue}
                  try{$Sid=$Rule.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value}catch{continue}
                  $IsBroad=($Broad -contains $Sid -or $Sid -match '-513$' -or $Sid -match '-515$')
                  if(-not $IsBroad){continue}
                  $Rights=[System.Security.AccessControl.FileSystemRights]$Rule.FileSystemRights
                  if(Test-DDMFileSystemRightsWriteCapable $Rights){
                      throw "ACL insegura: $Sid possui escrita em $Path ($Rights). Contas de computador e usuarios amplos devem ter somente leitura."
                  }
              }
          }

          '@
          $Updated=$Raw.Substring(0,$Match.Index)+$Replacement+$Raw.Substring($Match.Index+$Match.Length)
          Save $ClientPath $Updated

          $TestPath=Join-Path $Product 'tools\Test-DDM-AclValidation.ps1'
          $Test=@'
          #requires -Version 5.1
          [CmdletBinding()]
          param([string]$ProductRoot)
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($ProductRoot)){$ProductRoot=Split-Path -Parent (Split-Path -Parent $MyInvocation.MyCommand.Definition)}
          $ProductRoot=(Resolve-Path -LiteralPath $ProductRoot).Path
          $script:RunRoot=Join-Path $env:TEMP ('DDM-ACL-'+[guid]::NewGuid().ToString('N'))
          $script:LogPath=Join-Path $script:RunRoot 'test.log'
          $script:Rules=@()
          New-Item $script:RunRoot -ItemType Directory -Force|Out-Null
          function Write-CentralLog{param([string]$Message,[string]$Level='INFO')}
          function Get-Acl{param([string]$LiteralPath);return New-Object PSObject -Property @{Access=@($script:Rules)}}
          function New-Rule([string]$Sid,[System.Security.AccessControl.FileSystemRights]$Rights,[string]$Type='Allow'){
              return New-Object PSObject -Property @{IdentityReference=(New-Object System.Security.Principal.SecurityIdentifier -ArgumentList $Sid);FileSystemRights=$Rights;AccessControlType=$Type;IsInherited=$true}
          }
          function From-U32([uint32]$Value){$Signed=[BitConverter]::ToInt32([BitConverter]::GetBytes($Value),0);return [System.Security.AccessControl.FileSystemRights]$Signed}
          function Expect-Safe([string]$Name,[System.Security.AccessControl.FileSystemRights]$Rights){if(Test-DDMFileSystemRightsWriteCapable $Rights){throw "Direito seguro marcado como escrita: $Name ($Rights)"}}
          function Expect-Write([string]$Name,[System.Security.AccessControl.FileSystemRights]$Rights){if(-not(Test-DDMFileSystemRightsWriteCapable $Rights)){throw "Direito de escrita nao detectado: $Name ($Rights)"}}
          try{
              . (Join-Path $ProductRoot 'lib\DDM-Common.ps1')
              . (Join-Path $ProductRoot 'central\lib\DDM-Central-Client.ps1')
              $F=[System.Security.AccessControl.FileSystemRights]
              $ReadExecSync=$F::ReadAndExecute -bor $F::Synchronize
              $ReadSync=$F::Read -bor $F::Synchronize
              Expect-Safe 'ReadAndExecute+Synchronize' $ReadExecSync
              Expect-Safe 'Read+Synchronize' $ReadSync
              Expect-Safe 'Read' $F::Read
              Expect-Safe 'ReadAndExecute' $F::ReadAndExecute
              Expect-Safe 'GENERIC_READ+GENERIC_EXECUTE' (From-U32 ([uint32]0xA0000000))
              foreach($Case in @(
                  @('WriteData',$F::WriteData),@('AppendData',$F::AppendData),
                  @('WriteExtendedAttributes',$F::WriteExtendedAttributes),@('WriteAttributes',$F::WriteAttributes),
                  @('DeleteSubdirectoriesAndFiles',$F::DeleteSubdirectoriesAndFiles),@('Delete',$F::Delete),
                  @('ChangePermissions',$F::ChangePermissions),@('TakeOwnership',$F::TakeOwnership),
                  @('Write',$F::Write),@('Modify',$F::Modify),@('FullControl',$F::FullControl),
                  @('GENERIC_WRITE',(From-U32 ([uint32]0x40000000))),
                  @('GENERIC_ALL',(From-U32 ([uint32]0x10000000)))
              )){Expect-Write ([string]$Case[0]) ([System.Security.AccessControl.FileSystemRights]$Case[1])}
              $script:Rules=@(New-Rule 'S-1-5-11' $ReadExecSync)
              Assert-DDMCentralAcl 'C:\ACL-TEST'
              $script:Rules=@(New-Rule 'S-1-5-11' $F::WriteData)
              $Blocked=$false
              try{Assert-DDMCentralAcl 'C:\ACL-TEST'}catch{if($_.Exception.Message -like 'ACL insegura:*'){$Blocked=$true}else{throw}}
              if(-not $Blocked){throw 'Authenticated Users com WriteData nao foi bloqueado.'}
              $script:Rules=@(New-Rule 'S-1-5-32-544' $F::FullControl)
              Assert-DDMCentralAcl 'C:\ACL-TEST'
              Write-Host 'ACL_VALIDATION_OK' -ForegroundColor Green
          }finally{Remove-Item $script:RunRoot -Recurse -Force -ErrorAction SilentlyContinue}
          '@
          Save $TestPath $Test

          $ConfigPath=Join-Path $Product 'config\DDM-Product.ps1'
          $Config=[IO.File]::ReadAllText($ConfigPath).Replace("ProductVersion           = '2.0.7'","ProductVersion           = '2.0.8'")
          if($Config -notmatch "ProductVersion\s*=\s*'2\.0\.8'"){throw 'Versao 2.0.8 nao aplicada.'}
          Save $ConfigPath $Config

          $RepoTestPath=Join-Path $Product 'tools\Test-DDM-Repository.ps1'
          $RepoTest=[IO.File]::ReadAllText($RepoTestPath)
          $RepoTest=$RepoTest.Replace("Assert-DDMTest (`$DDMProduct.ProductVersion -eq '2.0.7') 'ProductVersion deve ser 2.0.7.'","Assert-DDMTest (`$DDMProduct.ProductVersion -eq '2.0.8') 'ProductVersion deve ser 2.0.8.'")
          $Marker="Write-Host '7/12 Bootstrap, cache e conformidade'"
          $Insert=@'
          $AclTestPath = Join-Path $ProductRoot 'tools\Test-DDM-AclValidation.ps1'
          Assert-DDMTest (Test-Path -LiteralPath $AclTestPath) 'Teste dedicado de ACL ausente.'
          & $AclTestPath -ProductRoot $ProductRoot

          Write-Host '7/12 Bootstrap, cache e conformidade'
          '@
          if(-not $RepoTest.Contains($Marker)){throw 'Marcador de teste nao encontrado.'}
          $RepoTest=$RepoTest.Replace($Marker,$Insert.TrimEnd())
          Save $RepoTestPath $RepoTest

          $RecoveryPath=Join-Path $Product 'tools\Recover-DDM-SNOC-Central.ps1'
          $Recovery=[IO.File]::ReadAllText($RecoveryPath)
          $Recovery=$Recovery.Replace("Write-Step '5/9 - Preservando os nove itens da publicacao parcial para auditoria...'","Write-Step '5/9 - Preservando o estado atual da pasta central para auditoria...'")
          $Recovery=$Recovery.Replace('Write-Host "AD-SEED $Version validado e sem return 120." -ForegroundColor Green','Write-Host "AD-SEED $Version validado." -ForegroundColor Green')
          Save $RecoveryPath $Recovery

          $ChangelogPath=Join-Path $Product 'CHANGELOG.md'
          $Changelog=[IO.File]::ReadAllText($ChangelogPath)
          $Entry="## 2.0.8 - 2026-08-04`r`n- Corrige falso positivo ACL causado por Synchronize em ReadAndExecute.`r`n- Adiciona teste de direitos atomicos de escrita.`r`n`r`n"
          Save $ChangelogPath ($Entry+$Changelog)

          Remove-Item (Join-Path $Repo '.github\workflows\_tmp-ddm-snoc-acl-hotfix-2.0.8.yml') -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $Repo '.github\workflows\_tmp-ddm-snoc-acl-hotfix-2.0.8-v3.yml') -Force

      - name: Validate source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          & (Join-Path $Product 'tools\Test-DDM-AclValidation.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-Repository.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-RuntimeLexing.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-CentralBootstrapLoad.ps1') -ProductRoot $Product

      - name: Commit and tag
        id: source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(snoc-windows): corrige ACL Synchronize e promove 2.0.8'
          git push origin HEAD:main
          $Commit=(git rev-parse HEAD).Trim()
          "commit=$Commit"|Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $Tag='ddm-snoc-windows-v2.0.8'
          if(-not [string]::IsNullOrWhiteSpace([string](git ls-remote --tags origin "refs/tags/$Tag"))){throw "Tag ja existe: $Tag"}
          git tag -a $Tag -m 'DDM SNOC Windows 2.0.8'
          git push origin $Tag

      - name: Build assets
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Repo=$env:GITHUB_WORKSPACE;$Product=Join-Path $Repo 'windows\zabbix-agent-deployment';$Dist=Join-Path $Repo 'dist'
          $Motor=Join-Path $Dist 'DDM-SNOC-WINDOWS-MOTOR-2.0.8';$Seed=Join-Path $Dist 'DDM-SNOC-WINDOWS-AD-SEED-2.0.8'
          Remove-Item $Dist -Recurse -Force -ErrorAction SilentlyContinue;New-Item $Motor,$Seed -ItemType Directory -Force|Out-Null
          foreach($Name in @('Start-DDM-SNOC.ps1','CLIENTE.example.ps1','README.md','CHANGELOG.md')){Copy-Item (Join-Path $Product $Name) (Join-Path $Motor $Name) -Force}
          foreach($Name in @('config','lib','central','bootstrap','endpoint','engine','modules','templates','tools','docs','clients')){Copy-Item (Join-Path $Product $Name) (Join-Path $Motor $Name) -Recurse -Force}
          foreach($Name in @('ATUALIZAR-AD.cmd','VOLTAR-RELEASE.cmd')){Copy-Item (Join-Path $Product ('templates\central\'+$Name)) (Join-Path $Seed $Name) -Force}
          Copy-Item (Join-Path $Product 'CLIENTE.example.ps1') (Join-Path $Seed 'CLIENTE.example.ps1') -Force
          Copy-Item (Join-Path $Product 'docs\UPDATE-AD.md') (Join-Path $Seed 'LEIA-ME-UPDATE-AD.md') -Force
          Copy-Item (Join-Path $Product 'docs\AUDITORIA-300-PONTOS.md') (Join-Path $Seed 'AUDITORIA-300-PONTOS.md') -Force
          $Updater=Join-Path $Seed 'CENTRAL-UPDATER'
          foreach($Rel in @('central\Update-DDM-SNOC-Central.ps1','central\lib\DDM-Central-Client.ps1','central\lib\DDM-Central-Supply.ps1','central\lib\Invoke-DDM-Central-Publish.ps1','config\DDM-Product.ps1','lib\DDM-Common.ps1')){$Src=Join-Path $Product $Rel;$Dst=Join-Path $Updater $Rel;New-Item (Split-Path -Parent $Dst) -ItemType Directory -Force|Out-Null;Copy-Item $Src $Dst -Force}
          $Tool=Join-Path $Seed 'CENTRAL-TOOLS\tools\Set-DDM-CentralRelease.ps1';New-Item (Split-Path -Parent $Tool) -ItemType Directory -Force|Out-Null;Copy-Item (Join-Path $Product 'tools\Set-DDM-CentralRelease.ps1') $Tool -Force
          & (Join-Path $Product 'tools\Test-DDM-AclValidation.ps1') -ProductRoot $Updater
          $M=Join-Path $Dist 'DDM-SNOC-WINDOWS-MOTOR-2.0.8.zip';$S=Join-Path $Dist 'DDM-SNOC-WINDOWS-AD-SEED-2.0.8.zip';Compress-Archive -Path $Motor -DestinationPath $M -CompressionLevel Optimal;Compress-Archive -Path (Join-Path $Seed '*') -DestinationPath $S -CompressionLevel Optimal
          $Assets=@();foreach($Zip in @($M,$S)){$H=(Get-FileHash $Zip -Algorithm SHA256).Hash;Set-Content ($Zip+'.sha256') ($H+' *'+(Split-Path -Leaf $Zip)) -Encoding ASCII;$Assets+=New-Object PSObject -Property @{Name=(Split-Path -Leaf $Zip);Sha256=$H;Size=(Get-Item $Zip).Length}}
          $J=Join-Path $Dist 'DDM-SNOC-WINDOWS-RELEASE-MANIFEST-2.0.8.json';(New-Object PSObject -Property @{Product='DDM SNOC Windows';ProductVersion='2.0.8';GitCommit='${{ steps.source.outputs.commit }}';GitTag='ddm-snoc-windows-v2.0.8';GeneratedAtUtc=(Get-Date).ToUniversalTime().ToString('o');Assets=$Assets;AuditPoints=40;Validation=@('repository','runtime','bootstrap','acl-source','acl-seed')})|ConvertTo-Json -Depth 6|Set-Content $J -Encoding UTF8;$H=(Get-FileHash $J -Algorithm SHA256).Hash;Set-Content ($J+'.sha256') ($H+' *'+(Split-Path -Leaf $J)) -Encoding ASCII

      - name: Publish release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop';$D=Join-Path $env:GITHUB_WORKSPACE 'dist';$T='ddm-snoc-windows-v2.0.8';$M=Join-Path $D 'DDM-SNOC-WINDOWS-MOTOR-2.0.8.zip';$S=Join-Path $D 'DDM-SNOC-WINDOWS-AD-SEED-2.0.8.zip';$J=Join-Path $D 'DDM-SNOC-WINDOWS-RELEASE-MANIFEST-2.0.8.json'
          & gh release create $T $M ($M+'.sha256') $S ($S+'.sha256') $J ($J+'.sha256') --verify-tag --title 'DDM SNOC Windows 2.0.8' --notes 'Corrige falso positivo ACL Synchronize; auditoria em 40 pontos.'
          if($LASTEXITCODE -ne 0){throw "gh release create retornou $LASTEXITCODE"}
          $R=(& gh release view $T --json isDraft,isPrerelease,assets)|ConvertFrom-Json;if($R.isDraft -or $R.isPrerelease -or @($R.assets).Count -ne 6){throw 'Release invalida.'}

      - name: Record READY
        shell: powershell
        run: |
          $P=Join-Path $env:GITHUB_WORKSPACE 'release-status\ddm-snoc-windows-v2.0.8.txt';New-Item (Split-Path -Parent $P) -ItemType Directory -Force|Out-Null;Set-Content $P ('State=READY Tag=ddm-snoc-windows-v2.0.8 Commit=${{ steps.source.outputs.commit }} Assets=6 AuditPoints=40 VerifiedAtUtc='+(Get-Date).ToUniversalTime().ToString('o')) -Encoding UTF8;git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add $P;git commit -m 'chore(snoc-windows): registra 2.0.8 READY';git push origin HEAD:main

      - name: Record FAILED
        if: failure()
        shell: powershell
        run: |
          git fetch origin main;git reset --hard origin/main;$P=Join-Path $env:GITHUB_WORKSPACE 'release-status\ddm-snoc-windows-v2.0.8-v3-attempt.txt';New-Item (Split-Path -Parent $P) -ItemType Directory -Force|Out-Null;Set-Content $P ('State=FAILED RunId=${{ github.run_id }} RunAttempt=${{ github.run_attempt }} Commit=${{ github.sha }} FailedAtUtc='+(Get-Date).ToUniversalTime().ToString('o')) -Encoding UTF8;git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add $P;git commit -m 'chore(snoc-windows): registra falha v3 ACL 2.0.8';git push origin HEAD:main
