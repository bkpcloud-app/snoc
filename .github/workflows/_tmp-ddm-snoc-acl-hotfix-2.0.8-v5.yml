name: DDM SNOC Windows ACL Hotfix 2.0.8 v5

on:
  push:
    paths:
      - '.github/workflows/_tmp-ddm-snoc-acl-hotfix-2.0.8-v5.yml'

permissions:
  contents: write

concurrency:
  group: ddm-snoc-windows-acl-hotfix-2.0.8-v5
  cancel-in-progress: false

jobs:
  hotfix:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Patch source and add ACL regression
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Repo=$env:GITHUB_WORKSPACE
          $Product=Join-Path $Repo 'windows\zabbix-agent-deployment'
          $Utf8=New-Object System.Text.UTF8Encoding($false)
          function Save([string]$Path,[string]$Text){[IO.File]::WriteAllText($Path,$Text,$Utf8)}

          $ClientPath=Join-Path $Product 'central\lib\DDM-Central-Client.ps1'
          $Raw=[IO.File]::ReadAllText($ClientPath)
          $Start=$Raw.IndexOf('function Assert-DDMCentralAcl([string]$Path) {',[StringComparison]::Ordinal)
          $End=$Raw.IndexOf('function Assert-DDMShareAcl([string]$Path) {',[StringComparison]::Ordinal)
          if($Start -lt 0 -or $End -le $Start){throw 'Limites da funcao ACL nao encontrados.'}
          $Replacement=@'
          function Convert-DDMFileSystemRightsToUInt32 {
              param([System.Security.AccessControl.FileSystemRights]$Rights)
              $Bytes=[System.BitConverter]::GetBytes([int]$Rights)
              return [System.BitConverter]::ToUInt32($Bytes,0)
          }

          function Test-DDMFileSystemRightsWriteCapable {
              param([System.Security.AccessControl.FileSystemRights]$Rights)
              [uint32]$Value=Convert-DDMFileSystemRightsToUInt32 $Rights
              [uint32]$WriteMask=0
              foreach($Right in @(
                  [System.Security.AccessControl.FileSystemRights]::WriteData,
                  [System.Security.AccessControl.FileSystemRights]::AppendData,
                  [System.Security.AccessControl.FileSystemRights]::WriteExtendedAttributes,
                  [System.Security.AccessControl.FileSystemRights]::WriteAttributes,
                  [System.Security.AccessControl.FileSystemRights]::DeleteSubdirectoriesAndFiles,
                  [System.Security.AccessControl.FileSystemRights]::Delete,
                  [System.Security.AccessControl.FileSystemRights]::ChangePermissions,
                  [System.Security.AccessControl.FileSystemRights]::TakeOwnership
              )){
                  $WriteMask=$WriteMask -bor (Convert-DDMFileSystemRightsToUInt32 $Right)
              }
              $WriteMask=$WriteMask -bor [Convert]::ToUInt32('40000000',16)
              $WriteMask=$WriteMask -bor [Convert]::ToUInt32('10000000',16)
              return (($Value -band $WriteMask) -ne 0)
          }

          function Assert-DDMCentralAcl([string]$Path) {
              $Acl=Get-Acl -LiteralPath $Path
              $Broad=@('S-1-1-0','S-1-5-11','S-1-5-32-545')
              foreach($Rule in @($Acl.Access)){
                  if([string]$Rule.AccessControlType -ne 'Allow'){continue}
                  try{$Sid=$Rule.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value}catch{continue}
                  $IsBroad=($Broad -contains $Sid -or $Sid -match '-513$' -or $Sid -match '-515$')
                  if(-not $IsBroad){continue}
                  $Rights=[System.Security.AccessControl.FileSystemRights]$Rule.FileSystemRights
                  if(Test-DDMFileSystemRightsWriteCapable $Rights){
                      throw "ACL insegura: $Sid possui escrita em $Path ($Rights). Contas de computador e usuarios amplos devem ter somente leitura."
                  }
              }
          }

          '@
          Save $ClientPath ($Raw.Substring(0,$Start)+$Replacement+$Raw.Substring($End))

          $TestPath=Join-Path $Product 'tools\Test-DDM-AclValidation.ps1'
          $Test=@'
          #requires -Version 5.1
          [CmdletBinding()]
          param([string]$ProductRoot)
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($ProductRoot)){$ProductRoot=Split-Path -Parent (Split-Path -Parent $MyInvocation.MyCommand.Definition)}
          $ProductRoot=(Resolve-Path -LiteralPath $ProductRoot).Path
          $script:RunRoot=Join-Path $env:TEMP ('DDM-ACL-'+[guid]::NewGuid().ToString('N'))
          $script:LogPath=Join-Path $script:RunRoot 'test.log'
          $script:Rules=@()
          New-Item $script:RunRoot -ItemType Directory -Force|Out-Null
          function Write-CentralLog{param([string]$Message,[string]$Level='INFO')}
          function Get-Acl{param([string]$LiteralPath);return New-Object PSObject -Property @{Access=@($script:Rules)}}
          function New-Rule([string]$Sid,[System.Security.AccessControl.FileSystemRights]$Rights,[string]$Type='Allow'){
              return New-Object PSObject -Property @{IdentityReference=(New-Object System.Security.Principal.SecurityIdentifier -ArgumentList $Sid);FileSystemRights=$Rights;AccessControlType=$Type;IsInherited=$true}
          }
          function From-Hex([string]$Hex){$U=[Convert]::ToUInt32($Hex,16);$Signed=[BitConverter]::ToInt32([BitConverter]::GetBytes($U),0);return [System.Security.AccessControl.FileSystemRights]$Signed}
          function Safe([string]$Name,[System.Security.AccessControl.FileSystemRights]$Rights){if(Test-DDMFileSystemRightsWriteCapable $Rights){throw "Direito seguro marcado como escrita: $Name ($Rights)"}}
          function Unsafe([string]$Name,[System.Security.AccessControl.FileSystemRights]$Rights){if(-not(Test-DDMFileSystemRightsWriteCapable $Rights)){throw "Direito de escrita nao detectado: $Name ($Rights)"}}
          function Assert-AclSafe([string]$Name,[object[]]$Rules){$script:Rules=@($Rules);try{Assert-DDMCentralAcl 'C:\ACL-TEST'}catch{throw "ACL segura bloqueada em ${Name}: $($_.Exception.Message)"}}
          function Assert-AclBlocked([string]$Name,[object[]]$Rules){$script:Rules=@($Rules);$Blocked=$false;try{Assert-DDMCentralAcl 'C:\ACL-TEST'}catch{if($_.Exception.Message -like 'ACL insegura:*'){$Blocked=$true}else{throw}};if(-not $Blocked){throw "ACL insegura aceita em $Name"}}
          try{
              . (Join-Path $ProductRoot 'lib\DDM-Common.ps1')
              . (Join-Path $ProductRoot 'central\lib\DDM-Central-Client.ps1')
              $F=[System.Security.AccessControl.FileSystemRights]
              $ReadExecSync=$F::ReadAndExecute -bor $F::Synchronize
              $ReadSync=$F::Read -bor $F::Synchronize
              Safe 'ReadAndExecute+Synchronize' $ReadExecSync
              Safe 'Read+Synchronize' $ReadSync
              Safe 'Read' $F::Read
              Safe 'ReadAndExecute' $F::ReadAndExecute
              Safe 'GENERIC_READ+GENERIC_EXECUTE' (From-Hex 'A0000000')
              foreach($Case in @(
                  @('WriteData',$F::WriteData),@('AppendData',$F::AppendData),
                  @('WriteExtendedAttributes',$F::WriteExtendedAttributes),@('WriteAttributes',$F::WriteAttributes),
                  @('DeleteSubdirectoriesAndFiles',$F::DeleteSubdirectoriesAndFiles),@('Delete',$F::Delete),
                  @('ChangePermissions',$F::ChangePermissions),@('TakeOwnership',$F::TakeOwnership),
                  @('Write',$F::Write),@('Modify',$F::Modify),@('FullControl',$F::FullControl),
                  @('GENERIC_WRITE',(From-Hex '40000000')),@('GENERIC_ALL',(From-Hex '10000000'))
              )){Unsafe ([string]$Case[0]) ([System.Security.AccessControl.FileSystemRights]$Case[1])}
              Assert-AclSafe 'Authenticated Users ReadAndExecute+Synchronize' @(New-Rule 'S-1-5-11' $ReadExecSync)
              Assert-AclSafe 'Everyone ReadAndExecute' @(New-Rule 'S-1-1-0' $F::ReadAndExecute)
              Assert-AclSafe 'Builtin Users ReadAndExecute' @(New-Rule 'S-1-5-32-545' $ReadExecSync)
              Assert-AclSafe 'Domain Users ReadAndExecute' @(New-Rule 'S-1-5-21-1-2-3-513' $F::ReadAndExecute)
              Assert-AclSafe 'Domain Computers ReadAndExecute' @(New-Rule 'S-1-5-21-1-2-3-515' $F::ReadAndExecute)
              Assert-AclSafe 'Administrators FullControl' @(New-Rule 'S-1-5-32-544' $F::FullControl)
              Assert-AclSafe 'SYSTEM FullControl' @(New-Rule 'S-1-5-18' $F::FullControl)
              Assert-AclSafe 'Deny amplo' @(New-Rule 'S-1-5-11' $F::FullControl 'Deny')
              Assert-AclBlocked 'Authenticated Users WriteData' @(New-Rule 'S-1-5-11' $F::WriteData)
              Assert-AclBlocked 'Everyone Modify' @(New-Rule 'S-1-1-0' $F::Modify)
              Assert-AclBlocked 'Builtin Users CreateDirectories' @(New-Rule 'S-1-5-32-545' $F::CreateDirectories)
              Assert-AclBlocked 'Domain Users FullControl' @(New-Rule 'S-1-5-21-1-2-3-513' $F::FullControl)
              Assert-AclBlocked 'Domain Computers Write' @(New-Rule 'S-1-5-21-1-2-3-515' $F::Write)
              Write-Host 'ACL_VALIDATION_OK' -ForegroundColor Green
          }finally{Remove-Item $script:RunRoot -Recurse -Force -ErrorAction SilentlyContinue}
          '@
          Save $TestPath $Test

          $ConfigPath=Join-Path $Product 'config\DDM-Product.ps1'
          $Config=[IO.File]::ReadAllText($ConfigPath).Replace("ProductVersion           = '2.0.7'","ProductVersion           = '2.0.8'")
          if($Config -notmatch "ProductVersion\s*=\s*'2\.0\.8'"){throw 'Versao 2.0.8 nao aplicada.'}
          Save $ConfigPath $Config

          $RepoTestPath=Join-Path $Product 'tools\Test-DDM-Repository.ps1'
          $RepoTest=[IO.File]::ReadAllText($RepoTestPath)
          $RepoTest=$RepoTest.Replace("Assert-DDMTest (`$DDMProduct.ProductVersion -eq '2.0.7') 'ProductVersion deve ser 2.0.7.'","Assert-DDMTest (`$DDMProduct.ProductVersion -eq '2.0.8') 'ProductVersion deve ser 2.0.8.'")
          $Marker="Write-Host '7/12 Bootstrap, cache e conformidade'"
          $Insert=@'
          $AclTestPath = Join-Path $ProductRoot 'tools\Test-DDM-AclValidation.ps1'
          Assert-DDMTest (Test-Path -LiteralPath $AclTestPath) 'Teste dedicado de ACL ausente.'
          & $AclTestPath -ProductRoot $ProductRoot

          Write-Host '7/12 Bootstrap, cache e conformidade'
          '@
          if(-not $RepoTest.Contains($Marker)){throw 'Marcador de teste ACL nao encontrado.'}
          $RepoTest=$RepoTest.Replace($Marker,$Insert.TrimEnd())
          Save $RepoTestPath $RepoTest

          $RecoveryPath=Join-Path $Product 'tools\Recover-DDM-SNOC-Central.ps1'
          $Recovery=[IO.File]::ReadAllText($RecoveryPath)
          $Recovery=$Recovery.Replace("Write-Step '5/9 - Preservando os nove itens da publicacao parcial para auditoria...'","Write-Step '5/9 - Preservando o estado atual da pasta central para auditoria...'")
          $Recovery=$Recovery.Replace('Write-Host "AD-SEED $Version validado e sem return 120." -ForegroundColor Green','Write-Host "AD-SEED $Version validado." -ForegroundColor Green')
          Save $RecoveryPath $Recovery

          $AuditPath=Join-Path $Product 'docs\AUDITORIA-MIZU-ACL-40-PONTOS.md'
          $Audit=@(
          '# Auditoria Mizu - ACL e bootstrap central - 40 pontos','',
          '01 | OK | Backup original com 33 arquivos preservado.','02 | OK | ZIP do backup original preservado.',
          '03 | OK | Rollback restaurou os 33 arquivos.','04 | OK | Pasta raiz foi preservada.',
          '05 | OK | ACL raiz foi preservada.','06 | OK | Estados parciais foram arquivados.',
          '07 | OK | Release exige seis assets.','08 | OK | AD-SEED exige SHA-256.',
          '09 | OK | CLIENTE.ps1 exige hash do catalogo.','10 | OK | Tag, asset e versao interna devem coincidir.',
          '11 | OK | DDM-Common carrega antes do fornecedor.','12 | OK | Get-DDMSha256 existe antes do download.',
          '13 | OK | Comandos colados sao bloqueados.','14 | CORRIGIDO | Synchronize nao e escrita.',
          '15 | CORRIGIDO | Modify saiu da mascara.','16 | CORRIGIDO | FullControl saiu da mascara.',
          '17 | OK | WriteData e bloqueado.','18 | OK | AppendData e bloqueado.',
          '19 | OK | WriteExtendedAttributes e bloqueado.','20 | OK | WriteAttributes e bloqueado.',
          '21 | OK | DeleteSubdirectoriesAndFiles e bloqueado.','22 | OK | Delete e bloqueado.',
          '23 | OK | ChangePermissions e bloqueado.','24 | OK | TakeOwnership e bloqueado.',
          '25 | OK | GENERIC_WRITE e bloqueado.','26 | OK | GENERIC_ALL e bloqueado.',
          '27 | OK | Authenticated Users com leitura e aceito.','28 | OK | Everyone com leitura e aceito.',
          '29 | OK | Builtin Users com leitura e aceito.','30 | OK | Domain Users com leitura e aceito.',
          '31 | OK | Domain Computers com leitura e aceito.','32 | OK | Administrators FullControl e aceito.',
          '33 | OK | SYSTEM FullControl e aceito.','34 | OK | Deny nao concede escrita.',
          '35 | OK | ACL NTFS e SMB sao separadas.','36 | CORRIGIDO | Mensagem nao usa nove itens fixos.',
          '37 | OK | Teste ACL roda no fonte.','38 | OK | Teste ACL roda no AD-SEED.',
          '39 | OK | Tarefa so e criada apos CURRENT valido.','40 | OK | Qualquer falha restaura o original.'
          ) -join "`r`n"
          Save $AuditPath $Audit

          $ChangelogPath=Join-Path $Product 'CHANGELOG.md'
          $Changelog=[IO.File]::ReadAllText($ChangelogPath)
          Save $ChangelogPath ("## 2.0.8 - 2026-08-04`r`n- Corrige falso positivo ACL causado por Synchronize em ReadAndExecute.`r`n- Adiciona regressao ACL e auditoria Mizu em 40 pontos.`r`n`r`n"+$Changelog)

          Remove-Item (Join-Path $Repo '.github\workflows\_tmp-ddm-snoc-acl-hotfix-2.0.8*.yml') -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $Repo 'release-status\ddm-snoc-windows-v2.0.8*-attempt.txt') -Force -ErrorAction SilentlyContinue

      - name: Validate source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          & (Join-Path $Product 'tools\Test-DDM-AclValidation.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-Repository.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-RuntimeLexing.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-CentralBootstrapLoad.ps1') -ProductRoot $Product

      - name: Commit validated source
        id: source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(snoc-windows): corrige ACL Synchronize e promove 2.0.8'
          git push origin HEAD:main
          $Commit=(git rev-parse HEAD).Trim()
          "commit=$Commit"|Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build and validate assets
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Repo=$env:GITHUB_WORKSPACE;$Product=Join-Path $Repo 'windows\zabbix-agent-deployment';$Dist=Join-Path $Repo 'dist'
          $Motor=Join-Path $Dist 'DDM-SNOC-WINDOWS-MOTOR-2.0.8';$Seed=Join-Path $Dist 'DDM-SNOC-WINDOWS-AD-SEED-2.0.8'
          Remove-Item $Dist -Recurse -Force -ErrorAction SilentlyContinue;New-Item $Motor,$Seed -ItemType Directory -Force|Out-Null
          foreach($Name in @('Start-DDM-SNOC.ps1','CLIENTE.example.ps1','README.md','CHANGELOG.md')){Copy-Item (Join-Path $Product $Name) (Join-Path $Motor $Name) -Force}
          foreach($Name in @('config','lib','central','bootstrap','endpoint','engine','modules','templates','tools','docs','clients')){Copy-Item (Join-Path $Product $Name) (Join-Path $Motor $Name) -Recurse -Force}
          foreach($Name in @('ATUALIZAR-AD.cmd','VOLTAR-RELEASE.cmd')){Copy-Item (Join-Path $Product ('templates\central\'+$Name)) (Join-Path $Seed $Name) -Force}
          Copy-Item (Join-Path $Product 'CLIENTE.example.ps1') (Join-Path $Seed 'CLIENTE.example.ps1') -Force
          Copy-Item (Join-Path $Product 'docs\UPDATE-AD.md') (Join-Path $Seed 'LEIA-ME-UPDATE-AD.md') -Force
          Copy-Item (Join-Path $Product 'docs\AUDITORIA-300-PONTOS.md') (Join-Path $Seed 'AUDITORIA-300-PONTOS.md') -Force
          Copy-Item (Join-Path $Product 'docs\AUDITORIA-MIZU-ACL-40-PONTOS.md') (Join-Path $Seed 'AUDITORIA-MIZU-ACL-40-PONTOS.md') -Force
          $Updater=Join-Path $Seed 'CENTRAL-UPDATER'
          foreach($Rel in @('central\Update-DDM-SNOC-Central.ps1','central\lib\DDM-Central-Client.ps1','central\lib\DDM-Central-Supply.ps1','central\lib\Invoke-DDM-Central-Publish.ps1','config\DDM-Product.ps1','lib\DDM-Common.ps1')){$Src=Join-Path $Product $Rel;$Dst=Join-Path $Updater $Rel;New-Item (Split-Path -Parent $Dst) -ItemType Directory -Force|Out-Null;Copy-Item $Src $Dst -Force}
          $Tool=Join-Path $Seed 'CENTRAL-TOOLS\tools\Set-DDM-CentralRelease.ps1';New-Item (Split-Path -Parent $Tool) -ItemType Directory -Force|Out-Null;Copy-Item (Join-Path $Product 'tools\Set-DDM-CentralRelease.ps1') $Tool -Force
          & (Join-Path $Product 'tools\Test-DDM-AclValidation.ps1') -ProductRoot $Updater
          $M=Join-Path $Dist 'DDM-SNOC-WINDOWS-MOTOR-2.0.8.zip';$S=Join-Path $Dist 'DDM-SNOC-WINDOWS-AD-SEED-2.0.8.zip';Compress-Archive -Path $Motor -DestinationPath $M -CompressionLevel Optimal;Compress-Archive -Path (Join-Path $Seed '*') -DestinationPath $S -CompressionLevel Optimal
          $Expanded=Join-Path $env:RUNNER_TEMP 'motor-expanded';Expand-Archive $M $Expanded -Force;$EP=Join-Path $Expanded 'DDM-SNOC-WINDOWS-MOTOR-2.0.8';$Fake=Split-Path -Parent (Split-Path -Parent $EP);$WF=Join-Path $Fake '.github\workflows';New-Item $WF -ItemType Directory -Force|Out-Null;Copy-Item (Join-Path $Repo '.github\workflows\ddm-snoc-windows-validation.yml') $WF -Force;Copy-Item (Join-Path $Repo '.github\workflows\ddm-snoc-windows-release.yml') $WF -Force;& (Join-Path $EP 'tools\Test-DDM-Repository.ps1') -ProductRoot $EP
          $Assets=@();foreach($Zip in @($M,$S)){$H=(Get-FileHash $Zip -Algorithm SHA256).Hash;Set-Content ($Zip+'.sha256') ($H+' *'+(Split-Path -Leaf $Zip)) -Encoding ASCII;$Assets+=New-Object PSObject -Property @{Name=(Split-Path -Leaf $Zip);Sha256=$H;Size=(Get-Item $Zip).Length}}
          $J=Join-Path $Dist 'DDM-SNOC-WINDOWS-RELEASE-MANIFEST-2.0.8.json';(New-Object PSObject -Property @{Product='DDM SNOC Windows';ProductVersion='2.0.8';GitCommit='${{ steps.source.outputs.commit }}';GitTag='ddm-snoc-windows-v2.0.8';GeneratedAtUtc=(Get-Date).ToUniversalTime().ToString('o');Assets=$Assets;AuditPoints=40;Validation=@('repository','runtime','bootstrap','acl-source','acl-seed','expanded-motor')})|ConvertTo-Json -Depth 6|Set-Content $J -Encoding UTF8;$H=(Get-FileHash $J -Algorithm SHA256).Hash;Set-Content ($J+'.sha256') ($H+' *'+(Split-Path -Leaf $J)) -Encoding ASCII

      - name: Tag, publish and verify release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop';$Tag='ddm-snoc-windows-v2.0.8';if(-not [string]::IsNullOrWhiteSpace([string](git ls-remote --tags origin "refs/tags/$Tag"))){throw "Tag ja existe: $Tag"};git tag -a $Tag -m 'DDM SNOC Windows 2.0.8';git push origin $Tag
          $D=Join-Path $env:GITHUB_WORKSPACE 'dist';$M=Join-Path $D 'DDM-SNOC-WINDOWS-MOTOR-2.0.8.zip';$S=Join-Path $D 'DDM-SNOC-WINDOWS-AD-SEED-2.0.8.zip';$J=Join-Path $D 'DDM-SNOC-WINDOWS-RELEASE-MANIFEST-2.0.8.json'
          & gh release create $Tag $M ($M+'.sha256') $S ($S+'.sha256') $J ($J+'.sha256') --verify-tag --title 'DDM SNOC Windows 2.0.8' --notes 'Corrige falso positivo ACL Synchronize; auditoria Mizu em 40 pontos.'
          if($LASTEXITCODE -ne 0){throw "gh release create retornou $LASTEXITCODE"}
          $R=(& gh release view $Tag --json isDraft,isPrerelease,assets,targetCommitish)|ConvertFrom-Json;if($R.isDraft -or $R.isPrerelease -or @($R.assets).Count -ne 6){throw 'Release 2.0.8 invalida.'}

      - name: Record READY
        shell: powershell
        run: |
          $P=Join-Path $env:GITHUB_WORKSPACE 'release-status\ddm-snoc-windows-v2.0.8.txt';New-Item (Split-Path -Parent $P) -ItemType Directory -Force|Out-Null;Set-Content $P ('State=READY Tag=ddm-snoc-windows-v2.0.8 Commit=${{ steps.source.outputs.commit }} Assets=6 AuditPoints=40 VerifiedAtUtc='+(Get-Date).ToUniversalTime().ToString('o')) -Encoding UTF8;git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add $P;git commit -m 'chore(snoc-windows): registra 2.0.8 READY';git push origin HEAD:main

      - name: Record FAILED
        if: failure()
        shell: powershell
        run: |
          git fetch origin main;git reset --hard origin/main;$P=Join-Path $env:GITHUB_WORKSPACE 'release-status\ddm-snoc-windows-v2.0.8-v5-attempt.txt';New-Item (Split-Path -Parent $P) -ItemType Directory -Force|Out-Null;Set-Content $P ('State=FAILED RunId=${{ github.run_id }} Commit=${{ github.sha }} FailedAtUtc='+(Get-Date).ToUniversalTime().ToString('o')) -Encoding UTF8;git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add $P;git commit -m 'chore(snoc-windows): registra falha v5 ACL 2.0.8';git push origin HEAD:main
