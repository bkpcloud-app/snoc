name: Promote DDM SNOC Windows 2.0.26 SRV-AE

on:
  pull_request:
    paths:
      - 'windows/zabbix-agent-deployment/**'
      - '.github/workflows/promote-ddm-snoc-windows-2.0.26-srv-ae.yml'

permissions:
  contents: write

concurrency:
  group: ddm-snoc-windows-2.0.26-srv-ae
  cancel-in-progress: false

jobs:
  validate-and-materialize:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact hotfix branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/ddm-snoc-windows-2.0.26-srv-ae
          fetch-depth: 0

      - name: Materialize exact pilot fixes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Patch=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment\tools\Promote-DDM-SNOC-2.0.26.ps1'
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $Patch -RepositoryRoot $env:GITHUB_WORKSPACE
          if($LASTEXITCODE -ne 0){throw "Promotion patch returned $LASTEXITCODE"}

      - name: Parse all PowerShell sources
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Root=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          foreach($File in @(Get-ChildItem $Root -Filter '*.ps1' -Recurse)){
            $Tokens=$null;$Errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile($File.FullName,[ref]$Tokens,[ref]$Errors)
            if(@($Errors).Count -gt 0){throw (@($Errors|ForEach-Object{"$($File.FullName) L$($_.Extent.StartLineNumber): $($_.Message)"}) -join "`r`n")}
          }

      - name: Execute 240 migration scenarios on source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $global:ProductCode='$ProductCode'
          $Script=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment\tools\Test-DDM-SNOC-Migration-240Scenarios.ps1'
          $Output=Join-Path $env:RUNNER_TEMP 'DDM-SNOC-MIGRATION-240-2.0.26-SOURCE'
          & $Script -RepositoryRoot $env:GITHUB_WORKSPACE -OutputDirectory $Output
          if(-not $?){throw '240 source scenarios failed.'}
          "SOURCE_240=$Output" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Execute complete product validation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          foreach($Test in @(
            'Test-DDM-Repository.ps1',
            'Test-DDM-RuntimeLexing.ps1',
            'Test-DDM-CentralBootstrapLoad.ps1',
            'Test-DDM-AclValidation.ps1',
            'Test-DDM-UncCmd.ps1',
            'Test-DDM-ForceRefresh.ps1',
            'Test-DDM-CentralRecovery.ps1',
            'Test-DDM-CentralPathIdentity.ps1',
            'Test-DDM-BootstrapFirstInstall.ps1'
          )){
            Write-Host "RUN=$Test"
            & (Join-Path $Product ('tools\'+$Test)) -ProductRoot $Product
            if(-not $?){throw "$Test failed."}
          }

      - name: Build and inspect final MOTOR with 240 scenarios
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          . (Join-Path $Product 'config\DDM-Product.ps1')
          if([string]$DDMProduct.ProductVersion -ne '2.0.26'){throw "Unexpected version $($DDMProduct.ProductVersion)"}
          $Dist=Join-Path $env:RUNNER_TEMP 'DDM-SNOC-2.0.26-DIST'
          $Motor=Join-Path $Dist 'DDM-SNOC-WINDOWS-MOTOR-2.0.26'
          $Zip=Join-Path $Dist 'DDM-SNOC-WINDOWS-MOTOR-2.0.26.zip'
          $FinalRepo=Join-Path $env:RUNNER_TEMP 'DDM-SNOC-2.0.26-FINAL-REPO'
          Remove-Item $Dist,$FinalRepo -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $Motor -ItemType Directory -Force|Out-Null
          foreach($Name in @('Start-DDM-SNOC.ps1','CLIENTE.example.ps1','README.md','CHANGELOG.md')){Copy-Item (Join-Path $Product $Name) (Join-Path $Motor $Name) -Force}
          foreach($Name in @('config','lib','central','bootstrap','endpoint','engine','modules','templates','tools','docs','clients')){Copy-Item (Join-Path $Product $Name) (Join-Path $Motor $Name) -Recurse -Force}
          Compress-Archive -Path $Motor -DestinationPath $Zip -CompressionLevel Optimal
          $FinalProduct=Join-Path $FinalRepo 'windows\zabbix-agent-deployment'
          New-Item (Split-Path -Parent $FinalProduct) -ItemType Directory -Force|Out-Null
          Expand-Archive -LiteralPath $Zip -DestinationPath $Dist\expanded -Force
          Copy-Item (Join-Path $Dist 'expanded\DDM-SNOC-WINDOWS-MOTOR-2.0.26') $FinalProduct -Recurse -Force
          $WorkflowRoot=Join-Path $FinalRepo '.github\workflows';New-Item $WorkflowRoot -ItemType Directory -Force|Out-Null
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE '.github\workflows\ddm-snoc-windows-validation.yml') $WorkflowRoot -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE '.github\workflows\ddm-snoc-windows-release.yml') $WorkflowRoot -Force
          & (Join-Path $FinalProduct 'tools\Test-DDM-Repository.ps1') -ProductRoot $FinalProduct
          if(-not $?){throw 'Final MOTOR repository validation failed.'}
          $global:ProductCode='$ProductCode'
          $Final240=Join-Path $env:RUNNER_TEMP 'DDM-SNOC-MIGRATION-240-2.0.26-FINAL'
          & (Join-Path $FinalProduct 'tools\Test-DDM-SNOC-Migration-240Scenarios.ps1') -RepositoryRoot $FinalRepo -OutputDirectory $Final240
          if(-not $?){throw '240 final MOTOR scenarios failed.'}
          $SourceHash=(Get-FileHash (Join-Path $Product 'engine\Install-DDM-Zabbix-Windows.ps1') -Algorithm SHA256).Hash.ToUpperInvariant()
          $FinalHash=(Get-FileHash (Join-Path $FinalProduct 'engine\Install-DDM-Zabbix-Windows.ps1') -Algorithm SHA256).Hash.ToUpperInvariant()
          if($SourceHash -ne $FinalHash){throw "Engine changed during packaging. Source=$SourceHash Final=$FinalHash"}
          Write-Host "ENGINE_SHA256=$FinalHash"
          "FINAL_240=$Final240" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "FINAL_MOTOR_ZIP=$Zip" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Commit only validated 2.0.26 source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'bkpcloud-app'
          git config user.email 'actions@users.noreply.github.com'
          git add windows/zabbix-agent-deployment/engine/Install-DDM-Zabbix-Windows.ps1
          git add windows/zabbix-agent-deployment/config/DDM-Product.ps1
          git add windows/zabbix-agent-deployment/tools/Test-DDM-Repository.ps1
          git add windows/zabbix-agent-deployment/CHANGELOG.md
          git add windows/zabbix-agent-deployment/docs/RELEASE-2.0.26.md
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0){Write-Host 'VALIDATED_SOURCE_ALREADY_COMMITTED';exit 0}
          git commit -m 'fix(windows): corrigir piloto SRV-AE na versao 2.0.26'
          if($LASTEXITCODE -ne 0){throw 'git commit failed.'}
          git push origin HEAD:fix/ddm-snoc-windows-2.0.26-srv-ae
          if($LASTEXITCODE -ne 0){throw 'git push failed.'}

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: DDM-SNOC-WINDOWS-2.0.26-SRV-AE-VALIDATION
          path: |
            ${{ env.SOURCE_240 }}
            ${{ env.FINAL_240 }}
            ${{ env.FINAL_MOTOR_ZIP }}
            windows/zabbix-agent-deployment/engine/Install-DDM-Zabbix-Windows.ps1
            windows/zabbix-agent-deployment/config/DDM-Product.ps1
            windows/zabbix-agent-deployment/tools/Test-DDM-Repository.ps1
          if-no-files-found: warn
          retention-days: 30
