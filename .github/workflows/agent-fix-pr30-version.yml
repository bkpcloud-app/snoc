name: Fix PR30 2.0.18 Version Assertion

on:
  push:
    branches:
      - agent/central-root-backups-2.0.18
    paths:
      - '.github/workflows/agent-fix-pr30-version.yml'

permissions:
  contents: write

jobs:
  fix-version-assertion:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/central-root-backups-2.0.18
          fetch-depth: 0

      - name: Promote repository assertion and remove temporary workflow
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Path = Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment\tools\Test-DDM-Repository.ps1'
          $Text = [IO.File]::ReadAllText($Path)
          $OldAssertion = "ProductVersion -eq '2.0.17'"
          $NewAssertion = "ProductVersion -eq '2.0.18'"
          $OldMessage = 'ProductVersion deve ser 2.0.17.'
          $NewMessage = 'ProductVersion deve ser 2.0.18.'
          if ([regex]::Matches($Text, [regex]::Escape($OldAssertion)).Count -ne 1) {
              throw 'Assercao antiga de versao nao foi encontrada exatamente uma vez.'
          }
          if ([regex]::Matches($Text, [regex]::Escape($OldMessage)).Count -ne 1) {
              throw 'Mensagem antiga de versao nao foi encontrada exatamente uma vez.'
          }
          $Text = $Text.Replace($OldAssertion, $NewAssertion).Replace($OldMessage, $NewMessage)
          [IO.File]::WriteAllText($Path, $Text, (New-Object Text.UTF8Encoding($false)))
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE '.github\workflows\agent-fix-pr30-version.yml') -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'windows/zabbix-agent-deployment/tools/Test-DDM-Repository.ps1' '.github/workflows/agent-fix-pr30-version.yml'
          git commit -m 'test(windows): validate product version 2.0.18'
          git push origin HEAD:agent/central-root-backups-2.0.18
