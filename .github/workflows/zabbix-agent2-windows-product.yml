name: Validate Zabbix Agent 2 Windows product

on:
  pull_request:
    paths:
      - "windows/zabbix-agent-deployment/**"
      - ".github/workflows/zabbix-agent2-windows-product.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-agent2-package:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse all PowerShell sources
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $parseErrors = @()

          Get-ChildItem "windows\zabbix-agent-deployment" -Recurse -Filter *.ps1 | ForEach-Object {
              $tokens = $null
              $syntaxErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$syntaxErrors) | Out-Null
              foreach ($parseError in @($syntaxErrors)) {
                  $parseErrors += "$($_.FullName): $($parseError.Message)"
              }
          }

          if ($parseErrors.Count -gt 0) {
              throw "PowerShell syntax errors:`r`n$($parseErrors -join "`r`n")"
          }

      - name: Build and validate base Agent 2 package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $productRoot = Resolve-Path "windows\zabbix-agent-deployment"
          $packageRoot = Join-Path $env:RUNNER_TEMP "BKPCloud-Zabbix-Agent2-Base"

          if (Test-Path -LiteralPath $packageRoot) {
              Remove-Item -LiteralPath $packageRoot -Recurse -Force
          }
          New-Item -Path $packageRoot -ItemType Directory -Force | Out-Null
          Copy-Item -Path (Join-Path $productRoot "base-package\*") -Destination $packageRoot -Recurse -Force

          & (Join-Path $productRoot "tools\Restore-SplitFiles.ps1") -PackageRoot $packageRoot -RemoveParts
          & (Join-Path $productRoot "tools\Get-Zabbix-Agent-MSI.ps1") -PackageRoot $packageRoot
          & (Join-Path $productRoot "tools\Test-BKPCloud-Zabbix-Package.ps1") -PackageRoot $packageRoot -AllowBasePackage

          Write-Host "Agent 2 package validated on Windows runner." -ForegroundColor Green
