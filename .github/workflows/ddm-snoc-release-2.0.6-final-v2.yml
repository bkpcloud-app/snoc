name: Publish Final DDM SNOC Windows 2.0.6 V2

on:
  push:
    paths:
      - '.github/workflows/ddm-snoc-release-2.0.6-final-v2.yml'

permissions:
  contents: write

concurrency:
  group: ddm-snoc-windows-release-2.0.6-final-v2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: main

      - name: Validate build publish and verify
        shell: powershell
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $Result=Join-Path $env:GITHUB_WORKSPACE 'release-2.0.6-v2-result.txt'
          try{
            $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
            . (Join-Path $Product 'config\DDM-Product.ps1')
            if($DDMProduct.ProductVersion -ne '2.0.6'){throw "Versao inesperada: $($DDMProduct.ProductVersion)"}

            foreach($File in @(Get-ChildItem $Product -Filter '*.ps1' -Recurse)){
              $Tokens=$null;$Errors=$null
              [void][Management.Automation.Language.Parser]::ParseFile($File.FullName,[ref]$Tokens,[ref]$Errors)
              if(@($Errors).Count -gt 0){throw "$($File.FullName): $(@($Errors.Message)-join ' | ')"}
            }
            & (Join-Path $Product 'tools\Test-DDM-Repository.ps1') -ProductRoot $Product
            & (Join-Path $Product 'tools\Test-DDM-RuntimeLexing.ps1') -ProductRoot $Product

            $Dist=Join-Path $env:GITHUB_WORKSPACE 'dist-v2'
            $Motor=Join-Path $Dist 'DDM-SNOC-WINDOWS-MOTOR-2.0.6'
            $Seed=Join-Path $Dist 'DDM-SNOC-WINDOWS-AD-SEED-2.0.6'
            Remove-Item $Dist -Recurse -Force -ErrorAction SilentlyContinue
            New-Item $Motor,$Seed -ItemType Directory -Force | Out-Null

            foreach($Name in @('Start-DDM-SNOC.ps1','CLIENTE.example.ps1','README.md','CHANGELOG.md')){Copy-Item (Join-Path $Product $Name) (Join-Path $Motor $Name) -Force}
            foreach($Name in @('config','lib','central','bootstrap','endpoint','engine','modules','templates','tools','docs','clients')){Copy-Item (Join-Path $Product $Name) (Join-Path $Motor $Name) -Recurse -Force}
            foreach($Name in @('ATUALIZAR-AD.cmd','VOLTAR-RELEASE.cmd')){Copy-Item (Join-Path $Product ('templates\central\'+$Name)) (Join-Path $Seed $Name) -Force}
            Copy-Item (Join-Path $Product 'CLIENTE.example.ps1') (Join-Path $Seed 'CLIENTE.example.ps1') -Force
            Copy-Item (Join-Path $Product 'docs\UPDATE-AD.md') (Join-Path $Seed 'LEIA-ME-UPDATE-AD.md') -Force
            Copy-Item (Join-Path $Product 'docs\AUDITORIA-300-PONTOS.md') (Join-Path $Seed 'AUDITORIA-300-PONTOS.md') -Force

            $Updater=Join-Path $Seed 'CENTRAL-UPDATER'
            foreach($Rel in @('central\Update-DDM-SNOC-Central.ps1','central\lib\DDM-Central-Client.ps1','central\lib\DDM-Central-Supply.ps1','central\lib\Invoke-DDM-Central-Publish.ps1','config\DDM-Product.ps1','lib\DDM-Common.ps1')){
              $Source=Join-Path $Product $Rel
              $Destination=Join-Path $Updater $Rel
              New-Item (Split-Path -Parent $Destination) -ItemType Directory -Force | Out-Null
              Copy-Item $Source $Destination -Force
            }
            $Rollback=Join-Path $Seed 'CENTRAL-TOOLS\tools\Set-DDM-CentralRelease.ps1'
            New-Item (Split-Path -Parent $Rollback) -ItemType Directory -Force | Out-Null
            Copy-Item (Join-Path $Product 'tools\Set-DDM-CentralRelease.ps1') $Rollback -Force

            $MotorZip=Join-Path $Dist 'DDM-SNOC-WINDOWS-MOTOR-2.0.6.zip'
            $SeedZip=Join-Path $Dist 'DDM-SNOC-WINDOWS-AD-SEED-2.0.6.zip'
            Compress-Archive -Path $Motor -DestinationPath $MotorZip -CompressionLevel Optimal
            Compress-Archive -Path (Join-Path $Seed '*') -DestinationPath $SeedZip -CompressionLevel Optimal

            $Assets=@()
            foreach($Zip in @($MotorZip,$SeedZip)){
              $Hash=(Get-FileHash $Zip -Algorithm SHA256).Hash
              Set-Content -LiteralPath ($Zip+'.sha256') -Value ($Hash+' *'+(Split-Path -Leaf $Zip)) -Encoding ASCII
              $Assets+=New-Object PSObject -Property @{Name=(Split-Path -Leaf $Zip);Sha256=$Hash;Size=(Get-Item $Zip).Length}
            }

            $Sha=(git rev-parse HEAD).Trim()
            $Tag='ddm-snoc-windows-v2.0.6'
            $Manifest=New-Object PSObject -Property @{
              Product=$DDMProduct.ProductName
              ProductVersion='2.0.6'
              GitCommit=$Sha
              GitTag=$Tag
              GeneratedAtUtc=(Get-Date).ToUniversalTime().ToString('o')
              Assets=$Assets
              Validation=@('PowerShell parser','300-control audit','runtime HTTP mocks','glued-command scan','expanded motor validation')
              ExternalPilotsRequired=$true
            }
            $ManifestPath=Join-Path $Dist 'DDM-SNOC-WINDOWS-RELEASE-MANIFEST-2.0.6.json'
            $Manifest | ConvertTo-Json -Depth 6 | Set-Content $ManifestPath -Encoding UTF8
            $ManifestHash=(Get-FileHash $ManifestPath -Algorithm SHA256).Hash
            Set-Content ($ManifestPath+'.sha256') -Value ($ManifestHash+' *'+(Split-Path -Leaf $ManifestPath)) -Encoding ASCII

            $Expanded=Join-Path $env:RUNNER_TEMP 'ddm-2.0.6-final-v2-expanded'
            Remove-Item $Expanded -Recurse -Force -ErrorAction SilentlyContinue
            Expand-Archive $MotorZip $Expanded -Force
            $ExpandedProduct=Join-Path $Expanded 'DDM-SNOC-WINDOWS-MOTOR-2.0.6'
            $ExpandedRepoRoot=Split-Path -Parent (Split-Path -Parent $ExpandedProduct)
            $ExpandedWorkflowRoot=Join-Path $ExpandedRepoRoot '.github\workflows'
            New-Item $ExpandedWorkflowRoot -ItemType Directory -Force | Out-Null
            Copy-Item (Join-Path $env:GITHUB_WORKSPACE '.github\workflows\ddm-snoc-windows-validation.yml') $ExpandedWorkflowRoot -Force
            Copy-Item (Join-Path $env:GITHUB_WORKSPACE '.github\workflows\ddm-snoc-windows-release.yml') $ExpandedWorkflowRoot -Force
            & (Join-Path $ExpandedProduct 'tools\Test-DDM-Repository.ps1') -ProductRoot $ExpandedProduct
            & (Join-Path $ExpandedProduct 'tools\Test-DDM-RuntimeLexing.ps1') -ProductRoot $ExpandedProduct

            git show-ref --tags --verify --quiet ('refs/tags/'+$Tag)
            if($LASTEXITCODE -eq 0){
              $Existing=(git rev-list -n 1 $Tag).Trim()
              if($Existing -ne $Sha){throw "Tag $Tag ja existe em outro commit: $Existing"}
            }else{
              git tag $Tag $Sha
              git push origin ('refs/tags/'+$Tag)
            }

            $Files=@($MotorZip,$MotorZip+'.sha256',$SeedZip,$SeedZip+'.sha256',$ManifestPath,$ManifestPath+'.sha256')
            gh release view $Tag 2>$null
            if($LASTEXITCODE -eq 0){gh release delete $Tag --yes}
            gh release create $Tag @Files --verify-tag --generate-notes --title 'DDM SNOC Windows 2.0.6'

            $Release=(gh release view $Tag --json tagName,isDraft,isPrerelease,assets | ConvertFrom-Json)
            $Expected=@('DDM-SNOC-WINDOWS-MOTOR-2.0.6.zip','DDM-SNOC-WINDOWS-MOTOR-2.0.6.zip.sha256','DDM-SNOC-WINDOWS-AD-SEED-2.0.6.zip','DDM-SNOC-WINDOWS-AD-SEED-2.0.6.zip.sha256','DDM-SNOC-WINDOWS-RELEASE-MANIFEST-2.0.6.json','DDM-SNOC-WINDOWS-RELEASE-MANIFEST-2.0.6.json.sha256')
            $Actual=@($Release.assets | ForEach-Object {$_.name})
            if($Release.isDraft -or $Release.isPrerelease){throw 'Release publicada como draft ou prerelease.'}
            foreach($Name in $Expected){if($Actual -notcontains $Name){throw "Asset ausente: $Name"}}
            if($Actual.Count -ne 6){throw "Quantidade inesperada de assets: $($Actual.Count)"}

            "State=READY Tag=$Tag Commit=$Sha VerifiedAtUtc=$((Get-Date).ToUniversalTime().ToString('o')) Assets=$($Actual -join '|') Message=Release estavel validada com seis assets oficiais." | Set-Content $Result -Encoding UTF8
          }
          catch{
            $Message=$_.Exception.ToString().Replace("`r",' ').Replace("`n",' ')
            "State=FAILED Commit=$(git rev-parse HEAD) VerifiedAtUtc=$((Get-Date).ToUniversalTime().ToString('o')) Message=$Message" | Set-Content $Result -Encoding UTF8
            $_ | Format-List * -Force | Out-Host
            exit 1
          }

      - name: Publish final V2 status
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Source=Join-Path $env:GITHUB_WORKSPACE 'release-2.0.6-v2-result.txt'
          if(-not(Test-Path $Source)){"State=FAILED Message=Workflow sem resultado." | Set-Content $Source -Encoding UTF8}
          $Target=Join-Path $env:GITHUB_WORKSPACE 'release-status\ddm-snoc-windows-v2.0.6.txt'
          New-Item (Split-Path -Parent $Target) -ItemType Directory -Force | Out-Null
          Copy-Item $Source $Target -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $Target
          if(-not(git diff --cached --quiet)){
            git commit -m 'chore(snoc-windows): registra release final v2 2.0.6'
            git pull --rebase origin main
            git push origin HEAD:main
          }
