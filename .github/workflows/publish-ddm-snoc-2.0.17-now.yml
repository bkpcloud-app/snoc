name: Publish DDM SNOC Windows 2.0.17 Now

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-ddm-snoc-2.0.17-now.yml'

permissions:
  contents: write

concurrency:
  group: publish-ddm-snoc-windows-2.0.17-now
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact official tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ddm-snoc-windows-v2.0.17
          fetch-depth: 0

      - name: Validate exact tagged source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Tag = 'ddm-snoc-windows-v2.0.17'
          $Product = Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          . (Join-Path $Product 'config\DDM-Product.ps1')

          if ([string]$DDMProduct.ProductVersion -ne '2.0.17') {
              throw "Tag interna divergente. Esperado=2.0.17 Obtido=$($DDMProduct.ProductVersion)"
          }

          git fetch origin main --no-tags
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
              throw 'A tag 2.0.17 não aponta para commit pertencente à main.'
          }

          foreach ($File in @(Get-ChildItem $Product -Filter '*.ps1' -Recurse)) {
              $Tokens = $null
              $Errors = $null
              [void][Management.Automation.Language.Parser]::ParseFile(
                  $File.FullName,
                  [ref]$Tokens,
                  [ref]$Errors
              )
              if (@($Errors).Count -gt 0) {
                  throw (@($Errors | ForEach-Object {
                      "$($File.FullName) L$($_.Extent.StartLineNumber): $($_.Message)"
                  }) -join "`r`n")
              }
          }

          & (Join-Path $Product 'tools\Test-DDM-Repository.ps1') -ProductRoot $Product
          if ($LASTEXITCODE -ne 0) { throw "Repository validation returned $LASTEXITCODE" }

          & (Join-Path $Product 'tools\Test-DDM-RuntimeLexing.ps1') -ProductRoot $Product
          if ($LASTEXITCODE -ne 0) { throw "Runtime lexing returned $LASTEXITCODE" }

          & (Join-Path $Product 'tools\Test-DDM-CentralBootstrapLoad.ps1') -ProductRoot $Product
          if ($LASTEXITCODE -ne 0) { throw "Central bootstrap validation returned $LASTEXITCODE" }

          & (Join-Path $Product 'tools\Test-DDM-AclValidation.ps1') -ProductRoot $Product
          if ($LASTEXITCODE -ne 0) { throw "ACL validation returned $LASTEXITCODE" }

          & (Join-Path $Product 'tools\Test-DDM-UncCmd.ps1') -ProductRoot $Product
          if ($LASTEXITCODE -ne 0) { throw "UNC command validation returned $LASTEXITCODE" }

          & (Join-Path $Product 'tools\Test-DDM-ForceRefresh.ps1') -ProductRoot $Product
          if ($LASTEXITCODE -ne 0) { throw "Force validation returned $LASTEXITCODE" }

          & (Join-Path $Product 'tools\Test-DDM-BootstrapFirstInstall.ps1') -ProductRoot $Product
          if ($LASTEXITCODE -ne 0) { throw "Bootstrap first-install returned $LASTEXITCODE" }

          $ScenarioOutput = Join-Path $env:RUNNER_TEMP 'DDM-SNOC-MIGRATION-240-2.0.17-PUBLISH'
          & (Join-Path $Product 'tools\Test-DDM-SNOC-Migration-240Scenarios.ps1') `
              -RepositoryRoot $env:GITHUB_WORKSPACE `
              -OutputDirectory $ScenarioOutput
          if ($LASTEXITCODE -ne 0) { throw "Migration 240 returned $LASTEXITCODE" }

      - name: Build official MOTOR and AD-SEED assets
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Product = Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          . (Join-Path $Product 'config\DDM-Product.ps1')
          $Version = [string]$DDMProduct.ProductVersion
          $Dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $Motor = Join-Path $Dist ('DDM-SNOC-WINDOWS-MOTOR-' + $Version)
          $Seed = Join-Path $Dist ('DDM-SNOC-WINDOWS-AD-SEED-' + $Version)

          Remove-Item $Dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $Motor,$Seed -ItemType Directory -Force | Out-Null

          foreach ($Name in @('Start-DDM-SNOC.ps1','CLIENTE.example.ps1','README.md','CHANGELOG.md')) {
              Copy-Item (Join-Path $Product $Name) (Join-Path $Motor $Name) -Force
          }

          foreach ($Name in @('config','lib','central','bootstrap','endpoint','engine','modules','templates','tools','docs')) {
              Copy-Item (Join-Path $Product $Name) (Join-Path $Motor $Name) -Recurse -Force
          }

          foreach ($Name in @('ATUALIZAR-AD.cmd','VOLTAR-RELEASE.cmd')) {
              Copy-Item (Join-Path $Product ('templates\central\' + $Name)) (Join-Path $Seed $Name) -Force
          }

          Copy-Item (Join-Path $Product 'CLIENTE.example.ps1') (Join-Path $Seed 'CLIENTE.example.ps1') -Force
          Copy-Item (Join-Path $Product 'docs\UPDATE-AD.md') (Join-Path $Seed 'LEIA-ME-UPDATE-AD.md') -Force
          Copy-Item (Join-Path $Product 'docs\AUDITORIA-300-PONTOS.md') (Join-Path $Seed 'AUDITORIA-300-PONTOS.md') -Force

          $Updater = Join-Path $Seed 'CENTRAL-UPDATER'
          foreach ($Rel in @(
              'central\Update-DDM-SNOC-Central.ps1',
              'central\lib\DDM-Central-Client.ps1',
              'central\lib\DDM-Central-Supply.ps1',
              'central\lib\Invoke-DDM-Central-Publish.ps1',
              'config\DDM-Product.ps1',
              'lib\DDM-Common.ps1'
          )) {
              $Source = Join-Path $Product $Rel
              $Destination = Join-Path $Updater $Rel
              New-Item (Split-Path -Parent $Destination) -ItemType Directory -Force | Out-Null
              Copy-Item $Source $Destination -Force
          }

          $RollbackDestination = Join-Path $Seed 'CENTRAL-TOOLS\tools\Set-DDM-CentralRelease.ps1'
          New-Item (Split-Path -Parent $RollbackDestination) -ItemType Directory -Force | Out-Null
          Copy-Item (Join-Path $Product 'tools\Set-DDM-CentralRelease.ps1') $RollbackDestination -Force

          foreach ($Root in @($Motor,$Seed)) {
              $Forbidden = @(Get-ChildItem $Root -Recurse -Force | Where-Object {
                  $_.FullName -match '\\base-package\\|\\\.parts\\|New-BKPCloud-Zabbix-Client'
              })
              if ($Forbidden.Count -gt 0) { throw "Conteúdo legado no asset: $Root" }
          }

          foreach ($Required in @(
              'ATUALIZAR-AD.cmd',
              'VOLTAR-RELEASE.cmd',
              'AUDITORIA-300-PONTOS.md',
              'CENTRAL-UPDATER\central\Update-DDM-SNOC-Central.ps1',
              'CENTRAL-TOOLS\tools\Set-DDM-CentralRelease.ps1'
          )) {
              if (-not (Test-Path (Join-Path $Seed $Required))) {
                  throw "AD-SEED incompleto: $Required"
              }
          }

          $MotorZip = Join-Path $Dist ('DDM-SNOC-WINDOWS-MOTOR-' + $Version + '.zip')
          $SeedZip = Join-Path $Dist ('DDM-SNOC-WINDOWS-AD-SEED-' + $Version + '.zip')
          Compress-Archive -Path $Motor -DestinationPath $MotorZip -CompressionLevel Optimal
          Compress-Archive -Path (Join-Path $Seed '*') -DestinationPath $SeedZip -CompressionLevel Optimal

          $Assets = @()
          foreach ($Zip in @($MotorZip,$SeedZip)) {
              $Hash = (Get-FileHash $Zip -Algorithm SHA256).Hash
              Set-Content -LiteralPath ($Zip + '.sha256') -Value ($Hash + ' *' + (Split-Path -Leaf $Zip)) -Encoding ASCII
              $Assets += New-Object PSObject -Property @{
                  Name = Split-Path -Leaf $Zip
                  Sha256 = $Hash
                  Size = (Get-Item $Zip).Length
              }
          }

          $TagCommit = (git rev-parse HEAD).Trim()
          $Manifest = New-Object PSObject -Property @{
              Product = $DDMProduct.ProductName
              ProductVersion = $Version
              GitCommit = $TagCommit
              GitTag = 'ddm-snoc-windows-v2.0.17'
              GeneratedAtUtc = (Get-Date).ToUniversalTime().ToString('o')
              Assets = $Assets
              Validation = @(
                  'PowerShell parser',
                  'repository controls',
                  'forced full-download validation',
                  '240 migration scenarios',
                  'built MOTOR and AD-SEED assets'
              )
              ExternalPilotsRequired = $true
          }

          $ManifestPath = Join-Path $Dist ('DDM-SNOC-WINDOWS-RELEASE-MANIFEST-' + $Version + '.json')
          $Manifest | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $ManifestPath -Encoding UTF8
          $ManifestHash = (Get-FileHash $ManifestPath -Algorithm SHA256).Hash
          Set-Content -LiteralPath ($ManifestPath + '.sha256') -Value ($ManifestHash + ' *' + (Split-Path -Leaf $ManifestPath)) -Encoding ASCII

          Write-Host "MOTOR_SHA256=$((Get-FileHash $MotorZip -Algorithm SHA256).Hash)"
          Write-Host "AD_SEED_SHA256=$((Get-FileHash $SeedZip -Algorithm SHA256).Hash)"
          Write-Host "MANIFEST_SHA256=$ManifestHash"

      - name: Inspect final MOTOR package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Product = Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          . (Join-Path $Product 'config\DDM-Product.ps1')
          $Zip = Join-Path $env:GITHUB_WORKSPACE ('dist\DDM-SNOC-WINDOWS-MOTOR-' + $DDMProduct.ProductVersion + '.zip')
          $Expanded = Join-Path $env:RUNNER_TEMP 'ddm-snoc-2.0.17-final-motor'
          Remove-Item $Expanded -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $Zip -DestinationPath $Expanded -Force
          $ExpandedProduct = Join-Path $Expanded ('DDM-SNOC-WINDOWS-MOTOR-' + $DDMProduct.ProductVersion)
          & (Join-Path $ExpandedProduct 'tools\Test-DDM-Repository.ps1') -ProductRoot $ExpandedProduct
          if ($LASTEXITCODE -ne 0) { throw "Final MOTOR validation returned $LASTEXITCODE" }
          & (Join-Path $ExpandedProduct 'tools\Test-DDM-ForceRefresh.ps1') -ProductRoot $ExpandedProduct
          if ($LASTEXITCODE -ne 0) { throw "Final MOTOR Force validation returned $LASTEXITCODE" }

      - name: Publish or repair official GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Tag = 'ddm-snoc-windows-v2.0.17'
          $VerifiedTag = 'verified-ddm-snoc-windows-2.0.17'
          $Dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $Files = @(
              (Join-Path $Dist 'DDM-SNOC-WINDOWS-MOTOR-2.0.17.zip'),
              (Join-Path $Dist 'DDM-SNOC-WINDOWS-MOTOR-2.0.17.zip.sha256'),
              (Join-Path $Dist 'DDM-SNOC-WINDOWS-AD-SEED-2.0.17.zip'),
              (Join-Path $Dist 'DDM-SNOC-WINDOWS-AD-SEED-2.0.17.zip.sha256'),
              (Join-Path $Dist 'DDM-SNOC-WINDOWS-RELEASE-MANIFEST-2.0.17.json'),
              (Join-Path $Dist 'DDM-SNOC-WINDOWS-RELEASE-MANIFEST-2.0.17.json.sha256')
          )

          gh release view $Tag --repo bkpcloud-app/snoc *> $null
          $Exists = $LASTEXITCODE -eq 0

          if ($Exists) {
              gh release upload $Tag @Files --repo bkpcloud-app/snoc --clobber
              if ($LASTEXITCODE -ne 0) { throw "gh release upload returned $LASTEXITCODE" }
              gh release edit $Tag --repo bkpcloud-app/snoc --title 'DDM SNOC Windows 2.0.17' --draft=false --prerelease=false
              if ($LASTEXITCODE -ne 0) { throw "gh release edit returned $LASTEXITCODE" }
          }
          else {
              gh release create $Tag @Files --repo bkpcloud-app/snoc --verify-tag --generate-notes --title 'DDM SNOC Windows 2.0.17'
              if ($LASTEXITCODE -ne 0) { throw "gh release create returned $LASTEXITCODE" }
          }

          $Headers = @{
              'User-Agent' = 'DDM-SNOC-Windows-Release-Publisher'
              'Accept' = 'application/vnd.github+json'
              'Authorization' = 'Bearer ' + $env:GH_TOKEN
              'X-GitHub-Api-Version' = '2022-11-28'
          }
          $Uri = 'https://api.github.com/repos/bkpcloud-app/snoc/releases/tags/' + $Tag
          $Release = Invoke-RestMethod -Uri $Uri -Headers $Headers -TimeoutSec 30
          $Expected = @(
              'DDM-SNOC-WINDOWS-MOTOR-2.0.17.zip',
              'DDM-SNOC-WINDOWS-MOTOR-2.0.17.zip.sha256',
              'DDM-SNOC-WINDOWS-AD-SEED-2.0.17.zip',
              'DDM-SNOC-WINDOWS-AD-SEED-2.0.17.zip.sha256',
              'DDM-SNOC-WINDOWS-RELEASE-MANIFEST-2.0.17.json',
              'DDM-SNOC-WINDOWS-RELEASE-MANIFEST-2.0.17.json.sha256'
          )
          $Names = @($Release.assets | ForEach-Object { [string]$_.name })
          $Missing = @($Expected | Where-Object { $Names -notcontains $_ })
          if ([bool]$Release.draft -or [bool]$Release.prerelease -or $Missing.Count -gt 0) {
              throw "Release incompleta. Missing=$($Missing -join ', ')"
          }

          $TagCommit = (git rev-parse HEAD).Trim()
          git fetch origin --tags
          $ExistingVerified = git rev-parse -q --verify ("refs/tags/" + $VerifiedTag) 2>$null
          if ($LASTEXITCODE -eq 0) {
              $ExistingVerified = ([string]$ExistingVerified).Trim()
              if ($ExistingVerified -ne $TagCommit) {
                  throw "Verification tag exists at $ExistingVerified instead of $TagCommit"
              }
          }
          else {
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git tag -a $VerifiedTag $TagCommit -m 'DDM SNOC Windows 2.0.17 official assets verified'
              git push origin ("refs/tags/" + $VerifiedTag)
          }

          Write-Host "RELEASE_VERIFIED_ID=$($Release.id)"
          foreach ($Name in $Expected) { Write-Host "ASSET_OK=$Name" }
