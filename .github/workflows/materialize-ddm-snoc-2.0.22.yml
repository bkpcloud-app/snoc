name: Materialize DDM SNOC Windows 2.0.22

on:
  pull_request:
    paths:
      - 'windows/zabbix-agent-deployment/**'
      - '.github/workflows/materialize-ddm-snoc-2.0.22.yml'

permissions:
  contents: write

jobs:
  materialize-validate:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Materialize exact 2.0.22 source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Patch = Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment\tools\Promote-DDM-SNOC-2.0.22.ps1'
          & $Patch -RepositoryRoot $env:GITHUB_WORKSPACE
          if (-not $?) { throw '2.0.22 promotion patch failed.' }

      - name: Execute repository validation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Product = Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          foreach ($Test in @(
              'Test-DDM-Repository.ps1',
              'Test-DDM-RuntimeLexing.ps1',
              'Test-DDM-CentralBootstrapLoad.ps1',
              'Test-DDM-AclValidation.ps1',
              'Test-DDM-UncCmd.ps1',
              'Test-DDM-ForceRefresh.ps1',
              'Test-DDM-CentralRecovery.ps1',
              'Test-DDM-CentralPathIdentity.ps1',
              'Test-DDM-BootstrapFirstInstall.ps1'
          )) {
              & (Join-Path $Product ('tools\' + $Test)) -ProductRoot $Product
              if (-not $?) { throw "$Test returned failure." }
          }

      - name: Execute all 240 migration scenarios
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $global:ProductCode = '$ProductCode'
          $Script = Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment\tools\Test-DDM-SNOC-Migration-240Scenarios.ps1'
          $Output = Join-Path $env:RUNNER_TEMP 'DDM-SNOC-MIGRATION-240-2.0.22'
          & $Script -RepositoryRoot $env:GITHUB_WORKSPACE -OutputDirectory $Output
          if (-not $?) { throw 'Migration validation returned failure.' }

      - name: Remove temporary materializer and commit validated source
        shell: powershell
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          git rm --ignore-unmatch windows/zabbix-agent-deployment/tools/Promote-DDM-SNOC-2.0.22.ps1
          git rm --ignore-unmatch .github/workflows/materialize-ddm-snoc-2.0.22.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if (-not (git status --porcelain)) { throw 'No validated 2.0.22 changes to commit.' }
          git commit -m 'fix(windows): materialize validated 2.0.22 runtime diagnostics'
          git push origin HEAD:$env:HEAD_BRANCH

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: DDM-SNOC-WINDOWS-2.0.22-MATERIALIZATION
          path: |
            ${{ runner.temp }}/DDM-SNOC-MIGRATION-240-2.0.22
            windows/zabbix-agent-deployment/config/DDM-Product.ps1
            windows/zabbix-agent-deployment/templates/central/GPO-DIARIA.cmd
            windows/zabbix-agent-deployment/tools/Test-DDM-Repository.ps1
            windows/zabbix-agent-deployment/docs/RELEASE-2.0.22.md
          if-no-files-found: warn
          retention-days: 30
