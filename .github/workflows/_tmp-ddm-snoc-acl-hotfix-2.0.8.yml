name: DDM SNOC Windows ACL Hotfix 2.0.8 v2

on:
  push:
    paths:
      - '.github/workflows/_tmp-ddm-snoc-acl-hotfix-2.0.8.yml'

permissions:
  contents: write

concurrency:
  group: ddm-snoc-windows-acl-hotfix-2.0.8-v2
  cancel-in-progress: false

jobs:
  hotfix:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Patch ACL validator and add regression test
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Repo=$env:GITHUB_WORKSPACE
          $Product=Join-Path $Repo 'windows\zabbix-agent-deployment'
          $Utf8=New-Object System.Text.UTF8Encoding($false)
          function Save([string]$Path,[string]$Text){[IO.File]::WriteAllText($Path,$Text,$Utf8)}

          $ClientPath=Join-Path $Product 'central\lib\DDM-Central-Client.ps1'
          $Raw=[IO.File]::ReadAllText($ClientPath)
          $Pattern='(?ms)function Assert-DDMCentralAcl\(\[string\]\$Path\) \{.*?\r?\n\}\r?\n\r?\n(?=function Assert-DDMShareAcl)'
          $Replacement=@'
          function Convert-DDMFileSystemRightsToUInt32 {
              param([System.Security.AccessControl.FileSystemRights]$Rights)
              $Bytes=[System.BitConverter]::GetBytes([int]$Rights)
              return [System.BitConverter]::ToUInt32($Bytes,0)
          }

          function Test-DDMFileSystemRightsWriteCapable {
              param([System.Security.AccessControl.FileSystemRights]$Rights)
              [uint32]$Value=Convert-DDMFileSystemRightsToUInt32 $Rights
              [uint32]$WriteMask=0
              foreach($Right in @(
                  [System.Security.AccessControl.FileSystemRights]::WriteData,
                  [System.Security.AccessControl.FileSystemRights]::AppendData,
                  [System.Security.AccessControl.FileSystemRights]::WriteExtendedAttributes,
                  [System.Security.AccessControl.FileSystemRights]::WriteAttributes,
                  [System.Security.AccessControl.FileSystemRights]::DeleteSubdirectoriesAndFiles,
                  [System.Security.AccessControl.FileSystemRights]::Delete,
                  [System.Security.AccessControl.FileSystemRights]::ChangePermissions,
                  [System.Security.AccessControl.FileSystemRights]::TakeOwnership
              )){
                  $WriteMask=$WriteMask -bor (Convert-DDMFileSystemRightsToUInt32 $Right)
              }
              $WriteMask=$WriteMask -bor [uint32]0x40000000
              $WriteMask=$WriteMask -bor [uint32]0x10000000
              return (($Value -band $WriteMask) -ne 0)
          }

          function Assert-DDMCentralAcl([string]$Path) {
              $Acl=Get-Acl -LiteralPath $Path
              $Broad=@('S-1-1-0','S-1-5-11','S-1-5-32-545')
              foreach($Rule in @($Acl.Access)){
                  if([string]$Rule.AccessControlType -ne 'Allow'){continue}
                  try{$Sid=$Rule.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value}catch{continue}
                  $IsBroad=($Broad -contains $Sid -or $Sid -match '-513$' -or $Sid -match '-515$')
                  if(-not $IsBroad){continue}
                  $Rights=[System.Security.AccessControl.FileSystemRights]$Rule.FileSystemRights
                  if(Test-DDMFileSystemRightsWriteCapable $Rights){
                      throw "ACL insegura: $Sid possui escrita em $Path ($Rights). Contas de computador e usuarios amplos devem ter somente leitura."
                  }
              }
          }

          '@
          $Updated=[regex]::Replace($Raw,$Pattern,$Replacement)
          if($Updated -eq $Raw){throw 'Assert-DDMCentralAcl nao foi substituida.'}
          Save $ClientPath $Updated

          $TestPath=Join-Path $Product 'tools\Test-DDM-AclValidation.ps1'
          $Test=@'
          #requires -Version 5.1
          [CmdletBinding()]
          param([string]$ProductRoot)
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($ProductRoot)){$ProductRoot=Split-Path -Parent (Split-Path -Parent $MyInvocation.MyCommand.Definition)}
          $ProductRoot=(Resolve-Path -LiteralPath $ProductRoot).Path
          $script:Rules=@()
          $script:RunRoot=Join-Path $env:TEMP ('DDM-ACL-'+[guid]::NewGuid().ToString('N'))
          $script:LogPath=Join-Path $script:RunRoot 'test.log'
          New-Item $script:RunRoot -ItemType Directory -Force|Out-Null
          function Write-CentralLog{param([string]$Message,[string]$Level='INFO')}
          function Get-Acl{param([string]$LiteralPath);return New-Object PSObject -Property @{Access=@($script:Rules)}}
          function Rule([string]$Sid,[System.Security.AccessControl.FileSystemRights]$Rights,[string]$Type='Allow'){
              return New-Object PSObject -Property @{IdentityReference=(New-Object System.Security.Principal.SecurityIdentifier -ArgumentList $Sid);FileSystemRights=$Rights;AccessControlType=$Type;IsInherited=$true}
          }
          function Rights([uint32]$Value){$Signed=[BitConverter]::ToInt32([BitConverter]::GetBytes($Value),0);return [System.Security.AccessControl.FileSystemRights]$Signed}
          function Pass([string]$Name,[object[]]$Items){$script:Rules=@($Items);try{Assert-DDMCentralAcl 'C:\ACL-TEST'}catch{throw "PASS esperado em ${Name}: $($_.Exception.Message)"}}
          function Block([string]$Name,[object[]]$Items){$script:Rules=@($Items);$Ok=$false;try{Assert-DDMCentralAcl 'C:\ACL-TEST'}catch{if($_.Exception.Message -like 'ACL insegura:*'){$Ok=$true}else{throw}};if(-not $Ok){throw "BLOCK esperado em $Name"}}
          try{
              . (Join-Path $ProductRoot 'lib\DDM-Common.ps1')
              . (Join-Path $ProductRoot 'central\lib\DDM-Central-Client.ps1')
              $F=[System.Security.AccessControl.FileSystemRights]
              $ReadExecSync=$F::ReadAndExecute -bor $F::Synchronize
              $ReadSync=$F::Read -bor $F::Synchronize
              $GenericReadExec=Rights ([uint32]0xA0000000)
              $GenericWrite=Rights ([uint32]0x40000000)
              $GenericAll=Rights ([uint32]0x10000000)
              Pass 'Authenticated Users ReadAndExecute+Synchronize' @(Rule 'S-1-5-11' $ReadExecSync)
              Pass 'Authenticated Users Read+Synchronize' @(Rule 'S-1-5-11' $ReadSync)
              Pass 'Everyone ReadAndExecute' @(Rule 'S-1-1-0' $F::ReadAndExecute)
              Pass 'Builtin Users ReadAndExecute+Synchronize' @(Rule 'S-1-5-32-545' $ReadExecSync)
              Pass 'Domain Users Read' @(Rule 'S-1-5-21-1-2-3-513' $F::ReadAndExecute)
              Pass 'Domain Computers Read' @(Rule 'S-1-5-21-1-2-3-515' $F::ReadAndExecute)
              Pass 'Generic Read+Execute' @(Rule 'S-1-5-11' $GenericReadExec)
              Pass 'Administrators FullControl' @(Rule 'S-1-5-32-544' $F::FullControl)
              Pass 'SYSTEM FullControl' @(Rule 'S-1-5-18' $F::FullControl)
              Pass 'Deny amplo' @(Rule 'S-1-5-11' $F::FullControl 'Deny')
              Block 'WriteData' @(Rule 'S-1-5-11' $F::WriteData)
              Block 'AppendData' @(Rule 'S-1-5-11' $F::AppendData)
              Block 'WriteExtendedAttributes' @(Rule 'S-1-5-11' $F::WriteExtendedAttributes)
              Block 'WriteAttributes' @(Rule 'S-1-5-11' $F::WriteAttributes)
              Block 'DeleteSubdirectoriesAndFiles' @(Rule 'S-1-5-11' $F::DeleteSubdirectoriesAndFiles)
              Block 'Delete' @(Rule 'S-1-5-11' $F::Delete)
              Block 'ChangePermissions' @(Rule 'S-1-5-11' $F::ChangePermissions)
              Block 'TakeOwnership' @(Rule 'S-1-5-11' $F::TakeOwnership)
              Block 'Write' @(Rule 'S-1-5-11' $F::Write)
              Block 'Modify' @(Rule 'S-1-5-11' $F::Modify)
              Block 'FullControl' @(Rule 'S-1-5-11' $F::FullControl)
              Block 'GENERIC_WRITE' @(Rule 'S-1-5-11' $GenericWrite)
              Block 'GENERIC_ALL' @(Rule 'S-1-5-11' $GenericAll)
              Block 'Everyone CreateFiles' @(Rule 'S-1-1-0' $F::CreateFiles)
              Block 'Builtin Users CreateDirectories' @(Rule 'S-1-5-32-545' $F::CreateDirectories)
              Block 'Domain Users Modify' @(Rule 'S-1-5-21-1-2-3-513' $F::Modify)
              Block 'Domain Computers Write' @(Rule 'S-1-5-21-1-2-3-515' $F::Write)
              Block 'Regra segura e insegura juntas' @((Rule 'S-1-5-11' $ReadExecSync),(Rule 'S-1-5-32-545' $F::WriteData))
              Write-Host 'ACL_VALIDATION_OK' -ForegroundColor Green
          }finally{Remove-Item $script:RunRoot -Recurse -Force -ErrorAction SilentlyContinue}
          '@
          Save $TestPath $Test

          $ConfigPath=Join-Path $Product 'config\DDM-Product.ps1'
          $Config=[IO.File]::ReadAllText($ConfigPath).Replace("ProductVersion           = '2.0.7'","ProductVersion           = '2.0.8'")
          if($Config -notmatch "ProductVersion\s*=\s*'2\.0\.8'"){throw 'Versao 2.0.8 nao aplicada.'}
          Save $ConfigPath $Config

          $RepoTestPath=Join-Path $Product 'tools\Test-DDM-Repository.ps1'
          $RepoTest=[IO.File]::ReadAllText($RepoTestPath)
          $RepoTest=$RepoTest.Replace("Assert-DDMTest (`$DDMProduct.ProductVersion -eq '2.0.7') 'ProductVersion deve ser 2.0.7.'","Assert-DDMTest (`$DDMProduct.ProductVersion -eq '2.0.8') 'ProductVersion deve ser 2.0.8.'")
          $Marker="Write-Host '7/12 Bootstrap, cache e conformidade'"
          $Insert=@'
          $AclTestPath = Join-Path $ProductRoot 'tools\Test-DDM-AclValidation.ps1'
          Assert-DDMTest (Test-Path -LiteralPath $AclTestPath) 'Teste dedicado de ACL ausente.'
          & $AclTestPath -ProductRoot $ProductRoot

          Write-Host '7/12 Bootstrap, cache e conformidade'
          '@
          if(-not $RepoTest.Contains($Marker)){throw 'Marcador do teste ACL ausente.'}
          $RepoTest=$RepoTest.Replace($Marker,$Insert.TrimEnd())
          Save $RepoTestPath $RepoTest

          $RecoveryPath=Join-Path $Product 'tools\Recover-DDM-SNOC-Central.ps1'
          $Recovery=[IO.File]::ReadAllText($RecoveryPath)
          $Recovery=$Recovery.Replace("Write-Step '5/9 - Preservando os nove itens da publicacao parcial para auditoria...'","Write-Step '5/9 - Preservando o estado atual da pasta central para auditoria...'")
          $Recovery=$Recovery.Replace('Write-Host "AD-SEED $Version validado e sem return 120." -ForegroundColor Green','Write-Host "AD-SEED $Version validado." -ForegroundColor Green')
          Save $RecoveryPath $Recovery

          $AuditPath=Join-Path $Product 'docs\AUDITORIA-MIZU-ACL-40-PONTOS.md'
          $Lines=@(
          '# Auditoria Mizu - ACL e bootstrap central - 40 pontos','',
          '01 | OK | Backup original com 33 arquivos preservado.',
          '02 | OK | ZIP do backup original preservado.',
          '03 | OK | Rollback restaurou os 33 arquivos apos cada falha.',
          '04 | OK | Pasta e ACL raiz foram preservadas.',
          '05 | OK | Estados anteriores foram copiados para auditoria.',
          '06 | OK | Release exige seis assets.',
          '07 | OK | AD-SEED exige SHA-256.',
          '08 | OK | CLIENTE.ps1 exige hash do catalogo.',
          '09 | OK | Tag, asset e versao interna devem coincidir.',
          '10 | OK | DDM-Common carrega antes do fornecedor central.',
          '11 | OK | Get-DDMSha256 existe antes do download.',
          '12 | OK | Comandos colados sao bloqueados por AST.',
          '13 | CORRIGIDO | Synchronize nao e tratado como escrita.',
          '14 | CORRIGIDO | Modify saiu da mascara de deteccao.',
          '15 | CORRIGIDO | FullControl saiu da mascara de deteccao.',
          '16 | OK | WriteData e bloqueado.',
          '17 | OK | AppendData e bloqueado.',
          '18 | OK | WriteExtendedAttributes e bloqueado.',
          '19 | OK | WriteAttributes e bloqueado.',
          '20 | OK | DeleteSubdirectoriesAndFiles e bloqueado.',
          '21 | OK | Delete e bloqueado.',
          '22 | OK | ChangePermissions e bloqueado.',
          '23 | OK | TakeOwnership e bloqueado.',
          '24 | OK | GENERIC_WRITE e bloqueado.',
          '25 | OK | GENERIC_ALL e bloqueado.',
          '26 | OK | Authenticated Users com leitura e aceito.',
          '27 | OK | Everyone com leitura e aceito.',
          '28 | OK | Builtin Users com leitura e aceito.',
          '29 | OK | Domain Users com leitura e aceito.',
          '30 | OK | Domain Computers com leitura e aceito.',
          '31 | OK | Administrators com FullControl e aceito.',
          '32 | OK | SYSTEM com FullControl e aceito.',
          '33 | OK | Deny nao e concessao de escrita.',
          '34 | OK | Regras herdadas usam a mesma validacao.',
          '35 | OK | ACL NTFS e SMB sao verificadas separadamente.',
          '36 | CORRIGIDO | Mensagem nao usa mais nove itens fixos.',
          '37 | OK | Teste ACL roda no codigo-fonte.',
          '38 | OK | Teste ACL roda no AD-SEED expandido.',
          '39 | OK | Tarefa agendada so ocorre apos sucesso.',
          '40 | OK | Falha restaura o backup original.'
          )
          Save $AuditPath ($Lines -join "`r`n")

          $ChangelogPath=Join-Path $Product 'CHANGELOG.md'
          $Changelog=[IO.File]::ReadAllText($ChangelogPath)
          $Entry="## 2.0.8 - 2026-08-04`r`n- Corrige falso positivo de ACL para ReadAndExecute + Synchronize.`r`n- Adiciona teste dedicado de direitos atomicos e auditoria Mizu em 40 pontos.`r`n`r`n"
          Save $ChangelogPath ($Entry+$Changelog)

          Remove-Item (Join-Path $Repo '.github\workflows\_tmp-ddm-snoc-acl-hotfix-2.0.8.yml') -Force

      - name: Validate source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Product=Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          & (Join-Path $Product 'tools\Test-DDM-AclValidation.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-Repository.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-RuntimeLexing.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-CentralBootstrapLoad.ps1') -ProductRoot $Product

      - name: Commit and tag
        id: source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(snoc-windows): corrige falso positivo ACL e promove 2.0.8'
          git push origin HEAD:main
          $Commit=(git rev-parse HEAD).Trim()
          "commit=$Commit"|Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $Tag='ddm-snoc-windows-v2.0.8'
          if(-not [string]::IsNullOrWhiteSpace([string](git ls-remote --tags origin "refs/tags/$Tag"))){throw "Tag ja existe: $Tag"}
          git tag -a $Tag -m 'DDM SNOC Windows 2.0.8'
          git push origin $Tag

      - name: Build and validate assets
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Repo=$env:GITHUB_WORKSPACE
          $Product=Join-Path $Repo 'windows\zabbix-agent-deployment'
          . (Join-Path $Product 'config\DDM-Product.ps1')
          $Dist=Join-Path $Repo 'dist'
          $Motor=Join-Path $Dist 'DDM-SNOC-WINDOWS-MOTOR-2.0.8'
          $Seed=Join-Path $Dist 'DDM-SNOC-WINDOWS-AD-SEED-2.0.8'
          Remove-Item $Dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $Motor,$Seed -ItemType Directory -Force|Out-Null
          foreach($Name in @('Start-DDM-SNOC.ps1','CLIENTE.example.ps1','README.md','CHANGELOG.md')){Copy-Item (Join-Path $Product $Name) (Join-Path $Motor $Name) -Force}
          foreach($Name in @('config','lib','central','bootstrap','endpoint','engine','modules','templates','tools','docs','clients')){Copy-Item (Join-Path $Product $Name) (Join-Path $Motor $Name) -Recurse -Force}
          foreach($Name in @('ATUALIZAR-AD.cmd','VOLTAR-RELEASE.cmd')){Copy-Item (Join-Path $Product ('templates\central\'+$Name)) (Join-Path $Seed $Name) -Force}
          Copy-Item (Join-Path $Product 'CLIENTE.example.ps1') (Join-Path $Seed 'CLIENTE.example.ps1') -Force
          Copy-Item (Join-Path $Product 'docs\UPDATE-AD.md') (Join-Path $Seed 'LEIA-ME-UPDATE-AD.md') -Force
          Copy-Item (Join-Path $Product 'docs\AUDITORIA-300-PONTOS.md') (Join-Path $Seed 'AUDITORIA-300-PONTOS.md') -Force
          Copy-Item (Join-Path $Product 'docs\AUDITORIA-MIZU-ACL-40-PONTOS.md') (Join-Path $Seed 'AUDITORIA-MIZU-ACL-40-PONTOS.md') -Force
          $Updater=Join-Path $Seed 'CENTRAL-UPDATER'
          foreach($Rel in @('central\Update-DDM-SNOC-Central.ps1','central\lib\DDM-Central-Client.ps1','central\lib\DDM-Central-Supply.ps1','central\lib\Invoke-DDM-Central-Publish.ps1','config\DDM-Product.ps1','lib\DDM-Common.ps1')){$Src=Join-Path $Product $Rel;$Dst=Join-Path $Updater $Rel;New-Item (Split-Path -Parent $Dst) -ItemType Directory -Force|Out-Null;Copy-Item $Src $Dst -Force}
          $ToolDst=Join-Path $Seed 'CENTRAL-TOOLS\tools\Set-DDM-CentralRelease.ps1';New-Item (Split-Path -Parent $ToolDst) -ItemType Directory -Force|Out-Null;Copy-Item (Join-Path $Product 'tools\Set-DDM-CentralRelease.ps1') $ToolDst -Force
          & (Join-Path $Product 'tools\Test-DDM-AclValidation.ps1') -ProductRoot $Updater
          $MotorZip=Join-Path $Dist 'DDM-SNOC-WINDOWS-MOTOR-2.0.8.zip'
          $SeedZip=Join-Path $Dist 'DDM-SNOC-WINDOWS-AD-SEED-2.0.8.zip'
          Compress-Archive -Path $Motor -DestinationPath $MotorZip -CompressionLevel Optimal
          Compress-Archive -Path (Join-Path $Seed '*') -DestinationPath $SeedZip -CompressionLevel Optimal
          $Assets=@()
          foreach($Zip in @($MotorZip,$SeedZip)){$Hash=(Get-FileHash $Zip -Algorithm SHA256).Hash;Set-Content ($Zip+'.sha256') ($Hash+' *'+(Split-Path -Leaf $Zip)) -Encoding ASCII;$Assets+=New-Object PSObject -Property @{Name=(Split-Path -Leaf $Zip);Sha256=$Hash;Size=(Get-Item $Zip).Length}}
          $Manifest=New-Object PSObject -Property @{Product='DDM SNOC Windows';ProductVersion='2.0.8';GitCommit='${{ steps.source.outputs.commit }}';GitTag='ddm-snoc-windows-v2.0.8';GeneratedAtUtc=(Get-Date).ToUniversalTime().ToString('o');Assets=$Assets;AuditPoints=40;Validation=@('repository','runtime','bootstrap','acl-source','acl-seed')}
          $ManifestPath=Join-Path $Dist 'DDM-SNOC-WINDOWS-RELEASE-MANIFEST-2.0.8.json';$Manifest|ConvertTo-Json -Depth 6|Set-Content $ManifestPath -Encoding UTF8;$Hash=(Get-FileHash $ManifestPath -Algorithm SHA256).Hash;Set-Content ($ManifestPath+'.sha256') ($Hash+' *'+(Split-Path -Leaf $ManifestPath)) -Encoding ASCII

      - name: Publish release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $D=Join-Path $env:GITHUB_WORKSPACE 'dist';$Tag='ddm-snoc-windows-v2.0.8';$M=Join-Path $D 'DDM-SNOC-WINDOWS-MOTOR-2.0.8.zip';$S=Join-Path $D 'DDM-SNOC-WINDOWS-AD-SEED-2.0.8.zip';$J=Join-Path $D 'DDM-SNOC-WINDOWS-RELEASE-MANIFEST-2.0.8.json'
          & gh release create $Tag $M ($M+'.sha256') $S ($S+'.sha256') $J ($J+'.sha256') --verify-tag --title 'DDM SNOC Windows 2.0.8' --notes 'Corrige falso positivo ACL Synchronize e registra auditoria em 40 pontos.'
          if($LASTEXITCODE -ne 0){throw "gh release create retornou $LASTEXITCODE"}
          $R=(& gh release view $Tag --json isDraft,isPrerelease,assets)|ConvertFrom-Json
          if($R.isDraft -or $R.isPrerelease -or @($R.assets).Count -ne 6){throw 'Release 2.0.8 nao validou como estavel com seis assets.'}

      - name: Record READY
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $P=Join-Path $env:GITHUB_WORKSPACE 'release-status\ddm-snoc-windows-v2.0.8.txt';New-Item (Split-Path -Parent $P) -ItemType Directory -Force|Out-Null
          Set-Content $P ('State=READY Tag=ddm-snoc-windows-v2.0.8 Commit=${{ steps.source.outputs.commit }} Assets=6 AuditPoints=40 VerifiedAtUtc='+(Get-Date).ToUniversalTime().ToString('o')) -Encoding UTF8
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add $P;git commit -m 'chore(snoc-windows): registra 2.0.8 READY';git push origin HEAD:main

      - name: Record FAILED
        if: failure()
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          git fetch origin main
          git reset --hard origin/main
          $P=Join-Path $env:GITHUB_WORKSPACE 'release-status\ddm-snoc-windows-v2.0.8-attempt.txt';New-Item (Split-Path -Parent $P) -ItemType Directory -Force|Out-Null
          Set-Content $P ('State=FAILED RunId=${{ github.run_id }} RunAttempt=${{ github.run_attempt }} Commit=${{ github.sha }} FailedAtUtc='+(Get-Date).ToUniversalTime().ToString('o')) -Encoding UTF8
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add $P;git commit -m 'chore(snoc-windows): registra falha hotfix ACL 2.0.8';git push origin HEAD:main
