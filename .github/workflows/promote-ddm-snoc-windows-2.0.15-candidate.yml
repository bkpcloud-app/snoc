name: Promote DDM SNOC Windows 2.0.15 Candidate

on:
  pull_request:
    paths:
      - 'windows/zabbix-agent-deployment/engine/Install-DDM-Zabbix-Windows.ps1'
      - 'windows/zabbix-agent-deployment/config/DDM-Product.ps1'
      - 'windows/zabbix-agent-deployment/CHANGELOG.md'
      - 'windows/zabbix-agent-deployment/tools/Build-DDM-SNOC-MigrationCandidate.ps1'
      - 'windows/zabbix-agent-deployment/tools/Test-DDM-SNOC-Migration-240Scenarios.ps1'
      - '.github/workflows/promote-ddm-snoc-windows-2.0.15-candidate.yml'

permissions:
  contents: write

jobs:
  promote-candidate:
    if: github.head_ref == 'audit/srv-ae-migration-120'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Materialize exact audited candidate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Root = Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          $Engine = Join-Path $Root 'engine\Install-DDM-Zabbix-Windows.ps1'
          $Config = Join-Path $Root 'config\DDM-Product.ps1'
          $ChangeLog = Join-Path $Root 'CHANGELOG.md'
          $Builder = Join-Path $Root 'tools\Build-DDM-SNOC-MigrationCandidate.ps1'
          $ExpectedEngineHash = 'E034E3D6026414BA64ECDD8DAE16215D8E4AC0266D7583284900340FBE633EBD'

          $CurrentHash = (Get-FileHash -LiteralPath $Engine -Algorithm SHA256).Hash
          if ($CurrentHash -ne $ExpectedEngineHash) {
              & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $Builder -RepositoryRoot $env:GITHUB_WORKSPACE
              if ($LASTEXITCODE -ne 0) { throw "Candidate builder returned $LASTEXITCODE" }
          }

          $CurrentHash = (Get-FileHash -LiteralPath $Engine -Algorithm SHA256).Hash
          if ($CurrentHash -ne $ExpectedEngineHash) {
              throw "Engine hash mismatch. Expected=$ExpectedEngineHash Current=$CurrentHash"
          }

          $ConfigText = [IO.File]::ReadAllText($Config)
          $ConfigText = $ConfigText.Replace("ProductVersion           = '2.0.14'","ProductVersion           = '2.0.15'")
          if ($ConfigText -notmatch "ProductVersion\s*=\s*'2\.0\.15'") {
              throw 'ProductVersion 2.0.15 was not applied.'
          }
          [IO.File]::WriteAllText($Config,$ConfigText,(New-Object Text.UTF8Encoding($false)))

          $ChangeText = [IO.File]::ReadAllText($ChangeLog)
          if ($ChangeText -notmatch '(?m)^## 2\.0\.15 ') {
              $Header = @"
## 2.0.15 - 2026-08-05
- Corrige a ordem transacional: backup completo antes de parar os agentes.
- Envia SERVER, SERVERACTIVE, HOSTNAME, HOSTMETADATA e LISTENPORT ao MSI do Agent 2.
- Mantem o Agent 1 ate validar configuracao, servico, porta e plugins do Agent 2.
- Valida 240 cenarios de migracao, falha e rollback sem reprovacoes.

"@
              [IO.File]::WriteAllText($ChangeLog,$Header+$ChangeText,(New-Object Text.UTF8Encoding($false)))
          }

      - name: Parse exact candidate sources
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Root = Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          foreach ($File in @(Get-ChildItem $Root -Filter '*.ps1' -Recurse)) {
              $Tokens = $null
              $Errors = $null
              [void][Management.Automation.Language.Parser]::ParseFile($File.FullName,[ref]$Tokens,[ref]$Errors)
              if (@($Errors).Count -gt 0) {
                  throw (@($Errors | ForEach-Object { "$($File.FullName) L$($_.Extent.StartLineNumber): $($_.Message)" }) -join "`r`n")
              }
          }

      - name: Execute all 240 migration scenarios on exact candidate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $global:ProductCode = '$ProductCode'
          $Script = Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment\tools\Test-DDM-SNOC-Migration-240Scenarios.ps1'
          $Output = Join-Path $env:RUNNER_TEMP 'DDM-SNOC-MIGRATION-240-FINAL-CANDIDATE'
          . $Script -RepositoryRoot $env:GITHUB_WORKSPACE -OutputDirectory $Output

      - name: Execute full product validation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Product = Join-Path $env:GITHUB_WORKSPACE 'windows\zabbix-agent-deployment'
          & (Join-Path $Product 'tools\Test-DDM-Repository.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-RuntimeLexing.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-CentralBootstrapLoad.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-AclValidation.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-UncCmd.ps1') -ProductRoot $Product
          & (Join-Path $Product 'tools\Test-DDM-BootstrapFirstInstall.ps1') -ProductRoot $Product

      - name: Commit exact audited candidate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'windows/zabbix-agent-deployment/engine/Install-DDM-Zabbix-Windows.ps1'
          git add -- 'windows/zabbix-agent-deployment/config/DDM-Product.ps1'
          git add -- 'windows/zabbix-agent-deployment/CHANGELOG.md'
          git add -- 'windows/zabbix-agent-deployment/tools/Test-DDM-SNOC-Migration-240Scenarios.ps1'
          if (-not (git diff --cached --quiet)) {
              git commit -m 'fix(windows): promote audited migration engine 2.0.15'
              git push origin HEAD:${{ github.head_ref }}
          }
